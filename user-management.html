<!DOCTYPE html>
<html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>User Management</title><script src="app-shell.js" defer></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#071426;color:#f3f7ff;font-family:'Segoe UI',Arial,sans-serif;overflow-x:hidden}
.wrap{max-width:1040px;margin:auto;padding:14px}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat-card{background:#0c2038;border:1px solid #244365;border-radius:12px;padding:10px 12px;text-align:center}
.stat-card small{display:block;color:#9dc8e4;font-size:11.5px;margin-bottom:3px}
.stat-card strong{font-size:20px;color:#38bdf8}
.stat-card.active strong{color:#4ade80}
.stat-card.pending strong{color:#facc15}
.stat-card.inactive strong{color:#f87171}
.panel{background:#0c2038;border:1px solid #244365;border-radius:14px;padding:14px;margin:10px 0}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls input,.controls select,.field input,.field select{padding:10px;border-radius:8px;border:1px solid #46617e;background:#fff;color:#172033;width:100%;font-size:14px}
.controls input{flex:1 1 200px}
.controls select{flex:0 1 170px}
.action-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
.action-row .btn{flex:1 1 110px;min-width:0;padding:10px 8px;font-size:12.5px;margin:0;white-space:nowrap}
.btn{border:0;border-radius:8px;padding:10px 13px;background:#0e7490;color:#fff;font-weight:bold;cursor:pointer;margin:3px;font-size:13px}
.btn.red{background:#b91c1c}.btn.green{background:#15803d}.btn.gray{background:#475569}.btn.amber{background:#b45309}
.table-wrap{overflow-x:auto;background:#0c2038;border:1px solid #244365;border-radius:12px;max-height:68dvh;overflow-y:auto}
.user-table{border-collapse:separate;border-spacing:0 5px;width:100%;min-width:940px;padding:0 7px}
.user-table th{background:#102b49;color:#bfefff;padding:11px 9px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:2}
.user-table td{background:#102b49;padding:8px 9px;white-space:nowrap;vertical-align:middle}
.user-table tbody tr{cursor:pointer}
.user-table tbody tr:hover td{background:#174064}
.user-photo{width:44px;height:48px;object-fit:cover;border-radius:7px;border:2px solid #67e8f9;cursor:pointer;display:block}
.user-name-link{color:#67e8f9;font-weight:700;text-decoration:underline;cursor:pointer}
.user-table .status{color:#86efac;font-weight:bold}
.muted{color:#a9bfd8;font-size:12.5px;margin-top:4px}
.field{margin:9px 0}
.field label{display:block;margin-bottom:4px;color:#a9dff2;font-size:13px;font-weight:600}
.perm-grid{display:flex;gap:12px;flex-wrap:wrap;background:#102b49;border:1px solid #294b6d;padding:9px 11px;border-radius:8px}
.perm-grid label{display:inline-flex;align-items:center;gap:6px;margin:0;color:#f3f7ff;font-size:13px;cursor:pointer}
.perm-grid input{width:auto}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:11000;overflow:auto;padding:12px}
.box{max-width:650px;margin:16px auto;background:#0c2038;border:1px solid #4c6b8c;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px #0008}
.modal-head{position:sticky;top:0;z-index:5;background:#0a192f;border-bottom:1px solid #244365;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px;color:#86efac}
.modal-close{background:#b91c1c;color:#fff;border:0;border-radius:6px;padding:5px 10px;font-weight:bold;cursor:pointer}
.modal-body{padding:14px 16px 18px;max-height:78dvh;overflow-y:auto}
.prof-top{display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.prof-top img{width:84px;height:92px;border-radius:10px;object-fit:cover;border:2px solid #22d3ee}
.prof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:12px}
.prof-item{background:#102b49;border:1px solid #294b6d;border-radius:8px;padding:8px 10px}
.prof-item small{display:block;color:#9dc8e4;font-size:11px;margin-bottom:2px}
.prof-item strong{font-size:14px;word-break:break-word}
.history img{width:70px;height:78px;object-fit:cover;margin:4px;border-radius:7px;border:1px solid #38bdf8;cursor:pointer}
.status{font-weight:bold;color:#86efac}
.hidden{display:none!important}
@media(max-width:640px){
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wrap{padding:10px}
  .controls input,.controls select,.controls .btn{width:100%;flex:1 1 100%}
}
</style></head><body>

<main class="wrap">
  <section class="stats-grid" id="userStats">
    <div class="stat-card"><small>Total Users</small><strong id="statTotal">0</strong></div>
    <div class="stat-card active"><small>Active Users</small><strong id="statActive">0</strong></div>
    <div class="stat-card pending"><small>Pending</small><strong id="statPending">0</strong></div>
    <div class="stat-card inactive"><small>Inactive / Rejected</small><strong id="statInactive">0</strong></div>
  </section>

  <div class="panel controls">
    <input id="search" placeholder="नाव / User ID / कार्यालय / जिल्हा शोधा" oninput="renderUsers()">
    <select id="filter" onchange="renderUsers()">
      <option value="all">सर्व युजर्स</option>
      <option value="approved">Active</option>
      <option value="pending">Pending</option>
      <option value="rejected">Rejected</option>
      <option value="deactivated">Deactivated</option>
    </select>
    <button class="btn green" onclick="openAdd()"><i class="fa-solid fa-user-plus"></i> + नवीन User</button>
  </div>
  <div id="users"></div>
</main>

<!-- युजर प्रोफाइल Popup (स्थिर Heading सह) -->
<div class="modal" id="profileViewModal" onclick="if(event.target===this)closeProfileModal()">
  <div class="box">
    <div class="modal-head">
      <h3 id="profileModalHeading"><i class="fa-solid fa-id-card"></i> User Profile</h3>
      <button type="button" class="modal-close" onclick="closeProfileModal()">✕</button>
    </div>
    <div class="modal-body" id="profileModalBody"></div>
  </div>
</div>

<!-- Add / Edit User Modal -->
<div class="modal" id="editModal" onclick="if(event.target===this)closeEdit()">
  <div class="box">
    <div class="modal-head">
      <h3 id="editModalHeading">User माहिती संपादन</h3>
      <button type="button" class="modal-close" onclick="closeEdit()">✕</button>
    </div>
    <div class="modal-body">
      <form id="userForm" onsubmit="saveUser(event)">
        <input type="hidden" id="oldId">
        <div class="field"><label>फोटो (अनिवार्य)</label><input id="photoFile" type="file" accept="image/*"><div class="muted" id="photoHint">नवीन User साठी फोटो आवश्यक. बदलताना नवीन फोटो निवडा.</div></div>
        <div class="field"><label>नाव</label><input id="name" required></div>
        <div class="field"><label>पदनाम</label><input id="designation" required></div>
        <div class="field"><label>कार्यालय</label><input id="office" required></div>
        <div class="field"><label>जिल्हा</label><input id="district" required></div>
        <div class="field"><label>मोबाईल क्रमांक</label><input id="mobile" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></div>
        <div class="field"><label>User ID</label><input id="uid" required></div>
        <div class="field" id="newPassField"><label>तात्पुरता Password</label><input id="newPass" type="password" minlength="6" required></div>
        <div class="field"><label>Role</label><select id="role"><option value="user">User</option><option value="admin">Admin</option></select></div>
        <div class="field"><label>Permissions (अधिकार)</label>
          <div class="perm-grid">
            <label><input type="checkbox" id="perm_pay" checked> Pay Fixation</label>
            <label><input type="checkbox" id="perm_mb" checked> MB Register</label>
            <label><input type="checkbox" id="perm_gr" checked> GR Contribution</label>
          </div>
        </div>
        <div class="field"><label>Status</label><select id="status"><option value="approved">Active / Approved</option><option value="pending">Pending</option><option value="rejected">Rejected</option><option value="deactivated">Deactivated</option></select></div>
        <div class="action-row" id="allActions">
          <button class="btn" type="button" id="resetAction" onclick="resetUser(document.getElementById('oldId').value)">Password Reset</button>
          <button class="btn amber" type="button" id="toggleBtn" onclick="toggleUser(document.getElementById('oldId').value)">Deactivate</button>
          <button class="btn red" type="button" id="deleteBtn" onclick="deleteUser(document.getElementById('oldId').value)">Delete</button>
          <button class="btn green" type="submit">जतन करा</button>
          <button class="btn gray" type="button" onclick="closeEdit()">रद्द</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- फुलस्क्रीन फोटो इतिहास व्यूअर -->
<div class="modal" id="historyModal" style="padding:0;background:#000;align-items:center;justify-content:center" onclick="if(event.target===this)closeHistoryViewer()">
  <img id="historyViewerImage" style="max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain" alt="">
</div>

<!-- Password Reset Modal -->
<div class="modal" id="resetModal" onclick="if(event.target===this)document.getElementById('resetModal').style.display='none'">
  <div class="box" style="max-width:420px">
    <div class="modal-head">
      <h3>Password Reset</h3>
      <button type="button" class="modal-close" onclick="document.getElementById('resetModal').style.display='none'">✕</button>
    </div>
    <div class="modal-body">
      <p class="muted">नवीन तात्पुरता पासवर्ड सेट करा. जुना पासवर्ड पाहता येत नाही.</p>
      <div class="field"><input id="resetPass" type="password" minlength="6" placeholder="नवीन पासवर्ड (किमान ६ अक्षरे)"></div>
      <div class="action-row">
        <button class="btn green" type="button" onclick="doReset()">Reset करा</button>
        <button class="btn gray" type="button" onclick="document.getElementById('resetModal').style.display='none'">रद्द</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  if(localStorage.getItem('isLoggedIn')!=='true'||localStorage.getItem('userRole')!=='admin'){
    alert('ही सुविधा फक्त Admin साठी आहे.');
    location.replace('dashboard.html');
    return;
  }
})();
const DEFAULT_AVATAR='https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
let resetTarget='';
function users(){try{return JSON.parse(localStorage.getItem('ow_users')||'{}')}catch(e){return {}}}
function saveAll(x){localStorage.setItem('ow_users',JSON.stringify(x))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function updateStats(data){
  let total=0,active=0,pending=0,inactive=0;
  Object.keys(data).forEach(id=>{
    if(id==='admin')return;
    total++;
    const st=data[id].status||'pending';
    if(st==='approved')active++;
    else if(st==='pending')pending++;
    else inactive++;
  });
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statActive').textContent=active;
  document.getElementById('statPending').textContent=pending;
  document.getElementById('statInactive').textContent=inactive;
}

function renderUsers(){
  if(localStorage.getItem('userRole')!=='admin')return;
  let data=users();
  updateStats(data);
  let q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;
  let html='<div class="table-wrap"><table class="user-table"><thead><tr><th>क्र.</th><th>फोटो</th><th>User ID</th><th>नाव</th><th>पदनाम</th><th>कार्यालय</th><th>जिल्हा</th><th>मोबाईल</th><th>Role</th><th>स्थिती</th></tr></thead><tbody>';
  let n=0;
  Object.keys(data).forEach(id=>{
    if(id==='admin')return;
    let u=data[id],st=u.status||'pending';
    if(f!=='all'&&st!==f)return;
    let hay=[id,u.name,u.designation,u.office,u.district,u.mobile].join(' ').toLowerCase();
    if(q&&!hay.includes(q))return;
    n++;
    let photo=u.photo||'';
    html+=`<tr onclick="editUser('${esc(id)}')">
      <td>${n}</td>
      <td onclick="event.stopPropagation();showHistory('${esc(id)}')">${photo?`<img class="user-photo" src="${photo}" title="फोटो इतिहास पाहण्यासाठी क्लिक करा">`:'फोटो नाही'}</td>
      <td>${esc(id)}</td>
      <td onclick="event.stopPropagation();openUserProfileModal('${esc(id)}')"><span class="user-name-link" title="प्रोफाइल पहा">${esc(u.name||'-')}</span></td>
      <td>${esc(u.designation||'-')}</td>
      <td>${esc(u.office||'-')}</td>
      <td>${esc(u.district||'-')}</td>
      <td>${esc(u.mobile||'-')}</td>
      <td>${esc((u.role||'user').toUpperCase())}</td>
      <td class="status">${esc(st)}</td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('users').innerHTML=n?html:'<div class="panel">युजर सापडला नाही.</div>';
}

function openUserProfileModal(id){
  const u=users()[id];
  if(!u)return;
  document.getElementById('profileModalHeading').innerHTML=`<i class="fa-solid fa-id-card"></i> ${esc(u.name||id)} - Profile`;
  const perms=u.permissions||{pay:true,mb:true,gr:true};
  const permList=[perms.pay?'Pay Fixation':'',perms.mb?'MB Register':'',perms.gr?'GR Contribution':''].filter(Boolean).join(', ')||'None';
  const hist=Array.isArray(u.photoHistory)?u.photoHistory:[];
  const histHtml=hist.length
    ? hist.map(h=>`<img src="${esc(h.photo)}" alt="Old Photo" onclick="showHistory('${esc(id)}')">`).join('')
    : '<span class="muted">जुने फोटो उपलब्ध नाहीत.</span>';
  document.getElementById('profileModalBody').innerHTML=`
    <div class="prof-top">
      <img src="${esc(u.photo||DEFAULT_AVATAR)}" alt="Photo" onclick="showHistory('${esc(id)}')">
      <div>
        <div style="font-size:17px;font-weight:700;color:#fff">${esc(u.name||'-')}</div>
        <div style="color:#38bdf8;font-size:13.5px;margin-top:2px">${esc(u.designation||'-')}</div>
        <div class="muted">User ID: <b>${esc(id)}</b> | Role: <b>${esc((u.role||'user').toUpperCase())}</b></div>
      </div>
    </div>
    <div class="prof-grid">
      <div class="prof-item"><small>कार्यालय</small><strong>${esc(u.office||'-')}</strong></div>
      <div class="prof-item"><small>जिल्हा</small><strong>${esc(u.district||'-')}</strong></div>
      <div class="prof-item"><small>मोबाईल</small><strong>${esc(u.mobile||'-')}</strong></div>
      <div class="prof-item"><small>खाते स्थिती</small><strong>${esc(u.status||'pending')}</strong></div>
      <div class="prof-item"><small>Permissions</small><strong>${esc(permList)}</strong></div>
      <div class="prof-item"><small>नोंदणी दिनांक</small><strong>${esc(u.createdAt?new Date(u.createdAt).toLocaleDateString('mr-IN'):'-')}</strong></div>
    </div>
    <div class="field"><label>जुने फोटो इतिहास (फक्त Admin साठी)</label><div class="history">${histHtml}</div></div>
    <div class="action-row">
      <button type="button" class="btn" onclick="closeProfileModal();editUser('${esc(id)}')">Edit User</button>
      <button type="button" class="btn amber" onclick="closeProfileModal();resetUser('${esc(id)}')">Reset Password</button>
      <button type="button" class="btn red" onclick="closeProfileModal();deleteUser('${esc(id)}')">Delete User</button>
    </div>
  `;
  document.getElementById('profileViewModal').style.display='block';
}
function closeProfileModal(){document.getElementById('profileViewModal').style.display='none'}

function openAdd(){
  document.getElementById('userForm').reset();
  document.getElementById('oldId').value='';
  document.getElementById('editModalHeading').textContent='नवीन User जोडा';
  document.getElementById('resetAction').classList.add('hidden');
  document.getElementById('toggleBtn').classList.add('hidden');
  document.getElementById('deleteBtn').classList.add('hidden');
  document.getElementById('newPassField').classList.remove('hidden');
  document.getElementById('newPass').required=true;
  document.getElementById('perm_pay').checked=true;
  document.getElementById('perm_mb').checked=true;
  document.getElementById('perm_gr').checked=true;
  document.getElementById('editModal').style.display='block';
}

function editUser(id){
  let u=users()[id];
  if(!u)return;
  document.getElementById('userForm').reset();
  document.getElementById('oldId').value=id;
  document.getElementById('editModalHeading').textContent=`User संपादन (${u.name||id})`;
  ['name','designation','office','district','mobile'].forEach(k=>document.getElementById(k).value=u[k]||'');
  document.getElementById('uid').value=id;
  document.getElementById('role').value=u.role||'user';
  const perms=u.permissions||{pay:true,mb:true,gr:true};
  document.getElementById('perm_pay').checked=perms.pay!==false;
  document.getElementById('perm_mb').checked=perms.mb!==false;
  document.getElementById('perm_gr').checked=perms.gr!==false;
  document.getElementById('status').value=u.status||'pending';
  document.getElementById('resetAction').classList.remove('hidden');
  document.getElementById('toggleBtn').classList.remove('hidden');
  document.getElementById('deleteBtn').classList.remove('hidden');
  document.getElementById('toggleBtn').textContent=(u.status==='deactivated'?'Activate':'Deactivate');
  document.getElementById('toggleBtn').className='btn '+(u.status==='deactivated'?'green':'amber');
  document.getElementById('newPassField').classList.add('hidden');
  document.getElementById('newPass').required=false;
  document.getElementById('editModal').style.display='block';
}
function closeEdit(){document.getElementById('editModal').style.display='none'}

async function saveUser(e){
  e.preventDefault();
  let all=users(),old=document.getElementById('oldId').value,id=document.getElementById('uid').value.trim(),file=document.getElementById('photoFile').files[0],existing=old?all[old]:null;
  if(!id||id==='admin'){alert('वैध User ID टाका.');return}
  if(!old&&!file){alert('फोटो अनिवार्य आहे.');return}
  if(id!==old&&all[id]){alert('हा User ID आधीपासून आहे.');return}
  let photo=existing?.photo||'';
  if(file){
    if(!file.type.startsWith('image/')||file.size>5*1024*1024){alert('योग्य फोटो निवडा (५ MB पर्यंत).');return}
    photo=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  }
  let history=existing?.photoHistory||[];
  if(existing?.photo&&file)history=[...history,{photo:existing.photo,changedAt:new Date().toISOString()}];
  let obj={
    ...(existing||{}),
    name:document.getElementById('name').value.trim(),
    designation:document.getElementById('designation').value.trim(),
    office:document.getElementById('office').value.trim(),
    district:document.getElementById('district').value.trim(),
    mobile:document.getElementById('mobile').value.trim(),
    photo,
    photoHistory:history,
    role:document.getElementById('role').value||'user',
    permissions:{
      pay:document.getElementById('perm_pay').checked,
      mb:document.getElementById('perm_mb').checked,
      gr:document.getElementById('perm_gr').checked
    },
    status:document.getElementById('status').value,
    createdAt:existing?.createdAt||new Date().toISOString()
  };
  if(!old)obj.password=document.getElementById('newPass').value;
  if(old&&id!==old)delete all[old];
  all[id]=obj;
  saveAll(all);
  closeEdit();
  renderUsers();
  alert('माहिती जतन झाली.');
}

let viewerPhotos=[],viewerIndex=0,touchStartX=0;
function showHistory(id){
  let u=users()[id],arr=(u?.photoHistory||[]).map(x=>x.photo).filter(Boolean);
  if(u?.photo)arr.push(u.photo);
  viewerPhotos=arr;
  if(!arr.length)return;
  viewerIndex=arr.length-1;
  renderHistoryPhoto();
  document.getElementById('historyModal').style.display='flex';
}
function renderHistoryPhoto(){document.getElementById('historyViewerImage').src=viewerPhotos[viewerIndex]}
function closeHistoryViewer(){document.getElementById('historyModal').style.display='none';document.getElementById('historyViewerImage').src=''}
const historyViewer=document.getElementById('historyModal');
historyViewer.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].screenX},{passive:true});
historyViewer.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchStartX;if(Math.abs(dx)>45){viewerIndex=Math.max(0,Math.min(viewerPhotos.length-1,viewerIndex+(dx<0?1:-1)));renderHistoryPhoto()}},{passive:true});
function viewPhoto(id){let p=users()[id]?.photo;if(!p)return;let w=window.open();if(w){w.document.write('<img style="max-width:100%" src="'+p+'">')}}

function resetUser(id){
  if(!id)return;
  resetTarget=id;
  document.getElementById('resetPass').value='';
  document.getElementById('resetModal').style.display='block';
}
function doReset(){
  let p=document.getElementById('resetPass').value;
  if(p.length<6){alert('किमान ६ अक्षरे आवश्यक.');return}
  let a=users();
  if(!a[resetTarget])return;
  a[resetTarget].password=p;
  saveAll(a);
  document.getElementById('resetModal').style.display='none';
  alert('पासवर्ड Reset झाला.');
}
function toggleUser(id){
  let a=users();
  if(!a[id])return;
  if(a[id].status==='deactivated')a[id].status='approved';
  else a[id].status='deactivated';
  saveAll(a);
  renderUsers();
  const btn=document.getElementById('toggleBtn');
  if(btn){
    btn.textContent=(a[id].status==='deactivated'?'Activate':'Deactivate');
    btn.className='btn '+(a[id].status==='deactivated'?'green':'amber');
  }
}
function deleteUser(id){
  if(!id||id==='admin')return;
  let a=users();
  if(!a[id])return;
  if(!confirm(`तुम्हाला '${a[id].name||id}' हा User कायमचा हटवायचा आहे का?`))return;
  delete a[id];
  saveAll(a);
  closeEdit();
  renderUsers();
  alert('User हटवण्यात आला.');
}
renderUsers();
</script></body></html>
