<!DOCTYPE html>
<html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>User Management</title><script src="app-shell.js" defer></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#f3f7ff;font-family:Arial,sans-serif}.top{display:flex;align-items:center;justify-content:space-between;padding:14px;background:#020d1b;border-bottom:1px solid #244365;position:sticky;top:0}.top a{color:#67e8f9;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:16px}.panel{background:#0c2038;border:1px solid #244365;border-radius:14px;padding:15px;margin:12px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls select,.field input,.field select{padding:10px;border-radius:8px;border:1px solid #46617e;background:#fff;color:#172033;width:100%}.controls input{flex:1;min-width:180px}.action-row{display:flex;gap:4px;flex-wrap:nowrap;align-items:center;margin:8px 0}.action-row .btn{flex:1;min-width:0;padding:9px 5px;font-size:12px;margin:0;white-space:nowrap}.top{background:#071b12;border-bottom:1px solid #166534}.top a{color:#86efac}.btn{border:0;border-radius:8px;padding:10px 13px;background:#0e7490;color:#fff;font-weight:bold;cursor:pointer;margin:3px}.btn.red{background:#b91c1c}.btn.green{background:#15803d}.btn.gray{background:#475569}.table-wrap{overflow-x:auto;background:#0c2038;border:1px solid #244365;border-radius:12px}.user-table{border-collapse:separate;border-spacing:0 5px;width:100%;min-width:920px;padding:0 7px}.user-table th{background:#102b49;color:#bfefff;padding:11px 9px;text-align:left;white-space:nowrap}.user-table td{background:#102b49;padding:8px 9px;white-space:nowrap}.user-table tbody tr{cursor:pointer}.user-table tbody tr:hover td{background:#174064}.user-photo{width:48px;height:54px;object-fit:cover;border-radius:7px;border:2px solid #67e8f9;cursor:pointer}.user-table .status{color:#86efac;font-weight:bold}.muted{color:#a9bfd8;font-size:13px}.field{margin:10px 0}.field label{display:block;margin-bottom:5px;color:#a9dff2}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;overflow:auto;padding:15px}.box{max-width:650px;margin:25px auto;background:#0c2038;border:1px solid #4c6b8c;border-radius:14px;padding:0 18px 18px}.popup-nav{position:sticky;top:0;z-index:5;margin:0 -18px 12px;padding:10px 12px;display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;gap:8px;background:#071b12;border-bottom:1px solid #166534;border-radius:14px 14px 0 0}.popup-nav h3{margin:0;text-align:center;color:#86efac;font-size:16px}.popup-nav-btn{width:40px;height:40px;border:0;border-radius:8px;background:#123d2a;color:#86efac;font-size:18px}..history img{width:75px;height:85px;object-fit:cover;margin:5px;border-radius:7px}.status{font-weight:bold;color:#86efac}.hidden{display:none!important}@media(max-width:500px){.user{grid-template-columns:75px 1fr}.user img{width:75px;height:95px}.wrap{padding:9px}}
</style></head><body>

<main class="wrap">
<p class="muted">फक्त Admin साठी. नाव, पदनाम, कार्यालय, जिल्हा, मोबाईल व User ID बदलण्याचे अधिकार Admin कडे आहेत.</p>
<div class="panel controls"><input id="search" placeholder="नाव / User ID / कार्यालय / जिल्हा शोधा" oninput="renderUsers()"><select id="filter" onchange="renderUsers()"><option value="all">सर्व युजर्स</option><option value="approved">Active</option><option value="pending">Pending</option><option value="rejected">Rejected</option><option value="deactivated">Deactivated</option></select><button class="btn" onclick="openAdd()">+ नवीन User</button></div>
<div id="users"></div></main>
<div class="modal" id="editModal"><div class="box"><div class="popup-nav"><button type="button" class="popup-nav-btn" onclick="closeEdit()" aria-label="मागे"><i class="fa-solid fa-arrow-left"></i></button><h3 id="formTitle">User माहिती</h3><button type="button" class="popup-nav-btn" onclick="location.href='dashboard.html'" aria-label="Home"><i class="fa-solid fa-house"></i></button></div><form id="userForm" onsubmit="saveUser(event)">
<input type="hidden" id="oldId"><div class="field"><label>फोटो (अनिवार्य)</label><input id="photoFile" type="file" accept="image/*"><div class="muted" id="photoHint">नवीन User साठी फोटो आवश्यक. बदलताना नवीन फोटो निवडा.</div></div>
<div class="field"><label>नाव</label><input id="name" required></div><div class="field"><label>पदनाम</label><input id="designation" required></div><div class="field"><label>कार्यालय</label><input id="office" required></div><div class="field"><label>जिल्हा</label><input id="district" required></div><div class="field"><label>मोबाईल क्रमांक</label><input id="mobile" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></div><div class="field"><label>User ID</label><input id="uid" required></div>
<div class="field" id="newPassField"><label>तात्पुरता Password</label><input id="newPass" type="password" minlength="6" required></div>
<div class="field"><label>Role</label><select id="role"><option value="user">User</option></select></div><div class="field"><label>Status</label><select id="status"><option value="approved">Active / Approved</option><option value="pending">Pending</option><option value="rejected">Rejected</option><option value="deactivated">Deactivated</option></select></div>
<div class="action-row" id="allActions"><button class="btn" type="button" id="resetAction" onclick="resetUser(document.getElementById('oldId').value)">Password Reset</button><button class="btn red" type="button" id="toggleBtn" onclick="toggleUser(document.getElementById('oldId').value)">Deactivate</button><button class="btn green" type="submit">जतन करा</button><button class="btn gray" type="button" onclick="closeEdit()">रद्द</button></div></form></div></div>
<div class="modal" id="historyModal" style="padding:0;background:#000;align-items:center;justify-content:center" onclick="if(event.target===this)closeHistoryViewer()"><img id="historyViewerImage" style="max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain" alt=""></div>
<div class="modal" id="resetModal"><div class="box"><h3>Password Reset</h3><p>नवीन तात्पुरता पासवर्ड सेट करा. जुना पासवर्ड पाहता येत नाही.</p><input id="resetPass" type="password" minlength="6" placeholder="नवीन पासवर्ड"><button class="btn green" onclick="doReset()">Reset करा</button><button class="btn gray" onclick="document.getElementById('resetModal').style.display='none'">रद्द</button></div></div>
<script>
(function(){
if(localStorage.getItem('isLoggedIn')!=='true'||localStorage.getItem('userRole')!=='admin'){alert('ही सुविधा फक्त Admin साठी आहे.');location.replace('dashboard.html');return;}
})();
let resetTarget='';
function users(){return JSON.parse(localStorage.getItem('ow_users')||'{}')}
function saveAll(x){localStorage.setItem('ow_users',JSON.stringify(x))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderUsers(){if(localStorage.getItem('userRole')!=='admin')return;let data=users(),q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value,html='<div class="table-wrap"><table class="user-table"><thead><tr><th>क्र.</th><th>फोटो</th><th>User ID</th><th>नाव</th><th>पदनाम</th><th>कार्यालय</th><th>जिल्हा</th><th>मोबाईल</th><th>स्थिती</th></tr></thead><tbody>';let n=0;
Object.keys(data).forEach(id=>{if(id==='admin')return;let u=data[id],st=u.status||'pending';if(f!=='all'&&st!==f)return;let hay=[id,u.name,u.office,u.district].join(' ').toLowerCase();if(q&&!hay.includes(q))return;n++;let photo=u.photo||'';html+=`<tr onclick="editUser('${esc(id)}')"><td>${n}</td><td onclick="event.stopPropagation();showHistory('${esc(id)}')">${photo?`<img class="user-photo" src="${photo}" title="फोटो इतिहास पाहण्यासाठी क्लिक करा">`:'फोटो नाही'}</td><td>${esc(id)}</td><td>${esc(u.name||'-')}</td><td>${esc(u.designation||'-')}</td><td>${esc(u.office||'-')}</td><td>${esc(u.district||'-')}</td><td>${esc(u.mobile||'-')}</td><td class="status">${esc(st)}</td></tr>`});
html+='</tbody></table></div>';document.getElementById('users').innerHTML=n?html:'<div class="panel">युजर सापडला नाही.</div>'}
function openAdd(){document.getElementById('userForm').reset();document.getElementById('oldId').value='';document.getElementById('formTitle').textContent='नवीन User';document.getElementById('resetAction').classList.add('hidden');document.getElementById('toggleBtn').classList.add('hidden');document.getElementById('newPassField').classList.remove('hidden');document.getElementById('newPass').required=true;document.getElementById('editModal').style.display='block'}
function editUser(id){let u=users()[id];if(!u)return;document.getElementById('userForm').reset();document.getElementById('oldId').value=id;['name','designation','office','district','mobile'].forEach(k=>document.getElementById(k).value=u[k]||'');document.getElementById('uid').value=id;document.getElementById('role').value='user';document.getElementById('status').value=u.status||'pending';document.getElementById('formTitle').textContent='User Smart Action';document.getElementById('resetAction').classList.remove('hidden');document.getElementById('toggleBtn').classList.remove('hidden');document.getElementById('toggleBtn').textContent=(u.status==='deactivated'?'Activate':'Deactivate');document.getElementById('toggleBtn').className='btn '+(u.status==='deactivated'?'green':'red');document.getElementById('newPassField').classList.add('hidden');document.getElementById('newPass').required=false;document.getElementById('editModal').style.display='block'}
function closeEdit(){document.getElementById('editModal').style.display='none'}
async function saveUser(e){e.preventDefault();let all=users(),old=document.getElementById('oldId').value,id=document.getElementById('uid').value.trim(),file=document.getElementById('photoFile').files[0],existing=old?all[old]:null;if(!old&&!file){alert('फोटो अनिवार्य आहे.');return}if(id!==old&&all[id]){alert('हा User ID आधीपासून आहे.');return}let photo=existing?.photo||'';if(file){if(!file.type.startsWith('image/')||file.size>5*1024*1024){alert('योग्य फोटो निवडा (५ MB पर्यंत).');return}photo=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
let history=existing?.photoHistory||[];if(existing?.photo&&file)history=[...history,{photo:existing.photo,changedAt:new Date().toISOString()}];
let obj={...(existing||{}),name:document.getElementById('name').value.trim(),designation:document.getElementById('designation').value.trim(),office:document.getElementById('office').value.trim(),district:document.getElementById('district').value.trim(),mobile:document.getElementById('mobile').value.trim(),photo,photoHistory:history,role:'user',status:document.getElementById('status').value};
if(!old)obj.password=document.getElementById('newPass').value;
if(old&&id!==old)delete all[old];all[id]=obj;saveAll(all);closeEdit();renderUsers();alert('माहिती जतन झाली.')}
let viewerPhotos=[],viewerIndex=0,touchStartX=0;
function showHistory(id){let u=users()[id],arr=(u?.photoHistory||[]).map(x=>x.photo).filter(Boolean);if(u?.photo)arr.push(u.photo);viewerPhotos=arr;if(!arr.length)return;viewerIndex=arr.length-1;renderHistoryPhoto();document.getElementById('historyModal').style.display='flex'}
function renderHistoryPhoto(){document.getElementById('historyViewerImage').src=viewerPhotos[viewerIndex]}
function closeHistoryViewer(){document.getElementById('historyModal').style.display='none';document.getElementById('historyViewerImage').src=''}
const historyViewer=document.getElementById('historyModal');historyViewer.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].screenX},{passive:true});historyViewer.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchStartX;if(Math.abs(dx)>45){viewerIndex=Math.max(0,Math.min(viewerPhotos.length-1,viewerIndex+(dx<0?1:-1)));renderHistoryPhoto()}},{passive:true});
function viewPhoto(id){let p=users()[id]?.photo;if(!p)return;let w=window.open();if(w){w.document.write('<img style="max-width:100%" src="'+p+'">')}}
function resetUser(id){resetTarget=id;document.getElementById('resetPass').value='';document.getElementById('resetModal').style.display='block'}
function doReset(){let p=document.getElementById('resetPass').value;if(p.length<6){alert('किमान ६ अक्षरे आवश्यक.');return}let a=users();if(!a[resetTarget])return;a[resetTarget].password=p;saveAll(a);document.getElementById('resetModal').style.display='none';alert('पासवर्ड Reset झाला.')}
function toggleUser(id){let a=users();if(!a[id])return;if(a[id].status==='deactivated')a[id].status='approved';else a[id].status='deactivated';saveAll(a);renderUsers()}
renderUsers();
</script></body></html>
