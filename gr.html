<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>शासन निर्णय व परिपत्रके</title>
<script src="app-shell.js" defer></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh;background:#020d1b;color:#f3f7ff;font-family:'Segoe UI',Arial,sans-serif;overflow-x:hidden}
.gr-wrap{width:min(100% - 24px,1040px);margin:14px auto 32px}
.top-toolbar{background:#0c2038;border:1px solid #244365;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 6px 20px #0004}
.toolbar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar-row input,.toolbar-row select{padding:10px 12px;border-radius:8px;border:1px solid #46617e;background:#fff;color:#172033;font-size:14px}
.toolbar-row input{flex:1 1 230px}
.toolbar-row select{flex:0 1 180px}
.btn{border:0;border-radius:8px;padding:10px 14px;background:#0e7490;color:#fff;font-weight:700;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.green{background:#15803d}.btn.red{background:#b91c1c}.btn.gray{background:#475569}.btn.amber{background:#b45309}
.btn.sm{padding:6px 10px;font-size:12px}
.stats-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #1e3a5f;font-size:13px;color:#9dc8e4}
.gr-list{display:grid;gap:10px}
.gr-card{background:#0c2038;border:1px solid #244365;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;transition:.2s}
.gr-card:hover{border-color:#38bdf8}
.gr-info{flex:1 1 280px;min-width:0}
.gr-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#102b49;border:1px solid #294b6d;color:#67e8f9}
.badge.date{color:#86efac;border-color:#166534}
.badge.uploader{color:#fde68a;border-color:#92400e}
.gr-title{font-size:15.5px;font-weight:700;color:#fff;margin:0 0 5px;line-height:1.4;word-break:break-word}
.gr-meta{font-size:12.5px;color:#a9bfd8}
.gr-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty-box{background:#0c2038;border:1px dashed #334155;border-radius:12px;padding:28px 16px;text-align:center;color:#94a3b8;font-size:14px}

/* मोडल */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:11000;overflow:auto;padding:12px}
.modal-box{max-width:560px;margin:14px auto;background:#0c2038;border:1px solid #4c6b8c;border-radius:14px;overflow:hidden;box-shadow:0 12px 32px #0009}
.modal-head{position:sticky;top:0;z-index:5;background:#0a192f;border-bottom:1px solid #244365;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px;color:#86efac}
.modal-close{background:#b91c1c;color:#fff;border:0;border-radius:6px;padding:5px 10px;font-weight:700;cursor:pointer}
.modal-body{padding:14px 16px 18px;max-height:78dvh;overflow-y:auto}
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#a9dff2;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #46617e;background:#fff;color:#172033;font-size:14px;font-family:inherit}
.preview-frame{width:100%;height:65dvh;border:1px solid #244365;border-radius:8px;background:#fff}
.preview-img{max-width:100%;max-height:65dvh;display:block;margin:auto;border-radius:8px}
@media(max-width:600px){
  .gr-wrap{width:calc(100% - 16px)}
  .toolbar-row input,.toolbar-row select,.toolbar-row .btn{width:100%;flex:1 1 100%}
  .gr-actions{width:100%}
  .gr-actions .btn{flex:1}
}
</style>
</head>
<body>
<main class="gr-wrap">
  <section class="top-toolbar">
    <div class="toolbar-row">
      <button type="button" class="btn green" id="openUploadBtn" onclick="openUploadModal()">
        <i class="fa-solid fa-cloud-arrow-up"></i> Upload GR / परिपत्रक
      </button>
      <input type="text" id="grSearch" placeholder="शासन निर्णय क्र., विषय, विभाग किंवा अपलोडर शोधा..." oninput="renderGRList()">
      <select id="grDeptFilter" onchange="renderGRList()">
        <option value="ALL">सर्व विभाग (All)</option>
        <option value="सामान्य प्रशासन">सामान्य प्रशासन</option>
        <option value="वित्त विभाग">वित्त विभाग</option>
        <option value="सार्वजनिक बांधकाम">सार्वजनिक बांधकाम</option>
        <option value="ग्रामविकास व जलसंधारण">ग्रामविकास व जलसंधारण</option>
        <option value="इतर">इतर</option>
      </select>
    </div>
    <div class="stats-bar">
      <span>एकूण शासन निर्णय / परिपत्रके: <strong id="grTotalCount" style="color:#4ade80">0</strong></span>
      <span id="grPermNote">सर्व सक्रिय युजर्सना GR अपलोड व पाहण्याचा अधिकार उपलब्ध आहे.</span>
    </div>
  </section>

  <section id="grListContainer" class="gr-list"></section>
</main>

<!-- Upload GR Modal -->
<div class="modal" id="uploadGrModal" onclick="if(event.target===this)closeUploadModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h3><i class="fa-solid fa-file-circle-plus"></i> नवीन शासन निर्णय / परिपत्रक अपलोड करा</h3>
      <button type="button" class="modal-close" onclick="closeUploadModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="grUploadForm" onsubmit="saveGR(event)">
        <div class="field">
          <label>प्रकार निवडा *</label>
          <select id="grCategory" required>
            <option value="शासन निर्णय (GR)">शासन निर्णय (GR)</option>
            <option value="परिपत्रक (Circular)">परिपत्रक (Circular)</option>
            <option value="शासन पत्र / आदेश">शासन पत्र / आदेश</option>
          </select>
        </div>
        <div class="field">
          <label>विभाग निवडा *</label>
          <select id="grDept" required>
            <option value="सार्वजनिक बांधकाम">सार्वजनिक बांधकाम</option>
            <option value="वित्त विभाग">वित्त विभाग</option>
            <option value="सामान्य प्रशासन">सामान्य प्रशासन</option>
            <option value="ग्रामविकास व जलसंधारण">ग्रामविकास व जलसंधारण</option>
            <option value="इतर">इतर</option>
          </select>
        </div>
        <div class="field">
          <label>शासन निर्णय / परिपत्रक क्रमांक *</label>
          <input type="text" id="grNumber" placeholder="उदा. संकीर्ण-२०२५/प्र.क्र.१२/आस्था-१" required>
        </div>
        <div class="field">
          <label>दिनांक *</label>
          <input type="date" id="grDate" required>
        </div>
        <div class="field">
          <label>विषय / संक्षिप्त तपशील *</label>
          <textarea id="grSubject" rows="3" placeholder="शासन निर्णयाचा विषय स्पष्ट लिहा..." required></textarea>
        </div>
        <div class="field">
          <label>PDF किंवा फोटो फाईल जोडा (कमाल ६ MB) *</label>
          <input type="file" id="grFile" accept="application/pdf,image/*" required>
        </div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button type="submit" class="btn green" style="flex:1"><i class="fa-solid fa-check"></i> अपलोड व जतन करा</button>
          <button type="button" class="btn gray" onclick="closeUploadModal()">रद्द</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- View GR Modal -->
<div class="modal" id="viewGrModal" onclick="if(event.target===this)closeViewModal()">
  <div class="modal-box" style="max-width:760px">
    <div class="modal-head">
      <h3 id="viewGrTitle">दस्तऐवज प्रिव्ह्यू</h3>
      <button type="button" class="modal-close" onclick="closeViewModal()">✕</button>
    </div>
    <div class="modal-body" id="viewGrBody"></div>
  </div>
</div>

<script>
(function(){
  if(localStorage.getItem('isLoggedIn')!=='true'){
    location.replace('index.html');
  }
})();

const GR_KEY='ow_gr_records';

function readUsers(){try{return JSON.parse(localStorage.getItem('ow_users')||'{}')}catch(e){return {}}}
function readGRs(){try{const arr=JSON.parse(localStorage.getItem(GR_KEY)||'[]');return Array.isArray(arr)?arr:[]}catch(e){return []}}
function writeGRs(list){localStorage.setItem(GR_KEY,JSON.stringify(list))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d){if(!d)return '-';const p=String(d).split('-');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:d}

function getCurrentUserInfo(){
  const id=localStorage.getItem('currentUser')||'';
  const u=readUsers()[id]||{};
  const role=localStorage.getItem('userRole')||u.role||'user';
  const name=u.name||localStorage.getItem('displayName')||id||'User';
  const canUpload=(role==='admin')||((u.permissions?.gr)!==false);
  return {id,role,name,designation:u.designation||'',canUpload};
}

function initPage(){
  const me=getCurrentUserInfo();
  const btn=document.getElementById('openUploadBtn');
  if(!me.canUpload){
    btn.classList.add('gray');
    btn.title='तुम्हाला GR अपलोड परवानगी नाही';
    document.getElementById('grPermNote').textContent='तुम्ही सर्व शासन निर्णय पाहू व डाउनलोड करू शकता.';
  }
  renderGRList();
}

function openUploadModal(){
  const me=getCurrentUserInfo();
  if(!me.canUpload){
    alert('तुम्हाला GR अपलोड करण्याची परवानगी नाही. कृपया Admin शी संपर्क साधा.');
    return;
  }
  document.getElementById('grUploadForm').reset();
  document.getElementById('grDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('uploadGrModal').style.display='block';
}
function closeUploadModal(){document.getElementById('uploadGrModal').style.display='none'}

async function saveGR(e){
  e.preventDefault();
  const me=getCurrentUserInfo();
  if(!me.canUpload){alert('परवानगी नाही.');return}
  const file=document.getElementById('grFile').files[0];
  if(!file){alert('कृपया PDF किंवा फोटो फाईल निवडा.');return}
  if(file.size>6*1024*1024){alert('फाईलचा आकार ६ MB पेक्षा कमी असावा.');return}

  const fileData=await new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });

  const rec={
    id:'GR_'+Date.now(),
    category:document.getElementById('grCategory').value,
    dept:document.getElementById('grDept').value,
    grNo:document.getElementById('grNumber').value.trim(),
    grDate:document.getElementById('grDate').value,
    subject:document.getElementById('grSubject').value.trim(),
    fileName:file.name,
    fileType:file.type,
    fileData:fileData,
    uploadedById:me.id,
    uploadedByName:me.name,
    uploadedAt:new Date().toISOString()
  };

  const list=readGRs();
  list.unshift(rec);
  try{
    writeGRs(list);
  }catch(err){
    alert('ब्राउझर स्टोरेज मर्यादा पूर्ण झाली आहे. कृपया जुन्या मोठ्या फाईल्स काढून पुन्हा प्रयत्न करा.');
    return;
  }
  closeUploadModal();
  renderGRList();
  alert('शासन निर्णय / परिपत्रक यशस्वीरीत्या अपलोड झाले!');
}

function renderGRList(){
  const me=getCurrentUserInfo();
  const list=readGRs();
  const q=(document.getElementById('grSearch').value||'').trim().toLowerCase();
  const dept=document.getElementById('grDeptFilter').value;

  const filtered=list.filter(item=>{
    if(dept!=='ALL'&&item.dept!==dept)return false;
    if(!q)return true;
    const hay=[item.category,item.dept,item.grNo,item.subject,item.uploadedByName,fmtDate(item.grDate)].join(' ').toLowerCase();
    return hay.includes(q);
  });

  document.getElementById('grTotalCount').textContent=filtered.length;
  const container=document.getElementById('grListContainer');

  if(filtered.length===0){
    container.innerHTML='<div class="empty-box"><i class="fa-regular fa-folder-open" style="font-size:28px;margin-bottom:8px;display:block"></i>कोणताही शासन निर्णय / परिपत्रक आढळले नाही. नवीन जोडण्यासाठी वरील <b>Upload GR</b> बटण वापरा.</div>';
    return;
  }

  container.innerHTML=filtered.map(item=>{
    const canDel=(me.role==='admin')||(item.uploadedById&&item.uploadedById===me.id);
    return `
      <article class="gr-card">
        <div class="gr-info">
          <div class="gr-badges">
            <span class="badge">${esc(item.category||'GR')}</span>
            <span class="badge">${esc(item.dept||'-')}</span>
            <span class="badge date">दि. ${esc(fmtDate(item.grDate))}</span>
            <span class="badge uploader">अपलोड: ${esc(item.uploadedByName||'User')}</span>
          </div>
          <h3 class="gr-title">${esc(item.subject)}</h3>
          <div class="gr-meta">क्रमांक: <strong>${esc(item.grNo)}</strong> | फाईल: ${esc(item.fileName||'दस्तऐवज')}</div>
        </div>
        <div class="gr-actions">
          <button type="button" class="btn sm" onclick="viewGR('${esc(item.id)}')"><i class="fa-solid fa-eye"></i> पहा</button>
          <a class="btn green sm" style="text-decoration:none" href="${esc(item.fileData)}" download="${esc(item.fileName||'GR_Document')}"><i class="fa-solid fa-download"></i> डाउनलोड</a>
          ${canDel?`<button type="button" class="btn red sm" onclick="deleteGR('${esc(item.id)}')"><i class="fa-solid fa-trash"></i></button>`:''}
        </div>
      </article>
    `;
  }).join('');
}

function viewGR(id){
  const item=readGRs().find(x=>x.id===id);
  if(!item)return;
  document.getElementById('viewGrTitle').textContent=`${item.grNo} (दि. ${fmtDate(item.grDate)})`;
  const body=document.getElementById('viewGrBody');
  if((item.fileType||'').startsWith('image/')){
    body.innerHTML=`<p style="margin-top:0;font-size:13.5px;color:#cbd5e1">${esc(item.subject)}</p><img class="preview-img" src="${esc(item.fileData)}" alt="GR">`;
  }else{
    body.innerHTML=`<p style="margin-top:0;font-size:13.5px;color:#cbd5e1">${esc(item.subject)}</p><iframe class="preview-frame" src="${esc(item.fileData)}"></iframe>`;
  }
  document.getElementById('viewGrModal').style.display='block';
}
function closeViewModal(){
  document.getElementById('viewGrModal').style.display='none';
  document.getElementById('viewGrBody').innerHTML='';
}

function deleteGR(id){
  const me=getCurrentUserInfo();
  const list=readGRs();
  const target=list.find(x=>x.id===id);
  if(!target)return;
  if(me.role!=='admin'&&target.uploadedById!==me.id){
    alert('तुम्ही फक्त स्वतः अपलोड केलेले GR हटवू शकता.');
    return;
  }
  if(!confirm(`'${target.grNo}' हा दस्तऐवज कायमचा हटवायचा आहे का?`))return;
  writeGRs(list.filter(x=>x.id!==id));
  renderGRList();
}

initPage();
</script>
</body>
</html>
