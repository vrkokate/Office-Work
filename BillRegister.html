<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Register - M.B. System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-header">
<a href="index.html" class="btn-back-hub">🏠 मुखपृष्ठ</a>
<h1>📄 देयक नोंदवही (Bill Register)</h1>
</div>

<div class="container">
<div class="summary-box">
<div class="summary-title">📄 देयक डॅशबोर्ड व संक्षिप्त माहिती</div>
<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px;">
    <div class="sum-card-clickable"><div style="font-size:11px; color:#666;">Total Bills</div><div style="font-size:16px; font-weight:700; color:#0d47a1;" id="sumTotalBills">0</div></div>
    <div class="sum-card-clickable"><div style="font-size:11px; color:#666;">Total Amount</div><div style="font-size:16px; font-weight:700; color:#0d47a1;" id="sumTotalAmount">₹ 0</div></div>
    <div class="sum-card-clickable"><div style="font-size:11px; color:#666;">Total Deduction</div><div style="font-size:16px; font-weight:700; color:#d32f2f;" id="sumTotalDed">₹ 0</div></div>
    <div class="sum-card-clickable"><div style="font-size:11px; color:#666;">Net Payable</div><div style="font-size:16px; font-weight:700; color:#2e7d32;" id="sumNetPay">₹ 0</div></div>
</div>

<div style="display: flex; gap: 6px; margin-bottom: 12px;">
    <button class="btn-report" style="background:#f57c00; margin:0; flex:1;" onclick="openWizard(1)"><span>➕</span> नवीन देयक नोंदवा</button>
    <button class="btn-report" style="background:#0d47a1; margin-top:0; flex:1;" onclick="printMasterBillRegister()"><span>📄</span> प्रिंट / पीडीएफ रिपोर्ट</button>
</div>

<div class="bill-scroll-container">
    <div id="billListContainer"></div>
</div>
</div>
</div>

<script src="common.js"></script>
<script>
window.onload = function() {
    refreshBillDashboard();
};

function refreshBillDashboard() {
    var bills = getData('dmbms_bills');
    var totalBills = bills.length;
    var totalAmt = 0, totalDed = 0, netPayable = 0;
    
    bills.forEach(function(b) {
        totalAmt += parseFloat(b.passedAmt) || 0;
        totalDed += parseFloat(b.totalDed) || 0;
        netPayable += parseFloat(b.netPay) || 0;
    });

    if(document.getElementById('sumTotalBills')) document.getElementById('sumTotalBills').innerText = totalBills;
    if(document.getElementById('sumTotalAmount')) document.getElementById('sumTotalAmount').innerText = '₹ ' + totalAmt.toLocaleString('en-IN');
    if(document.getElementById('sumTotalDed')) document.getElementById('sumTotalDed').innerText = '₹ ' + totalDed.toLocaleString('en-IN');
    if(document.getElementById('sumNetPay')) document.getElementById('sumNetPay').innerText = '₹ ' + netPayable.toLocaleString('en-IN');

    var listHTML = '';
    if(bills.length === 0) {
        listHTML = '<p style="text-align:center; color:#666; padding:15px; font-size:12px;">कोणतीही नोंद उपलब्ध नाही.</p>';
    } else {
        listHTML = '<table class="data-table"><thead><tr>' +
        '<th>अ.क्र.</th><th>बिल क्र.</th><th>कंत्राटदार</th><th>कामाचे नाव</th><th>JE</th><th>M.B.</th><th>बिल प्रकार</th><th>दिनांक</th>' +
        '<th style="text-align:right;">पास रक्कम (₹)</th><th style="text-align:right;">कपात (₹)</th><th style="text-align:right;">नेट रक्कम (₹)</th>' +
        '</tr></thead><tbody>';

        bills.slice().reverse().forEach(function(b, originalIdx) {
            var passedAmt = parseFloat(b.passedAmt) || 0;
            var totalDed = parseFloat(b.totalDed) || 0;
            var netPay = parseFloat(b.netPay) || 0;

            listHTML += '<tr>' +
            '<td style="text-align:center;">' + (originalIdx + 1) + '</td>' +
            '<td><strong>' + (b.billNo || '-') + '</strong></td>' +
            '<td>' + (b.contractor || '-') + '</td>' +
            '<td>' + (b.workName || '-') + '</td>' +
            '<td>' + (b.je || '-') + '</td>' +
            '<td style="text-align:center;">' + (b.mbNo || '-') + '</td>' +
            '<td>' + (b.billType || '-') + '</td>' +
            '<td>' + (b.date ? formatDateToDMY(b.date) : '-') + '</td>' +
            '<td style="text-align:right;">₹ ' + passedAmt.toLocaleString('en-IN') + '</td>' +
            '<td style="text-align:right; color:#d32f2f; font-weight:700;">₹ ' + totalDed.toLocaleString('en-IN') + '</td>' +
            '<td style="text-align:right; color:#2e7d32; font-weight:700;">₹ ' + netPay.toLocaleString('en-IN') + '</td>' +
            '</tr>';
        });
        listHTML += '</tbody></table>';
    }
    var container = document.getElementById('billListContainer');
    if(container) container.innerHTML = listHTML;
}

function printMasterBillRegister() {
    var bills = getData('dmbms_bills');
    if (bills.length === 0) return alert('कोणतीही देयक नोंद उपलब्ध नाही.');
    var todayStr = formatDateToDMY(new Date().toISOString().slice(0, 10));
    
    var html = '<div style="text-align:center; margin-bottom:10px;"><h2 style="font-size:14px;">सार्वजनिक बांधकाम विभाग - संपूर्ण देयक नोंदवही (Master Bill Register)</h2><p style="font-size:11px;">अहवाल दिनांक: ' + todayStr + '</p></div>';
    html += '<table border="1" style="width:100%; border-collapse:collapse; font-size:10pt;"><thead><tr style="background:#eee;"><th>अ.क्र.</th><th>बिल क्र.</th><th>कंत्राटदार</th><th>कामाचे नाव</th><th>JE</th><th>M.B.</th><th>बिल प्रकार</th><th>दिनांक</th><th>पास रक्कम</th><th>कपात</th><th>नेट रक्कम</th></tr></thead><tbody>';
    
    bills.forEach(function(b, i) {
        html += '<tr><td>'+(i+1)+'</td><td>'+(b.billNo||'-')+'</td><td>'+(b.contractor||'-')+'</td><td>'+(b.workName||'-')+'</td><td>'+(b.je||'-')+'</td><td>'+(b.mbNo||'-')+'</td><td>'+(b.billType||'-')+'</td><td>'+(b.date?formatDateToDMY(b.date):'-')+'</td><td>'+(b.passedAmt||0)+'</td><td>'+(b.totalDed||0)+'</td><td>'+(b.netPay||0)+'</td></tr>';
    });
    html += '</tbody></table>';

    var win = window.open('', '_blank');
    win.document.write('<html><head><title>Bill Register Report</title></head><body>' + html + '</body></html>');
    win.document.close();
    win.print();
}
</script>
</body>
</html>
