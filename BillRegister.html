<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>देयक नोंदवही (Bill Register)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #f0f2f5; color: #212121; min-height: 100vh; padding: 15px; }

.container { max-width: 1100px; margin: auto; background: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f57c00; padding-bottom: 8px; margin-bottom: 12px; }
.header h2 { font-size: 16px; color: #f57c00; font-weight: 800; }
.btn-close { background: #e53935; color: #fff; border: none; border-radius: 4px; padding: 5px 10px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 12px; }

.summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.summary-card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 2px 7px rgba(0,0,0,.10); cursor: pointer; border-left: 4px solid #0d47a1; }
.summary-card.ded { border-left-color: #d32f2f; }
.summary-card.net { border-left-color: #2e7d32; }
.summary-title { font-size: 11px; color: #666; }
.summary-value { margin-top: 4px; font-size: 17px; font-weight: 700; color: #0d47a1; }

.toolbar { display: flex; gap: 7px; margin-bottom: 12px; }
.btn { border: 0; border-radius: 6px; padding: 10px; color: #fff; font-weight: 700; cursor: pointer; flex: 1; text-align: center; font-size: 13px; }
.btn-orange { background: #f57c00; }
.btn-blue { background: #0d47a1; }
.btn-green { background: #2e7d32; }
.btn-red { background: #d32f2f; }
.btn-gray { background: #757575; }

.table-box { background: #fff; border-radius: 8px; padding: 8px; overflow-x: auto; box-shadow: 0 2px 7px rgba(0,0,0,.08); max-height: 350px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; min-width: 900px; font-size: 11px; }
th, td { border: 1px solid #ddd; padding: 6px; text-align: left; vertical-align: middle; }
th { background: #f1f3f5; font-weight: 700; white-space: nowrap; }
.amount { text-align: right; }
.deduction { color: #d32f2f; font-weight: 700; cursor: pointer; }
.net { color: #2e7d32; font-weight: 700; }

.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100; padding: 10px; overflow: auto; }
.modal-card { width: 100%; max-width: 480px; margin: 20px auto; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 5px 25px rgba(0,0,0,.25); }
.modal-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 10px; }
.modal-header h3 { margin: 0; color: #f57c00; font-size: 15px; }

.form-group { margin-bottom: 10px; text-align: left; }
.form-group label { display: block; font-size: 11.5px; font-weight: 700; margin-bottom: 4px; }
.form-control { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 12px; background: #fff; display: block; }
.form-row-compact { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 5px; }
.form-row-compact label { font-size: 11.5px; font-weight: 600; color: #333; margin: 0; }
.form-row-compact input { padding: 5px 6px; font-size: 12px; height: 30px; }

.steps { display: flex; justify-content: center; gap: 30px; margin: 8px 0 15px; }
.step { width: 28px; height: 28px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 12px; }
.step.active { background: #f57c00; }
.step.done { background: #2e7d32; }

.step-content { display: none; }
.step-content.active { display: block; }
.wizard-buttons { display: flex; gap: 7px; margin-top: 14px; }
.wizard-buttons button { flex: 1; }

.deduction-box { max-height: 220px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; padding: 6px; margin-bottom: 8px; }
.ded-row { margin-bottom: 6px; }
.ded-row label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 2px; }
.total-box { margin-top: 8px; padding: 8px; background: #fff3e0; border-radius: 6px; font-size: 12px; }
.preview { background: #f8f9fa; border: 1px solid #ddd; border-radius: 7px; padding: 10px; }
.preview-row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 5px 0; font-size: 12px; }
.empty { text-align: center; padding: 25px; color: #777; font-size: 12px; }

@media print {
body * { visibility: hidden !important; }
#printableArea, #printableArea * { visibility: visible !important; }
#printableArea { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 4mm; display: block !important; }
@page { size: A4 portrait; margin: 4mm; }
.print-table { width: 100%; border-collapse: collapse; font-size: 10pt; }
.print-table th, .print-table td { border: 1px solid #222; padding: 4px 5px; text-align: left; }
.print-table th { background-color: #eee !important; -webkit-print-color-adjust: exact; }
}
</style>
</head>
<body>

<div class="container">
<div class="header">
<h2>📄 देयक नोंदवही (Bill Register)</h2>
<a href="index.html" class="btn-close">🏠 मुख्य पृष्ठ</a>
</div>

<!-- Summary Cards -->
<div class="summary-grid">
    <div class="summary-card" onclick="openSummary('TOTAL_BILLS')">
        <div class="summary-title">Total Bills</div>
        <div class="summary-value" id="sumTotalBills">0</div>
    </div>
    <div class="summary-card" onclick="openSummary('TOTAL_AMOUNT')">
        <div class="summary-title">Total Amount</div>
        <div class="summary-value" id="sumTotalAmount">₹ 0</div>
    </div>
    <div class="summary-card ded" onclick="openSummary('TOTAL_DEDUCTION')">
        <div class="summary-title">Total Deduction</div>
        <div class="summary-value" id="sumTotalDed" style="color:#d32f2f;">₹ 0</div>
    </div>
    <div class="summary-card net" onclick="openSummary('NET_PAYABLE')">
        <div class="summary-title">Net Payable</div>
        <div class="summary-value" id="sumNetPay" style="color:#2e7d32;">₹ 0</div>
    </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
<button class="btn btn-orange" onclick="openWizard()">➕ नवीन देयक नोंदवा</button>
<button class="btn btn-blue" onclick="printMasterRegister()">📄 प्रिंट / PDF रिपोर्ट</button>
</div>

<!-- Bill List Table Box -->
<div class="table-box">
<div id="billListContainer"></div>
</div>
</div>

<!-- Wizard Modal -->
<div class="modal" id="wizardModal">
<div class="modal-card">
<div class="modal-header">
<h3>नवीन देयक नोंदवा</h3>
<button class="close" onclick="closeWizard()">X</button>
</div>
<input type="hidden" id="editBillIndex" value="-1">

<div class="steps">
<div class="step active" id="dot1">1</div>
<div class="step" id="dot2">2</div>
<div class="step" id="dot3">3</div>
</div>

<!-- Step 1 -->
<div class="step-content active" id="step1">
<div class="form-group"><label>संबंधित कनिष्ठ अभियंता (JE) *</label><select class="form-control" id="wJeSelect" onchange="onWizardJEChange()"><option value="">-- JE निवडा --</option></select></div>
<div class="form-group"><label>वाटप केलेली M.B. क्रमांक *</label><select class="form-control" id="wMbSelect" onchange="onWizardMBChange()"><option value="">-- आधी JE निवडा --</option></select></div>
<div class="form-group"><label>कंत्राटदार / एजन्सीचे नाव</label><input type="text" class="form-control" id="wContractor" readonly style="background:#f2f2f2;"></div>
<div class="form-group"><label>संबंधित कामाचे नाव</label><input type="text" class="form-control" id="wWorkName" readonly style="background:#f2f2f2;"></div>
<div class="form-group">
<label>बिलाचा प्रकार निवडा *</label>
<select class="form-control" id="wBillType" onchange="checkExistingBillType()">
<option value="">-- बिलाचा प्रकार निवडा --</option>
<option>First RA Bill</option><option>Second RA Bill</option><option>Third RA Bill</option><option>Fourth RA Bill</option><option>Fifth RA Bill</option>
<option>First and Final RA Bill</option><option>Second and Final RA Bill</option><option>With Held</option>
</select>
</div>
<div class="form-group"><label>बिलाचा दिनांक *</label><input type="date" class="form-control" id="wBillDate"></div>
<div class="wizard-buttons"><button class="btn btn-blue" onclick="goToStep(2)">पुढील ➔</button></div>
</div>

<!-- Step 2 -->
<div class="step-content" id="step2">
<h4 style="font-size:13px; color:#0d47a1; margin-bottom:6px;">Deduction (कपात तपशील)</h4>
<div class="form-group"><label>Passed Amount (पास रक्कम) ₹ *</label><input type="number" class="form-control" id="wPassedAmt" min="0" oninput="autoCalculateDeductions()"></div>
<div class="deduction-box" id="deductionFieldsContainer"></div>
<div class="total-box">
<div><strong>एकूण कपात:</strong> <span style="color:#d32f2f; font-weight:700;" id="wLblTotalDed">₹ 0</span></div>
<div style="margin-top:4px;"><strong>प्रत्यक्षात देय रक्कम:</strong> <span style="color:#2e7d32; font-weight:700;" id="wLblNetPay">₹ 0</span></div>
</div>
<div class="wizard-buttons"><button class="btn btn-gray" onclick="goToStep(1)">◀ मागे</button><button class="btn btn-blue" onclick="goToStep(3)">पुढील ➔</button></div>
</div>

<!-- Step 3 -->
<div class="step-content" id="step3">
<div class="preview" id="previewContent"></div>
<div class="wizard-buttons"><button class="btn btn-gray" onclick="goToStep(2)">◀ मागे</button><button class="btn btn-green" onclick="saveNewBill()">जतन करा (Save)</button></div>
</div>
</div>
</div>

<!-- Detail Modal -->
<div class="modal" id="detailModal">
<div class="modal-card">
<div class="modal-header">
<h3 id="detailTitle">तपशील</h3>
<button class="close" onclick="closeDetail()">X</button>
</div>
<div id="detailBody" style="max-height:250px; overflow-y:auto; margin-bottom:10px;"></div>
<button class="btn btn-blue" onclick="window.print()">📄 PRINT REPORT</button>
</div>
</div>

<div id="printableArea"></div>

<script src="common.js"></script>
<script>
window.onload = function() {
    loadJEList();
    refreshBillDashboard();
};

function money(n) { return '₹ ' + (parseFloat(n)||0).toLocaleString('en-IN'); }
function formatDate(date) {
    if(!date) return '-';
    var p = date.split('-');
    if(p.length !== 3) return date;
    return p[2] + '-' + p[1] + '-' + p[0];
}

function loadJEList() {
    var sel = document.getElementById('wJeSelect');
    if(!sel) return;
    sel.innerHTML = '<option value="">-- JE निवडा --</option>';
    getData('je_records').forEach(function(j) {
        var name = j.name || j.jeName || j.JE || '';
        if(name) sel.add(new Option(name, name));
    });
}

function getCurrentlyHeldMBsByJE(jeName) {
    if(!jeName) return [];
    var allMBs = getData('mb_records');
    var latestMap = {};
    allMBs.forEach(function(m) {
        var no = (m.mbNumber || '').trim();
        if(no) latestMap[no] = m;
    });
    var list = [];
    for(var no in latestMap) {
        var item = latestMap[no];
        if(item.actionType === 'दिलेली M.B.' || item.actionType === 'दिलेली एमबी') {
            if((item.receivedDetail || '').trim() === jeName.trim() || (item.receivedSource || '').trim() === jeName.trim()) {
                list.push({ mbNo: no, size: item.size || 'लहान M.B.' });
            }
        }
    }
    return list;
}

function onWizardJEChange() {
    var je = document.getElementById('wJeSelect').value;
    var mb = document.getElementById('wMbSelect');
    mb.innerHTML = '<option value="">-- M.B. निवडा --</option>';
    document.getElementById('wContractor').value = '';
    document.getElementById('wWorkName').value = '';
    if(!je) return;
    var list = getCurrentlyHeldMBsByJE(je);
    if(list.length === 0) {
        mb.innerHTML = '<option value="">-- या JE कडे M.B. उपलब्ध नाही --</option>';
        return;
    }
    list.forEach(function(item) {
        mb.add(new Option(item.mbNo + ' (' + item.size + ')', item.mbNo));
    });
}

function onWizardMBChange() {
    var mbNo = document.getElementById('wMbSelect').value;
    document.getElementById('wContractor').value = '';
    document.getElementById('wWorkName').value = '';
    if(!mbNo) return;
    var works = getData('work_records').filter(function(w){ return w.mbNo === mbNo; });
    if(works.length) {
        document.getElementById('wWorkName').value = works[0].name || '';
        document.getElementById('wContractor').value = works[0].contractor || '';
    } else {
        document.getElementById('wWorkName').value = 'काम नोंदवलेले नाही';
        document.getElementById('wContractor').value = '-';
    }
}

function checkExistingBillType() {}

function createDeductionFields() {
    var box = document.getElementById('deductionFieldsContainer');
    box.innerHTML = '';
    var items = ['Income Tax', 'Security Deposit', 'Maintenance', 'Royalty Charges', 'Govt. Ins. Scheme', 'Upkar (W.C.)', 'CGST 1%', 'SGST 1%'];
    var ids = ['dedIT', 'dedSD', 'dedMaint', 'dedRoyalty', 'dedGovt', 'dedUpkar', 'dedCGST', 'dedSGST'];
    items.forEach(function(item, idx) {
        box.innerHTML += '<div class="ded-row"><label>' + item + '</label><input type="number" class="form-control calc-ded" id="' + ids[idx] + '" value="0" oninput="autoCalculateDeductions()"></div>';
    });
    box.innerHTML += '<div class="ded-row"><label><span id="otherLabel1" contenteditable="true">Other-1</span></label><input type="number" class="form-control calc-ded" id="dedOther1" value="0" oninput="autoCalculateDeductions()"></div>';
}

function autoCalculateDeductions() {
    var passed = parseFloat(document.getElementById('wPassedAmt').value) || 0;
    document.getElementById('dedIT').value = Math.round(passed * 0.02);
    document.getElementById('dedSD').value = Math.round(passed * 0.005);
    document.getElementById('dedMaint').value = Math.round(passed * 0.005);
    document.getElementById('dedRoyalty').value = Math.round(passed * 0.01);
    document.getElementById('dedCGST').value = Math.round(passed * 0.01);
    document.getElementById('dedSGST').value = Math.round(passed * 0.01);

    var total = 0;
    document.querySelectorAll('.calc-ded').forEach(function(input){ total += parseFloat(input.value) || 0; });
    var net = passed - total;
    document.getElementById('wLblTotalDed').innerText = money(total);
    document.getElementById('wLblNetPay').innerText = money(net);
}

function openWizard() {
    document.getElementById('editBillIndex').value = '-1';
    document.getElementById('wContractor').value = '';
    document.getElementById('wWorkName').value = '';
    document.getElementById('wBillType').value = '';
    document.getElementById('wBillDate').value = '';
    document.getElementById('wPassedAmt').value = '';
    document.getElementById('wMbSelect').innerHTML = '<option value="">-- आधी JE निवडा --</option>';
    createDeductionFields();
    document.getElementById('wizardModal').style.display = 'block';
    goToStep(1);
}

function closeWizard() { document.getElementById('wizardModal').style.display = 'none'; }

function goToStep(step) {
    if(step === 2) {
        var je = document.getElementById('wJeSelect').value;
        var mb = document.getElementById('wMbSelect').value;
        var type = document.getElementById('wBillType').value;
        if(!je || !mb || !type) { alert('कृपया सर्व आवश्यक माहिती भरा.'); return; }
        autoCalculateDeductions();
    }
    if(step === 3) {
        autoCalculateDeductions();
        renderPreview();
    }
    for(var i=1; i<=3; i++) {
        document.getElementById('step'+i).classList.remove('active');
        document.getElementById('dot'+i).classList.remove('active', 'done');
    }
    document.getElementById('step'+step).classList.add('active');
    for(var j=1; j<=3; j++) {
        if(j < step) document.getElementById('dot'+j).classList.add('done');
        if(j === step) document.getElementById('dot'+j).classList.add('active');
    }
}

function renderPreview() {
    var je = document.getElementById('wJeSelect').value;
    var mb = document.getElementById('wMbSelect').value;
    var contractor = document.getElementById('wContractor').value;
    var work = document.getElementById('wWorkName').value;
    var type = document.getElementById('wBillType').value;
    var date = document.getElementById('wBillDate').value;
    var passed = parseFloat(document.getElementById('wPassedAmt').value) || 0;
    var total = parseFloat(document.getElementById('wLblTotalDed').innerText.replace('₹','').replace(/,/g,'')) || 0;
    var net = passed - total;

    document.getElementById('previewContent').innerHTML = 
    '<div class="preview-row"><span>JE</span><strong>' + je + '</strong></div>' +
    '<div class="preview-row"><span>M.B.</span><strong>' + mb + '</strong></div>' +
    '<div class="preview-row"><span>कंत्राटदार</span><strong>' + contractor + '</strong></div>' +
    '<div class="preview-row"><span>काम</span><strong>' + work + '</strong></div>' +
    '<div class="preview-row"><span>Bill Type</span><strong>' + type + '</strong></div>' +
    '<div class="preview-row"><span>Passed Amount</span><strong>' + money(passed) + '</strong></div>' +
    '<div class="preview-row"><span>Total Deduction</span><strong>' + money(total) + '</strong></div>' +
    '<div class="preview-row"><span>Net Payable</span><strong>' + money(net) + '</strong></div>';
}

function saveNewBill() {
    var bills = getData('dmbms_bills');
    var idx = parseInt(document.getElementById('editBillIndex').value, 10);
    var passed = parseFloat(document.getElementById('wPassedAmt').value) || 0;
    var totalDed = parseFloat(document.getElementById('wLblTotalDed').innerText.replace('₹','').replace(/,/g,'')) || 0;
    var net = passed - totalDed;
    var billNo = (idx === -1) ? (new Date().getFullYear() + '/' + String(bills.length + 1).padStart(2,'0')) : bills[idx].billNo;

    var bill = {
        billNo: billNo,
        je: document.getElementById('wJeSelect').value,
        mbNo: document.getElementById('wMbSelect').value,
        contractor: document.getElementById('wContractor').value,
        workName: document.getElementById('wWorkName').value,
        billType: document.getElementById('wBillType').value,
        date: document.getElementById('wBillDate').value,
        passedAmt: passed,
        totalDed: totalDed,
        netPay: net,
        deductions: {
            IT: parseFloat(document.getElementById('dedIT').value) || 0,
            SD: parseFloat(document.getElementById('dedSD').value) || 0,
            Maint: parseFloat(document.getElementById('dedMaint').value) || 0,
            Royalty: parseFloat(document.getElementById('dedRoyalty').value) || 0,
            Govt: parseFloat(document.getElementById('dedGovt').value) || 0,
            Upkar: parseFloat(document.getElementById('dedUpkar').value) || 0,
            CGST: parseFloat(document.getElementById('dedCGST').value) || 0,
            SGST: parseFloat(document.getElementById('dedSGST').value) || 0,
            otherList: [{ name: document.getElementById('otherLabel1').innerText.trim(), val: parseFloat(document.getElementById('dedOther1').value) || 0 }]
        }
    };

    if(idx === -1) bills.push(bill); else bills[idx] = bill;
    setData('dmbms_bills', bills);
    closeWizard();
    refreshBillDashboard();
    alert('देयक यशस्वीरीत्या जतन झाले!');
}

function editBill(idx) {
    var bills = getData('dmbms_bills');
    var b = bills[idx];
    if(!b) return;
    openWizard();
    document.getElementById('editBillIndex').value = idx;
    document.getElementById('wJeSelect').value = b.je || '';
    onWizardJEChange();
    document.getElementById('wMbSelect').value = b.mbNo || '';
    onWizardMBChange();
    document.getElementById('wBillType').value = b.billType || '';
    document.getElementById('wBillDate').value = b.date || '';
    document.getElementById('wPassedAmt').value = b.passedAmt || 0;
    autoCalculateDeductions();
}

function deleteBill(idx) {
    if(!confirm('ही देयक नोंद हटवायची का?')) return;
    var bills = getData('dmbms_bills');
    bills.splice(idx, 1);
    setData('dmbms_bills', bills);
    refreshBillDashboard();
}

function refreshBillDashboard() {
    var bills = getData('dmbms_bills');
    var totalBills = bills.length;
    var totalAmt = 0, totalDed = 0, netPayable = 0;
    bills.forEach(function(b){
        totalAmt += parseFloat(b.passedAmt) || 0;
        totalDed += parseFloat(b.totalDed) || 0;
        netPayable += parseFloat(b.netPay) || 0;
    });

    document.getElementById('sumTotalBills').innerText = totalBills;
    document.getElementById('sumTotalAmount').innerText = money(totalAmt);
    document.getElementById('sumTotalDed').innerText = money(totalDed);
    document.getElementById('sumNetPay').innerText = money(netPayable);

    var container = document.getElementById('billListContainer');
    if(!bills.length) {
        container.innerHTML = '<div class="empty">कोणतीही देयक नोंद उपलब्ध नाही.</div>';
        return;
    }

    var html = '<table><thead><tr><th>अ.क्र.</th><th>Bill No.</th><th>Contractor</th><th>Work Name</th><th>JE</th><th>M.B.</th><th>Bill Type</th><th>Date</th><th>Passed Amount</th><th>Deduction</th><th>Net Payable</th><th>Action</th></tr></thead><tbody>';
    bills.slice().reverse().forEach(function(b, i){
        var idx = bills.length - 1 - i;
        html += '<tr>' +
        '<td>' + (i+1) + '</td>' +
        '<td><strong>' + (b.billNo || '-') + '</strong></td>' +
        '<td>' + (b.contractor || '-') + '</td>' +
        '<td>' + (b.workName || '-') + '</td>' +
        '<td>' + (b.je || '-') + '</td>' +
        '<td>' + (b.mbNo || '-') + '</td>' +
        '<td>' + (b.billType || '-') + '</td>' +
        '<td>' + formatDate(b.date) + '</td>' +
        '<td class="amount">' + money(b.passedAmt) + '</td>' +
        '<td class="amount deduction" onclick="openDeductionDetail(' + idx + ')">' + money(b.totalDed) + '</td>' +
        '<td class="amount net">' + money(b.netPay) + '</td>' +
        '<td><button class="action-btn btn-green" onclick="editBill(' + idx + ')">Edit</button><button class="action-btn btn-red" onclick="deleteBill(' + idx + ')">Delete</button></td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
}

function openDeductionDetail(idx) {
    var b = getData('dmbms_bills')[idx];
    if(!b) return;
    var d = b.deductions || {};
    var items = [['Income Tax', d.IT], ['Security Deposit', d.SD], ['Maintenance', d.Maint], ['Royalty Charges', d.Royalty], ['Govt. Ins. Scheme', d.Govt], ['Upkar (W.C.)', d.Upkar], ['CGST 1%', d.CGST], ['SGST 1%', d.SGST]];
    if(d.otherList) d.otherList.forEach(function(o){ items.push([o.name, o.val]); });

    var html = '<table><thead><tr><th>अ.क्र.</th><th>कपात बाब</th><th>रक्कम</th></tr></thead><tbody>';
    var total = 0;
    items.forEach(function(item, i){
        var val = parseFloat(item[1]) || 0;
        total += val;
        html += '<tr><td>' + (i+1) + '</td><td>' + item[0] + '</td><td class="amount">' + money(val) + '</td></tr>';
    });
    html += '<tr><th colspan="2">एकूण कपात</th><th class="amount">' + money(total) + '</th></tr></tbody></table>';
    document.getElementById('detailTitle').innerText = 'कपात तपशील — ' + (b.billNo || '-');
    document.getElementById('detailBody').innerHTML = html;
    document.getElementById('detailModal').style.display = 'block';
}

function closeDetail() { document.getElementById('detailModal').style.display = 'none'; }
function printMasterRegister() { window.print(); }
function openSummary(type) { openDeductionDetail(0); }
</script>

</html>
