<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>६ वा वेतन आयोग फरक</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0; padding: 12px;
    font-family: "Noto Sans Devanagari", Arial, sans-serif;
    background: radial-gradient(circle at 50% 25%, #173b69 0%, #071a32 45%, #020914 100%);
    color: white; min-height: 100vh;
}
.box {
    max-width: 900px; margin: 0 auto; background: #0f1c30;
    border-radius: 16px; border: 1px solid #0284c7; padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}
.top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0284c7; padding-bottom: 12px; margin-bottom: 20px; }
.back-btn { background: #0284c7; color: white; padding: 8px 16px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px; }
.title { font-size: 20px; font-weight: bold; color: #38bdf8; margin: 0; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 15px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 13px; color: #cbd5e1; }
input, select { background: #091322; border: 1px solid #0369a1; color: white; padding: 9px; border-radius: 6px; outline: none; }
.calc-btn { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
</style>
</head>
<body>
<div class="box">
    <div class="top-bar">
        <a href="difference.html" class="back-btn">⬅ मागे जा</a>
        <h2 class="title">६ वा वेतन आयोग (6th Pay Commission)</h2>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label>Pay Band (वेतन बँड):</label>
            <select>
                <option>PB-1 (5200 - 20200)</option>
                <option>PB-2 (9300 - 34800)</option>
                <option>PB-3 (15600 - 39100)</option>
                <option>PB-4 (37400 - 67000)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Band Pay (बँडमधील वेतन ₹):</label>
            <input type="number" placeholder="उदा. 9300">
        </div>
        <div class="form-group">
            <label>Grade Pay (ग्रेड पे ₹):</label>
            <select>
                <option>1900</option>
                <option>2400</option>
                <option>2800</option>
                <option>4200</option>
                <option>4600</option>
                <option>5400</option>
            </select>
        </div>
        <div class="form-group">
            <label>महागाई भत्ता (D.A. %):</label>
            <input type="number" placeholder="उदा. 125">
        </div>
    </div>
    <button class="calc-btn" onclick="alert('६ व्या आयोगाची गणना लवकरच जोडली जाईल!')">६ व्या आयोगाचे वेतन काढा</button>
</div>
</body>
</html>
