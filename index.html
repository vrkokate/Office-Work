<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#031326">
<title>SMART TOOLS STRONGER WORK | Login & Registration</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- फोटो क्रॉप करण्यासाठी Cropper.js लायब्ररी -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<style>
:root{--cyan:#00eaff;--cyan2:#05c8ef;--navy:#031326;--panel:rgba(2,24,45,.78);--text:#f5fbff;--muted:#a8d6e9}
*{box-sizing:border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
html{min-height:100%;background:var(--navy)}
body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(ellipse at 50% 38%,#073b59 0,#03182d 42%,#010b18 100%);display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden;position:relative;padding:24px 16px}
body:before,body:after{content:"";position:fixed;left:-15%;width:130%;height:150px;pointer-events:none;opacity:.9;background:repeating-linear-gradient(147deg,transparent 0 26px,rgba(0,220,255,.08) 27px 29px,transparent 30px 46px);filter:drop-shadow(0 0 9px #00dfff)}
body:before{top:-45px;transform:rotate(-8deg)}
body:after{bottom:-72px;transform:rotate(-8deg)}
.glow-line{position:fixed;top:0;left:-15%;width:80%;height:3px;transform:rotate(-42deg);transform-origin:left;background:linear-gradient(90deg,transparent,var(--cyan),#168bff,transparent);box-shadow:0 0 18px 4px #00cfff;opacity:.8}
.page{width:min(100%,700px);position:relative;z-index:1;text-align:center;padding-bottom: 20px;}
.profile-wrap{width:clamp(130px,35vw,180px);height:clamp(130px,35vw,180px);margin:0 auto 20px;border:5px solid var(--cyan);border-radius:50%;padding:6px;background:#000;box-shadow:0 0 16px var(--cyan),0 0 45px rgba(0,234,255,.55),inset 0 0 18px #00dfff;position:relative}
.profile{width:100%;height:100%;object-fit:cover;object-position:center 28%;border-radius:50%;display:block}
.orbit{width:70%;height:35px;border:4px solid var(--cyan);border-radius:50%;margin:-38px auto 20px;position:relative;z-index:-1;box-shadow:0 0 16px #00dfff,0 0 35px rgba(0,234,255,.6)}
.brand{font-size:clamp(18px,4.5vw,28px);font-weight:850;letter-spacing:1.5px;line-height:1.25;margin:0 0 8px;text-shadow:0 0 14px rgba(0,234,255,.18)}
.brand span,.creator{color:var(--cyan)}
.creator{font-size:clamp(14px,3.4vw,18px);font-weight:700;margin:0 0 25px}
.login-card{width:min(100%,500px);margin:auto;padding:25px clamp(15px,5vw,30px) 25px;border:2px solid #4cecff;border-radius:25px;background:linear-gradient(145deg,rgba(4,43,69,.85),rgba(1,14,30,.95));box-shadow:0 0 14px rgba(0,226,255,.9),inset 0 0 25px rgba(0,196,255,.14),0 0 55px rgba(0,174,255,.18)}

.tab-buttons { display: flex; margin-bottom: 20px; border-bottom: 1px solid #1e3a5f; }
.tab-btn { flex: 1; background: none; border: none; color: #888; font-size: 16px; font-weight: bold; padding: 10px; cursor: pointer; transition: 0.3s;}
.tab-btn.active { color: var(--cyan); border-bottom: 3px solid var(--cyan); text-shadow: 0 0 10px var(--cyan);}

h1.title{font-size:clamp(24px,6vw,36px);letter-spacing:2px;color:var(--cyan);margin:0 0 15px;font-weight:850;text-shadow:0 0 15px rgba(0,234,255,.5);}
.underline{width:70px;height:3px;background:var(--cyan);margin:0 auto 20px;border-radius:10px;box-shadow:0 0 10px #00dfff}

.field{border:1.5px solid #159fc4;border-radius:15px;display:flex;align-items:center;gap:12px;padding:0 15px;margin-bottom:12px;background:rgba(1,19,36,.55);box-shadow:inset 0 0 9px rgba(0,207,255,.05);transition:.2s;min-height:55px;}
.field:focus-within{border-color:var(--cyan);box-shadow:0 0 13px rgba(0,234,255,.28)}
.field i.main-icon{color:#8ff5ff;font-size:20px;min-width:20px;z-index:2;transition:0.3s}
.field input, .field select{width:100%;min-width:0;color:white;font-size:15px;border:0;outline:0;background:transparent;}
.field input::placeholder{color:#b6dced;opacity:1}
.field select { appearance: none; -webkit-appearance: none; cursor: pointer; }
.field select option { background: #031326; color: #fff; }
.select-arrow { position: absolute; right: 15px; color: var(--cyan); pointer-events: none; }

/* Validation styles */
.field.valid-field { border-color: #00ff88 !important; background: rgba(0, 255, 136, 0.08) !important; }
.field.valid-field i.main-icon { color: #00ff88 !important; }
.field.invalid-field { border-color: #ff4d4d !important; background: rgba(255, 77, 77, 0.08) !important; }
.field.invalid-field i.main-icon { color: #ff4d4d !important; }
.validation-text { font-size: 11px; margin-top: -5px; margin-bottom: 10px; margin-left: 15px; display: block; font-weight: bold; text-align: left;}
.val-success { color: #00ff88; }
.val-error { color: #ff4d4d; }

.eye-icon { color: var(--cyan); font-size: 18px; cursor: pointer; z-index: 2; }
.show-pass{background:transparent;border:none;cursor:pointer;display:flex;align-items:center;padding:5px;}

.photo-upload-group { display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
.photo-label { display: flex; align-items: center; gap: 10px; background: rgba(1,19,36,0.8); border: 2px dashed #00eaff; color: #00eaff; padding: 12px; border-radius: 12px; font-size: 14px; cursor: pointer; width: 100%; justify-content: center; transition: 0.3s; }
.photo-label input { display: none; }
.photo-label.uploaded { border-color: #00ff88 !important; color: #00ff88 !important; background: rgba(0, 255, 136, 0.08) !important; border-style: solid !important; }

.btn-submit { width:100%;min-height:55px;border:0;border-radius:15px;margin-top:10px;background:linear-gradient(110deg,#06f0e8,#00bce8);color:#00223a;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 0 22px rgba(0,232,255,.42);transition:transform .15s,filter .15s; }
.btn-submit:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-submit:active{transform:scale(.99)}

.forgot-link { display: block; text-align: center; margin-top: 15px; font-size: 14px; color: var(--cyan); cursor: pointer; text-decoration: none; font-weight: bold; }
.forgot-link:hover { text-decoration: underline; }

.status-msg { font-size: 14px; text-align: center; margin-bottom: 15px; font-weight: bold; padding: 10px; border-radius: 8px; }
.msg-error { color: #ff4d4d; background: rgba(255, 77, 77, 0.1); border: 1px solid #ff4d4d; }
.msg-success { color: #00ff88; background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; }

.hidden { display: none !important; }
.screen { text-align: center; }
.icon-big { font-size: 50px; color: #00ff88; margin-bottom: 15px; text-shadow: 0 0 15px #00ff88; }
.info-box { background: rgba(1,19,36,0.8); border: 1px solid var(--cyan); border-radius: 10px; padding: 15px; text-align: left; font-size: 14px; margin-bottom: 15px; }
.info-box p { margin: 5px 0; }
.info-box strong { color: var(--cyan); }
.contact-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
.contact-btn { flex: 1; padding: 12px; border-radius: 10px; text-decoration: none; color: #fff; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-call { background: #2196F3; box-shadow: 0 0 10px #2196F3; }
.btn-wa { background: #25D366; box-shadow: 0 0 10px #25D366; }

/* फोटो क्रॉप मोडल */
#cropModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; }
.crop-container { flex: 1; background: #000; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; }
#cropImage { max-width: 100%; max-height: 100%; display: block; }
.crop-actions { padding: 15px; background: #031326; display: flex; gap: 10px; border-top: 1px solid #00eaff; }
.crop-actions button { flex: 1; padding: 15px; border-radius: 10px; font-weight: bold; border: none; font-size: 16px; cursor: pointer;}
.btn-cancel { background: #d32f2f; color: #fff; box-shadow: 0 0 10px #d32f2f;}
.btn-save-crop { background: #00ff88; color: #000; box-shadow: 0 0 10px #00ff88;}

/* सजेशन (अंधुक अक्षरे) */
.suggestion-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
.autocomplete-suggestion { position: absolute; left: 0; top: 0; width: 100%; height: 100%; padding: 0 5px; font-size: 15px; display: flex; align-items: center; color: transparent; background: transparent; pointer-events: none; white-space: nowrap; overflow: hidden; box-sizing: border-box; z-index: 0; }
.autocomplete-suggestion .bold-part { color: transparent; }
.autocomplete-suggestion .faded-part { color: #6a9cb3; }

.contact { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 25px; flex-wrap: wrap; }
.contact a { width: 45px; height: 45px; display: grid; place-items: center; border: 1.5px solid rgba(0,234,255,.75); border-radius: 50%; color: var(--cyan); background: rgba(0,25,44,.85); box-shadow: 0 0 13px rgba(0,225,255,.22); transition: .2s; }
.contact a:hover { background: var(--cyan); color: #002036; transform: translateY(-3px); }
.contact svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.contact-note { color: #8fb9ce; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="glow-line"></div>

<main class="page">
  <div class="profile-wrap">
      <!-- तुमचा फोटो इथे टाका (src मध्ये) -->
      <img class="profile" alt="Profile" src="home-bg.jpg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
  </div>
  
  <div class="orbit"></div>
  <div class="brand">SMART TOOLS <span>STRONGER WORK</span></div>
  <div class="creator">Created by Vitthal Kokate Patil</div>

  <!-- मुख्य लॉगिन कार्ड -->
  <div class="login-card" id="formContainer">
    
    <!-- टॅब्स -->
    <div class="tab-buttons">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">लॉगिन</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">रजिस्ट्रेशन</button>
    </div>

    <div id="statusMessage" class="status-msg hidden"></div>

    <!-- ================= LOGIN FORM ================= -->
    <form id="loginForm" onsubmit="handleLogin(event)">
        <h1 class="title">LOGIN</h1>
        <div class="underline"></div>

        <div class="field">
            <i class="fa-solid fa-user main-icon"></i>
            <input type="text" id="loginUsername" placeholder="Username" required autocomplete="off">
        </div>
        
        <div class="field password-field">
            <i class="fa-solid fa-lock main-icon"></i>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="button" class="show-pass" onclick="togglePassword('loginPassword', this)">
                <i class="fa-solid fa-eye eye-icon"></i>
            </button>
        </div>
        
        <button type="submit" class="btn-submit">Sign In</button>
        <a class="forgot-link" onclick="showForgotScreen()">Forgot Password?</a>
    </form>

    <!-- ================= REGISTRATION FORM ================= -->
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
        <h1 class="title">REGISTER</h1>
        <div class="underline"></div>

        <div class="photo-upload-group">
            <label class="photo-label" id="photoLabel">
                <i class="fa-solid fa-camera" id="photoIcon"></i> 
                <span id="photoText">फोटो अपलोड करा</span>
                <input type="file" id="regPhoto" accept="image/*" onchange="openCropModal(event)" required>
            </label>
        </div>

        <div class="field">
            <i class="fa-solid fa-id-card main-icon"></i>
            <input type="text" id="regName" placeholder="पूर्ण नाव" required oninput="checkField(this)">
        </div>
        
        <div class="field">
            <i class="fa-solid fa-phone main-icon"></i>
            <input type="tel" id="regMobile" placeholder="मोबाईल नंबर (१० अंक)" required maxlength="10" oninput="checkMobile(this)">
        </div>
        <span id="mobileMsg" class="validation-text hidden"></span>

        <!-- इनलाइन सजेशनसह पदनाम -->
        <div class="field">
            <i class="fa-solid fa-briefcase main-icon"></i>
            <div class="suggestion-wrapper">
                <div id="desigSuggestion" class="autocomplete-suggestion hidden"></div>
                <input type="text" id="regDesignation" placeholder="पदनाम (उदा. कनिष्ठ अभियंता)" required autocomplete="off" oninput="handleDesigInput(this)" onkeydown="handleDesigKey(event, this)">
            </div>
        </div>
        
        <div class="field">
            <i class="fa-solid fa-building main-icon"></i>
            <input type="text" id="regOffice" placeholder="कार्यालयाचे नाव" required autocomplete="off" oninput="checkField(this)">
        </div>

        <div class="field" style="position:relative;">
            <i class="fa-solid fa-map-location-dot main-icon"></i>
            <select id="regDistrict" required onchange="checkField(this)" style="color: #b6dced;">
                <option value="" disabled selected>जिल्हा निवडा</option>
                <option value="अहमदनगर">अहमदनगर</option>
                <option value="अकोला">अकोला</option>
                <option value="अमरावती">अमरावती</option>
                <option value="औरंगाबाद (छत्रपती संभाजीनगर)">औरंगाबाद</option>
                <option value="बीड">बीड</option>
                <option value="भंडारा">भंडारा</option>
                <option value="बुलढाणा">बुलढाणा</option>
                <option value="चंद्रपूर">चंद्रपूर</option>
                <option value="धुळे">धुळे</option>
                <option value="गडचिरोली">गडचिरोली</option>
                <option value="गोंदिया">गोंदिया</option>
                <option value="हिंगोली">हिंगोली</option>
                <option value="जळगाव">जळगाव</option>
                <option value="जालना">जालना</option>
                <option value="कोल्हापूर">कोल्हापूर</option>
                <option value="लातूर">लातूर</option>
                <option value="मुंबई शहर">मुंबई शहर</option>
                <option value="मुंबई उपनगर">मुंबई उपनगर</option>
                <option value="नागपूर">नागपूर</option>
                <option value="नांदेड">नांदेड</option>
                <option value="नंदुरबार">नंदुरबार</option>
                <option value="नाशिक">नाशिक</option>
                <option value="उस्मानाबाद (धाराशिव)">उस्मानाबाद</option>
                <option value="पालघर">पालघर</option>
                <option value="परभणी">परभणी</option>
                <option value="पुणे">पुणे</option>
                <option value="रायगड">रायगड</option>
                <option value="रत्नागिरी">रत्नागिरी</option>
                <option value="सांगली">सांगली</option>
                <option value="सातारा">सातारा</option>
                <option value="सिंधुदुर्ग">सिंधुदुर्ग</option>
                <option value="सोलापूर">सोलापूर</option>
                <option value="ठाणे">ठाणे</option>
                <option value="वर्धा">वर्धा</option>
                <option value="वाशिम">वाशिम</option>
                <option value="यवतमाळ">यवतमाळ</option>
            </select>
            <i class="fa-solid fa-chevron-down select-arrow"></i>
        </div>

        <div class="field">
            <i class="fa-solid fa-user-tag main-icon" id="userIcon"></i>
            <input type="text" id="regUsername" placeholder="Username" required oninput="checkUsername(this)" autocomplete="off">
        </div>
        <span id="userMsg" class="validation-text hidden"></span>

        <div class="field password-field">
            <i class="fa-solid fa-key main-icon" id="passIcon"></i>
            <input type="password" id="regPassword" placeholder="पासवर्ड (कमीत कमी ६ अक्षरे)" required minlength="6" oninput="checkPassword(this)">
            <button type="button" class="show-pass" onclick="togglePassword('regPassword', this)">
                <i class="fa-solid fa-eye eye-icon"></i>
            </button>
        </div>
        <span id="passMsg" class="validation-text hidden"></span>
        
        <button type="submit" class="btn-submit" style="background:linear-gradient(110deg,#00ff88,#00bce8); color:#000;">रजिस्टर करा</button>
    </form>
  </div>

  <!-- ================= SUCCESS SCREEN ================= -->
  <div class="login-card hidden screen" id="successScreen">
      <div class="icon-big"><i class="fa-solid fa-circle-check"></i></div>
      <h2 style="color: #00ff88; margin-bottom: 10px; font-size: 20px;">रजिस्ट्रेशन यशस्वी!</h2>
      <p style="font-size: 14px; color: #b6dced; margin-bottom: 20px;">तुमचे ॲक्टिव्हेशन ॲडमिनकडे प्रलंबित आहे.</p>
      
      <div class="info-box">
          <p><strong>नाव:</strong> <span id="sucName" style="color:#fff;"></span></p>
          <p><strong>पदनाम:</strong> <span id="sucDesig" style="color:#fff;"></span></p>
          <p><strong>कार्यालय:</strong> <span id="sucOffice" style="color:#fff;"></span></p>
          <p><strong>जिल्हा:</strong> <span id="sucDistrict" style="color:#fff;"></span></p>
          <p><strong>युजरनेम:</strong> <span id="sucUsername" style="color: var(--cyan); font-weight: bold;"></span></p>
          <p><strong>पासवर्ड:</strong> <span id="sucPassword" style="color: var(--cyan); font-weight: bold;"></span></p>
      </div>

      <div class="contact-btns">
          <a href="#" id="btnCallAdmin" class="contact-btn btn-call"><i class="fa-solid fa-phone"></i> कॉल</a>
          <a href="#" id="btnWaAdmin" class="contact-btn btn-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> व्हॉट्सॲप</a>
      </div>
      
      <button onclick="location.reload()" style="margin-top: 20px; background: none; border: none; color: var(--cyan); text-decoration: underline; cursor: pointer; font-size: 14px;">लॉगिन पेजवर परत जा</button>
  </div>

  <!-- ================= FORGOT PASSWORD SCREEN ================= -->
  <div class="login-card hidden" id="forgotScreen">
      <h2 class="title" style="font-size:22px;">पासवर्ड रिसेट</h2>
      
      <form id="forgotForm" onsubmit="handleForgotSubmit(event)">
          <div class="field">
              <i class="fa-solid fa-user-tag main-icon"></i>
              <input type="text" id="fUsername" placeholder="तुमचे युजरनेम" required>
          </div>
          <div class="field">
              <i class="fa-solid fa-id-card main-icon"></i>
              <input type="text" id="fName" placeholder="पूर्ण नाव" required>
          </div>
          <div class="field">
              <i class="fa-solid fa-phone main-icon"></i>
              <input type="tel" id="fMobile" placeholder="मोबाईल नंबर" required>
          </div>
          <div class="field">
              <i class="fa-solid fa-building main-icon"></i>
              <input type="text" id="fOffice" placeholder="कार्यालयाचे नाव" required>
          </div>
          <div class="field">
              <i class="fa-solid fa-map-location-dot main-icon"></i>
              <select id="fDistrict" required style="color:#b6dced;">
                  <option value="" disabled selected>जिल्हा निवडा</option>
                  <option value="अहमदनगर">अहमदनगर</option>
                  <option value="अकोला">अकोला</option>
                  <option value="अमरावती">अमरावती</option>
                  <option value="औरंगाबाद (छत्रपती संभाजीनगर)">औरंगाबाद</option>
                  <option value="पुणे">पुणे</option>
                  <option value="मुंबई शहर">मुंबई शहर</option>
                  <option value="नागपूर">नागपूर</option>
                  <!-- इतर जिल्हे आवश्यकतेनुसार ॲड करा -->
              </select>
              <i class="fa-solid fa-chevron-down select-arrow"></i>
          </div>
          <div class="field">
              <i class="fa-solid fa-briefcase main-icon"></i>
              <input type="text" id="fDesignation" placeholder="पदनाम" required>
          </div>
          
          <button type="submit" class="btn-submit" style="background:linear-gradient(110deg,#ff9800,#f57c00); color:#fff;">रिसेट विनंती पाठवा</button>
          <a onclick="backToLogin()" style="display:block; text-align:center; margin-top:15px; color:var(--cyan); font-size:14px; cursor:pointer;">लॉगिन वर परत जा</a>
      </form>
  </div>

  <div class="contact">
      <a href="tel:+918446556141" title="Call"><i class="fa-solid fa-phone"></i></a>
      <a href="https://wa.me/918446556141" target="_blank" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
  </div>
  <div class="contact-note">Contact Admin</div>

</main>

<!-- फोटो क्रॉप मोडल -->
<div id="cropModal" class="hidden">
    <div class="crop-container">
        <img id="cropImage" src="" alt="Crop Image">
    </div>
    <div class="crop-actions">
        <button type="button" class="btn-cancel" onclick="cancelCrop()">रद्द करा</button>
        <button type="button" class="btn-save-crop" onclick="saveCrop()">क्रॉप करा</button>
    </div>
</div>

<script>
    const ADMIN_MOBILE = "918446556141"; 
    let cropper = null;

    const designationList = [
        "कनिष्ठ अभियंता", "कार्यकारी अभियंता", "अधिक्षक अभियंता", "मुख्य अभियंता",
        "कनिष्ठ लिपिक", "वरिष्ठ लिपिक", "सहाय्यक", "अधिकारी", "शिपाई", "वाहनचालक"
    ];

    // डिफॉल्ट ॲडमिन तयार करणे
    if (!localStorage.getItem('ow_users')) {
        const defaultUsers = {
            'admin': { name: 'Vitthal Kokate Patil', password: 'admin123', role: 'admin', status: 'approved' }
        };
        localStorage.setItem('ow_users', JSON.stringify(defaultUsers));
    }

    // टॅब स्विच करणे
    function switchTab(tab) {
        document.getElementById('statusMessage').classList.add('hidden');
        document.getElementById('forgotScreen').classList.add('hidden');
        document.getElementById('successScreen').classList.add('hidden');
        document.getElementById('formContainer').classList.remove('hidden');

        if(tab === 'login') {
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        } else {
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('tabRegister').classList.add('active');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }
    }

    // पासवर्ड डोळा टॉगल
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye');
        }
    }

    function showMsg(msg, isError) {
        const el = document.getElementById('statusMessage');
        el.textContent = msg;
        el.className = 'status-msg ' + (isError ? 'msg-error' : 'msg-success');
        el.classList.remove('hidden');
    }

    // ================= व्हॅलिडेशन =================

    function checkField(inputElement) {
        const fieldDiv = inputElement.closest('.field');
        const icon = fieldDiv.querySelector('.main-icon');
        if (inputElement.value.trim() !== '') {
            fieldDiv.classList.add('valid-field'); fieldDiv.classList.remove('invalid-field');
            if(icon) { icon.classList.add('icon-valid'); icon.classList.remove('icon-invalid'); }
        } else {
            fieldDiv.classList.remove('valid-field');
            if(icon) icon.classList.remove('icon-valid');
        }
    }

    function checkMobile(inputElement) {
        const fieldDiv = inputElement.closest('.field');
        const icon = fieldDiv.querySelector('.main-icon');
        const msg = document.getElementById('mobileMsg');
        const val = inputElement.value.trim();

        if (val.length === 10) {
            fieldDiv.classList.add('valid-field'); fieldDiv.classList.remove('invalid-field');
            if(icon) { icon.classList.add('icon-valid'); icon.classList.remove('icon-invalid'); }
            msg.classList.add('hidden');
        } else {
            fieldDiv.classList.remove('valid-field'); fieldDiv.classList.add('invalid-field');
            if(icon) { icon.classList.add('icon-invalid'); icon.classList.remove('icon-valid'); }
            msg.textContent = "१० अंकी मोबाईल नंबर टाका";
            msg.className = "validation-text val-error"; msg.classList.remove('hidden');
        }
    }

    function checkUsername(inputElement) {
        const fieldDiv = inputElement.closest('.field');
        const msg = document.getElementById('userMsg');
        const val = inputElement.value.trim();

        if (val === '') {
            fieldDiv.classList.remove('valid-field', 'invalid-field');
            msg.classList.add('hidden');
            return;
        }

        const users = JSON.parse(localStorage.getItem('ow_users') || '{}');
        if (users[val]) {
            fieldDiv.classList.remove('valid-field'); fieldDiv.classList.add('invalid-field');
            msg.textContent = "हा युजरनेम आधीच उपलब्ध आहे!";
            msg.className = "validation-text val-error"; msg.classList.remove('hidden');
        } else {
            fieldDiv.classList.remove('invalid-field'); fieldDiv.classList.add('valid-field');
            msg.textContent = "✓ हा युजरनेम उपलब्ध आहे";
            msg.className = "validation-text val-success"; msg.classList.remove('hidden');
        }
    }

    function checkPassword(inputElement) {
        const fieldDiv = inputElement.closest('.field');
        const msg = document.getElementById('passMsg');
        const val = inputElement.value;

        if (val.length >= 6) {
            fieldDiv.classList.add('valid-field'); fieldDiv.classList.remove('invalid-field');
            msg.textContent = "✓ पासवर्ड योग्य आहे";
            msg.className = "validation-text val-success"; msg.classList.remove('hidden');
        } else {
            fieldDiv.classList.remove('valid-field'); fieldDiv.classList.add('invalid-field');
            msg.textContent = "कमीत कमी ६ अक्षरे आवश्यक";
            msg.className = "validation-text val-error"; msg.classList.remove('hidden');
        }
    }

    // पदनाम सजेशन
    let currentSuggestion = "";
    function handleDesigInput(inputElement) {
        checkField(inputElement);
        const val = inputElement.value;
        const sugBox = document.getElementById('desigSuggestion');

        if (!val) {
            sugBox.classList.add('hidden');
            currentSuggestion = "";
            return;
        }

        const match = designationList.find(item => item.startsWith(val));

        if (match && match !== val) {
            currentSuggestion = match;
            sugBox.innerHTML = `<span class="bold-part">${val}</span><span class="faded-part">${match.substring(val.length)}</span>`;
            sugBox.classList.remove('hidden');
        } else {
            sugBox.classList.add('hidden');
            currentSuggestion = "";
        }
    }

    function handleDesigKey(e, inputElement) {
        if ((e.key === 'Tab' || e.key === 'Enter') && currentSuggestion) {
            e.preventDefault();
            inputElement.value = currentSuggestion;
            document.getElementById('desigSuggestion').classList.add('hidden');
            checkField(inputElement);
        }
    }

    // ================= फोटो क्रॉप =================

    function openCropModal(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const cropImage = document.getElementById('cropImage');
                cropImage.src = e.target.result;
                
                document.getElementById('cropModal').classList.remove('hidden');
                
                if (cropper) { cropper.destroy(); }
                
                setTimeout(() => {
                    cropper = new Cropper(cropImage, {
                        aspectRatio: NaN, viewMode: 1, dragMode: 'move', autoCropArea: 1, restore: false, guides: false, center: true, highlight: false, cropBoxMovable: true, cropBoxResizable: true, toggleDragModeOnDblclick: false
                    });
                }, 100);
            };
            reader.readAsDataURL(file);
        }
    }

    function cancelCrop() {
        document.getElementById('cropModal').classList.add('hidden');
        document.getElementById('regPhoto').value = '';
        if (cropper) { cropper.destroy(); cropper = null; }
    }

    function saveCrop() {
        if (!cropper) return;
        const canvas = cropper.getCroppedCanvas();
        const croppedImageUrl = canvas.toDataURL('image/jpeg');

        const label = document.getElementById('photoLabel');
        const text = document.getElementById('photoText');
        const icon = document.getElementById('photoIcon');
        
        label.classList.add('uploaded');
        text.textContent = "फोटो अपलोड झाला (बदलण्यासाठी क्लिक करा)";
        icon.classList.remove('fa-camera'); icon.classList.add('fa-check-circle');

        label.dataset.croppedImage = croppedImageUrl;

        document.getElementById('cropModal').classList.add('hidden');
        if (cropper) { cropper.destroy(); cropper = null; }
    }

    // ================= लॉगिन आणि रजिस्टर =================

    function handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value.trim();
        
        const users = JSON.parse(localStorage.getItem('ow_users') || '{}');
        const user = users[u];

        if (!user) return showMsg('चुकीचा युजरनेम!', true);
        if (user.password !== p) return showMsg('चुकीचा पासवर्ड!', true);
        if (user.status !== 'approved') return showMsg('तुमचे खाते ॲडमिनने मंजूर केलेले नाही!', true);

        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', u);
        localStorage.setItem('userRole', user.role);
        localStorage.setItem('displayName', user.name);
        
        // 🌟 रिडायरेक्ट डॅशबोर्डवर
        window.location.href = 'dashboard.html';
    }

    function handleRegister(e) {
        e.preventDefault();
        
        const photoLabel = document.getElementById('photoLabel');
        const croppedImage = photoLabel.dataset.croppedImage;
        if (!croppedImage) {
            return showMsg('कृपया फोटो अपलोड करून क्रॉप करा!', true);
        }

        const u = document.getElementById('regUsername').value.trim();
        const p = document.getElementById('regPassword').value.trim();
        const name = document.getElementById('regName').value.trim();
        const mobile = document.getElementById('regMobile').value.trim();
        const desig = document.getElementById('regDesignation').value.trim();
        const office = document.getElementById('regOffice').value.trim();
        const district = document.getElementById('regDistrict').value;
        
        let users = JSON.parse(localStorage.getItem('ow_users') || '{}');
        
        if (users[u]) return showMsg('हा युजरनेम आधीच अस्तित्वात आहे!', true);
        if (mobile.length !== 10) return showMsg('कृपया १० अंकी मोबाईल नंबर टाका!', true);
        if (p.length < 6) return showMsg('पासवर्ड कमीत कमी ६ अक्षरांचा असावा!', true);

        users[u] = {
            name: name, mobile: mobile, designation: desig, office: office, district: district,
            password: p, role: 'user', status: 'pending', photo: croppedImage
        };

        localStorage.setItem('ow_users', JSON.stringify(users));
        
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('successScreen').classList.remove('hidden');
        
        document.getElementById('sucName').textContent = name;
        document.getElementById('sucDesig').textContent = desig;
        document.getElementById('sucOffice').textContent = office;
        document.getElementById('sucDistrict').textContent = district;
        document.getElementById('sucUsername').textContent = u;
        document.getElementById('sucPassword').textContent = p;

        const waMessage = `नमस्कार ॲडमिन,%0A%0Aमाझे रजिस्ट्रेशन झाले आहे. कृपया माझे खाते ॲक्टिव्हेट करावे ही विनंती.%0A%0A*माझी माहिती:*%0A*नाव:* ${name}%0A*पदनाम:* ${desig}%0A*कार्यालय:* ${office}%0A*जिल्हा:* ${district}%0A*युजरनेम:* ${u}%0A*पासवर्ड:* ${p}%0A%0Aधन्यवाद!`;
        
        document.getElementById('btnWaAdmin').href = `https://wa.me/${ADMIN_MOBILE}?text=${waMessage}`;
        document.getElementById('btnCallAdmin').href = `tel:+${ADMIN_MOBILE}`;
    }

    // ================= पासवर्ड विसरल्यास =================

    function showForgotScreen() {
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('forgotScreen').classList.remove('hidden');
    }

    function backToLogin() {
        document.getElementById('forgotScreen').classList.add('hidden');
        document.getElementById('formContainer').classList.remove('hidden');
    }

    function handleForgotSubmit(e) {
        e.preventDefault();
        const u = document.getElementById('fUsername').value.trim();
        const name = document.getElementById('fName').value.trim();
        const mobile = document.getElementById('fMobile').value.trim();
        const office = document.getElementById('fOffice').value.trim();
        const district = document.getElementById('fDistrict').value;
        const desig = document.getElementById('fDesignation').value.trim();
        
        const users = JSON.parse(localStorage.getItem('ow_users') || '{}');
        const user = users[u];

        if (!user) return showMsg("हा युजरनेम सापडला नाही!", true);

        if (user.name.toLowerCase() !== name.toLowerCase() || user.mobile !== mobile) {
            return showMsg("तुमचे नाव किंवा मोबाईल नंबर जुळत नाही!", true);
        }

        const resetMsg = `नमस्कार ॲडमिन,%0A%0Aमी माझा पासवर्ड विसरलो आहे. कृपया माझा पासवर्ड रिसेट करून मला कळवावे.%0A%0A*माझी माहिती:*%0A*नाव:* ${name}%0A*पदनाम:* ${desig}%0A*कार्यालय:* ${office}%0A*जिल्हा:* ${district}%0A*युजरनेम:* ${u}%0A*मोबाईल:* ${mobile}%0A%0Aधन्यवाद!`;
        
        window.open(`https://wa.me/${ADMIN_MOBILE}?text=${resetMsg}`, '_blank');
        alert("तुमची पासवर्ड रिसेट विनंती ॲडमिनकडे पाठवली आहे.");
        backToLogin();
    }

    // फोकस
    window.onload = function() {
        document.getElementById('loginUsername').focus();
    };
</script>
</body>
</html>
