<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सार्वजनिक बांधकाम विभाग व्यवस्थापन प्रणाली</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">

    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold flex items-center gap-2">
                <span>🏛️</span> PWD Management System
            </h1>
            <div id="sync-status" class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full text-indigo-200">
                ऑफ़लाइन मोड
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-3 mb-6">
            <button onclick="openTab('je')" class="flex flex-col items-center justify-center p-3 bg-blue-900 text-white rounded-xl shadow hover:bg-blue-800 transition">
                <span class="text-2xl mb-1">👷</span>
                <span class="text-xs font-semibold">JE</span>
            </button>
            <button onclick="openTab('mb')" class="flex flex-col items-center justify-center p-3 bg-emerald-800 text-white rounded-xl shadow hover:bg-emerald-700 transition">
                <span class="text-2xl mb-1">📖</span>
                <span class="text-xs font-semibold">M.B.</span>
            </button>
            <button onclick="openTab('work')" class="flex flex-col items-center justify-center p-3 bg-teal-800 text-white rounded-xl shadow hover:bg-teal-700 transition">
                <span class="text-2xl mb-1">📋</span>
                <span class="text-xs font-semibold">Work list</span>
            </button>
            <button onclick="openTab('bill')" class="flex flex-col items-center justify-center p-3 bg-amber-800 text-white rounded-xl shadow hover:bg-amber-700 transition">
                <span class="text-2xl mb-1">📄</span>
                <span class="text-xs font-semibold">Bill reg.</span>
            </button>
            <button onclick="openTab('assign')" class="flex flex-col items-center justify-center p-3 bg-purple-800 text-white rounded-xl shadow hover:bg-purple-700 transition">
                <span class="text-2xl mb-1">📂</span>
                <span class="text-xs font-semibold">Assign</span>
            </button>
            <button onclick="openTab('settings')" class="flex flex-col items-center justify-center p-3 bg-rose-800 text-white rounded-xl shadow hover:bg-rose-700 transition">
                <span class="text-2xl mb-1">⚙️</span>
                <span class="text-xs font-semibold">सेटिंग</span>
            </button>
        </div>

        <div id="content-container" class="bg-white rounded-2xl shadow-sm p-4 md:p-6">
            <!-- Dynamic content loaded via JS -->
        </div>
    </main>

    <div id="custom-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-xl">
            <div id="modal-icon" class="text-4xl mb-2">⚠️</div>
            <h3 id="modal-title" class="text-lg font-bold mb-2">सूचना</h3>
            <p id="modal-message" class="text-sm text-slate-600 mb-6">काहीतरी संदेश...</p>
            <button onclick="closeModal()" class="w-full bg-indigo-900 text-white py-2.5 rounded-xl font-medium hover:bg-indigo-800">ठीक आहे</button>
        </div>
    </div>

    <script type="module">
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pwd-default-app';

        let currentTab = 'je';

        // Local In-Memory State Fallback
        let appData = {
            jes: [
                { id: '1', name: 'श्री गोरनाळे रावसाहेब', mobile: '9876543210', division: 'विभाग १' }
            ],
            mbs: [
                { id: '1', mbNo: '00100100', size: 'लहान M.B.', type: 'भंडारपाल कडून प्राप्त', date: '2026-09-01' },
                { id: '2', mbNo: '00200200', size: 'लहान M.B.', type: 'भंडारपाल कडून प्राप्त', date: '2026-09-02' },
                { id: '3', mbNo: '00100100', size: 'लहान M.B.', type: 'दिलेली M.B. : JE', date: '2026-09-20', jeName: 'श्री गोरनाळे रावसाहेब' }
            ],
            works: [],
            bills: []
        };

        window.showModal = function(title, message, icon = '⚠️') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('custom-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        };

        window.openTab = function(tabName) {
            currentTab = tabName;
            renderTabContent();
        };

        function renderTabContent() {
            const container = document.getElementById('content-container');
            if (currentTab === 'je') {
                container.innerHTML = `
                    <h2 class="text-lg font-bold mb-4 text-indigo-900">👷 कनिष्ठ अभियंता (JE) व्यवस्थापन</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <input type="text" id="je-name" placeholder="अभ्यांत्याचे नाव *" class="border p-3 rounded-xl w-full text-sm">
                        <input type="text" id="je-mobile" placeholder="मोबाईल नंबर" class="border p-3 rounded-xl w-full text-sm">
                        <input type="text" id="je-div" placeholder="विभाग / कार्यालय" class="border p-3 rounded-xl w-full text-sm md:col-span-2">
                        <button onclick="saveJE()" class="bg-indigo-900 text-white py-3 rounded-xl font-medium md:col-span-2 hover:bg-indigo-800">माहिती सेव्ह करा</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-indigo-50 text-indigo-900 border-b">
                                    <th class="p-3">अ.क्र.</th>
                                    <th class="p-3">नाव</th>
                                    <th class="p-3">मोबाईल</th>
                                    <th class="p-3">विभाग</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${appData.jes.map((je, idx) => `
                                    <tr class="border-b">
                                        <td class="p-3">${idx + 1}</td>
                                        <td class="p-3 font-medium">${je.name}</td>
                                        <td class="p-3">${je.mobile || '-'}</td>
                                        <td class="p-3">${je.division || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (currentTab === 'mb') {
                container.innerHTML = `
                    <h2 class="text-lg font-bold mb-4 text-emerald-900">📖 मोजमाप पुस्तिका (M.B.) नोंद</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <input type="text" id="mb-no" placeholder="M.B. क्रमांक (उदा. 00100100) *" class="border p-3 rounded-xl w-full text-sm">
                        <select id="mb-size" class="border p-3 rounded-xl w-full text-sm">
                            <option value="लहान M.B.">लहान M.B.</option>
                            <option value="मोठी M.B.">मोठी M.B.</option>
                        </select>
                        <select id="mb-type" class="border p-3 rounded-xl w-full text-sm">
                            <option value="भंडारपाल कडून प्राप्त">भंडारपाल कडून प्राप्त</option>
                            <option value="दिलेली M.B. : JE">दिलेली M.B. : JE</option>
                        </select>
                        <select id="mb-je" class="border p-3 rounded-xl w-full text-sm">
                            <option value="">-- JE निवडा --</option>
                            ${appData.jes.map(je => `<option value="${je.name}">${je.name}</option>`).join('')}
                        </select>
                        <input type="date" id="mb-date" class="border p-3 rounded-xl w-full text-sm md:col-span-2" value="${new Date().toISOString().split('T')[0]}">
                        <button onclick="saveMB()" class="bg-emerald-800 text-white py-3 rounded-xl font-medium md:col-span-2 hover:bg-emerald-700">Save Entry</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-emerald-50 text-emerald-900 border-b">
                                    <th class="p-3">अ.क्र.</th>
                                    <th class="p-3">M.B. क्र.</th>
                                    <th class="p-3">साईज</th>
                                    <th class="p-3">M.B. हस्तांतरण</th>
                                    <th class="p-3">दिनांक</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${appData.mbs.map((mb, idx) => `
                                    <tr class="border-b">
                                        <td class="p-3">${idx + 1}</td>
                                        <td class="p-3 font-medium">${mb.mbNo}</td>
                                        <td class="p-3">${mb.size}</td>
                                        <td class="p-3">${mb.jeName ? `${mb.type} (${mb.jeName})` : mb.type}</td>
                                        <td class="p-3">${mb.date}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (currentTab === 'work') {
                container.innerHTML = `
                    <h2 class="text-lg font-bold mb-4 text-teal-900">📋 कामाची यादी (Work List)</h2>
                    <p class="text-sm text-slate-600">येथे मंजूर कामांची यादी नोंदवली जाते.</p>
                `;
            } else if (currentTab === 'bill') {
                container.innerHTML = `
                    <h2 class="text-lg font-bold mb-4 text-amber-900">📄 नवीन देयक नोंदवा</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">संबंधित कनिष्ठ अभियंता (JE) *</label>
                            <select id="bill-je" onchange="updateMBDropdown(this.value)" class="border p-3 rounded-xl w-full text-sm">
                                <option value="">-- JE निवडा --</option>
                                ${appData.jes.map(je => `<option value="${je.name}">${je.name}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">-- M.B. निवडा -- *</label>
                            <select id="bill-mb" class="border p-3 rounded-xl w-full text-sm">
                                <option value="">-- प्रथम JE निवडा --</option>
                            </select>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'assign') {
                container.innerHTML = `
                    <h2 class="text-lg font-bold mb-4 text-purple-900">📂 काम वाटप (Assign Work)</h2>
                    <p class="text-sm text-slate-600">कनिष्ठ अभियंत्याला काम सोपवणे.</p>
                `;
            } else if (currentTab === 'settings') {
                container.innerHTML = `
                    <h2 class="text-lg font-bold mb-4 text-rose-900">⚙️ सेटिंग्ज</h2>
                    <p class="text-sm text-slate-600">सिस्टम सेटिंग आणि डेटा बॅकअप.</p>
                `;
            }
        }

        window.saveJE = function() {
            const name = document.getElementById('je-name').value.trim();
            const mobile = document.getElementById('je-mobile').value.trim();
            const division = document.getElementById('je-div').value.trim();

            if (!name) {
                showModal('त्रुटी', 'कृपया अभियंत्याचे नाव प्रविष्ट करा.');
                return;
            }

            appData.jes.push({ id: Date.now().toString(), name, mobile, division });
            renderTabContent();
            showModal('यशस्वी', 'कनिष्ठ अभियंता यशस्वीरित्या सेव्ह केला.', '✅');
        };

        window.saveMB = function() {
            const mbNo = document.getElementById('mb-no').value.trim();
            const size = document.getElementById('mb-size').value;
            const type = document.getElementById('mb-type').value;
            const jeName = document.getElementById('mb-je').value;
            const date = document.getElementById('mb-date').value;

            if (!mbNo) {
                showModal('त्रुटी', 'कृपया M.B. क्रमांक प्रविष्ट करा.');
                return;
            }

            appData.mbs.push({ id: Date.now().toString(), mbNo, size, type, jeName, date });
            renderTabContent();
            showModal('यशस्वी', 'मोजमाप पुस्तिका नोंद यशस्वीरित्या सेव्ह झाली.', '✅');
        };

        window.updateMBDropdown = function(selectedJE) {
            const mbSelect = document.getElementById('bill-mb');
            if (!mbSelect) return;

            if (!selectedJE) {
                mbSelect.innerHTML = `<option value="">-- प्रथम JE निवडा --</option>`;
                return;
            }

            // फक्त आणि फक्त ज्या M.B. निवडीमध्ये या कनिष्ठ अभियंत्याला (JE) वाटप केल्याची नोंद आहे, त्याच फिल्टर करणे
            const filteredMBs = appData.mbs.filter(m => {
                return m.jeName === selectedJE && m.type.includes('दिलेली M.B.');
            });

            // डुप्लिकेशन टाळण्यासाठी युनिक M.B. क्रमांकांची यादी काढणे
            const uniqueMBNumbers = [...new Set(filteredMBs.map(m => m.mbNo))];

            if (uniqueMBNumbers.length === 0) {
                mbSelect.innerHTML = `<option value="">-- या JE कडे कोणतीही M.B. उपलब्ध नाही --</option>`;
            } else {
                mbSelect.innerHTML = `<option value="">-- M.B. निवडा --</option>` + 
                    uniqueMBNumbers.map(mbNo => `<option value="${mbNo}">${mbNo}</option>`).join('');
            }
        };

        // Initial setup load
        window.onload = function() {
            renderTabContent();
        };
    </script>
</body>
</html>
