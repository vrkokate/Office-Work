<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Hub - Login & Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: #020d1b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .profile-container { text-align: center; margin-bottom: 20px; }
        .profile-pic {
            width: 100px; height: 100px; border-radius: 50%;
            border: 3px solid #00f3ff; box-shadow: 0 0 20px #00f3ff;
            object-fit: cover; background: #0a192f; margin-bottom: 10px;
        }
        .app-title { font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        .app-title span { color: #00f3ff; }
        .app-subtitle { font-size: 12px; color: #00f3ff; margin-bottom: 15px; }
        
        .login-card {
            width: 100%; max-width: 350px;
            background: rgba(2, 6, 23, 0.9);
            border: 2px solid #00f3ff; border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
            padding: 25px 20px;
        }
        
        .tab-buttons { display: flex; margin-bottom: 20px; border-bottom: 1px solid #1e3a5f; }
        .tab-btn {
            flex: 1; background: none; border: none; color: #888;
            font-size: 15px; font-weight: bold; padding: 10px; cursor: pointer;
        }
        .tab-btn.active { color: #00f3ff; border-bottom: 2px solid #00f3ff; }

        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #00f3ff; }
        .input-box {
            width: 100%; background: #0a192f; border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px; padding: 12px 15px 12px 40px; color: #fff; font-size: 14px; outline: none;
        }
        .input-box:focus { border-color: #00f3ff; box-shadow: 0 0 10px rgba(0,243,255,0.3); }
        
        .btn-submit {
            width: 100%; background: #00f3ff; color: #020d1b; border: none;
            border-radius: 10px; padding: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 10px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        .btn-submit:hover { background: #00c4d1; }
        .hidden { display: none !important; }
        
        .status-msg { font-size: 12px; text-align: center; margin-top: 10px; font-weight: bold; }
        .msg-error { color: #ff4d4d; }
        .msg-success { color: #00ff88; }
    </style>
</head>
<body>

    <div class="profile-container">
        <img src="home-bg.jpg" alt="Profile" class="profile-pic" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
        <div class="app-title">SMART TOOLS <span>STRONGER WORK</span></div>
        <div class="app-subtitle">Created by Vitthal Kokate Patil</div>
    </div>

    <div class="login-card">
        <!-- Tabs -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">लॉगिन</button>
            <button class="tab-btn" onclick="switchTab('register')">नवीन रजिस्ट्रेशन</button>
        </div>

        <div id="statusMessage" class="status-msg hidden"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="loginUsername" class="input-box" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" class="input-box" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <!-- REGISTRATION FORM -->
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
            <div class="input-group">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" id="regName" class="input-box" placeholder="पूर्ण नाव" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="regMobile" class="input-box" placeholder="मोबाईल नंबर" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-briefcase"></i>
                <input type="text" id="regDesignation" class="input-box" placeholder="पदनाम (उदा. कनिष्ठ अभियंता)" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-building"></i>
                <input type="text" id="regOffice" class="input-box" placeholder="विभाग / कार्यालय" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-user-tag"></i>
                <input type="text" id="regUsername" class="input-box" placeholder="नवीन Username" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-key"></i>
                <input type="password" id="regPassword" class="input-box" placeholder="पासवर्ड (कमीत कमी ६ अक्षरे)" required minlength="6">
            </div>
            <button type="submit" class="btn-submit" style="background:#00ff88; color:#000;">रजिस्टर करा</button>
        </form>
    </div>

    <script>
        // सुरुवातीला ॲडमिन अकाऊंट तयार करणे (जर नसेल तर)
        if (!localStorage.getItem('ow_users')) {
            const defaultUsers = {
                'admin': { 
                    name: 'Vitthal Kokate Patil', 
                    password: 'admin123', 
                    role: 'admin', 
                    status: 'approved',
                    designation: 'Admin',
                    office: 'Main Office'
                }
            };
            localStorage.setItem('ow_users', JSON.stringify(defaultUsers));
        }

        function switchTab(tab) {
            document.getElementById('statusMessage').classList.add('hidden');
            if(tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.remove('active');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            } else {
                document.querySelectorAll('.tab-btn')[0].classList.remove('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
            }
        }

        function showMsg(msg, isError) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = 'status-msg ' + (isError ? 'msg-error' : 'msg-success');
            el.classList.remove('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            
            const users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            const user = users[u];

            if (!user) return showMsg('चुकीचा युजरनेम!', true);
            if (user.password !== p) return showMsg('चुकीचा पासवर्ड!', true);
            if (user.status !== 'approved') return showMsg('तुमचे खाते अद्याप ॲडमिनने मंजूर केलेले नाही!', true);

            // लॉगिन यशस्वी
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', u);
            localStorage.setItem('userRole', user.role);
            localStorage.setItem('displayName', user.name);
            
            window.location.href = 'dashboard.html';
        }

        function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('regUsername').value.trim();
            
            let users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            
            if (users[u]) return showMsg('हा युजरनेम आधीच अस्तित्वात आहे!', true);

            users[u] = {
                name: document.getElementById('regName').value.trim(),
                mobile: document.getElementById('regMobile').value.trim(),
                designation: document.getElementById('regDesignation').value.trim(),
                office: document.getElementById('regOffice').value.trim(),
                password: document.getElementById('regPassword').value.trim(),
                role: 'user',
                status: 'pending' // ॲडमिन अप्रूव्हलसाठी प्रलंबित
            };

            localStorage.setItem('ow_users', JSON.stringify(users));
            showMsg('रजिस्ट्रेशन यशस्वी! ॲडमिन मंजुरीनंतर तुम्ही लॉगिन करू शकाल.', false);
            document.getElementById('registerForm').reset();
            setTimeout(() => switchTab('login'), 3000);
        }
    </script>
</body>
</html>
