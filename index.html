<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020d1b">
<title>SMART TOOLS STRONGER WORK — Login</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020d1b;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  position: fixed;
  inset: 0;
  overscroll-behavior: none;
}

#login-screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #020d1b;
  display: flex;
  align-items: center;
  justify-content: center;
}

#design {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
  position: absolute;
  z-index: 1;
}

/* मूळ फोटोवरील इनपुट बॉक्सेस अचूक बसवण्यासाठी ओव्हरले */
.overlay-form {
  position: absolute;
  z-index: 10;
  width: 82%;
  max-width: 320px;
  top: 55%; 
  left: 50%;
  transform: translate(-50%, 0);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.input-container {
  position: relative;
  width: 100%;
  background: rgba(2, 6, 23, 0.7);
  border: 1px solid rgba(0, 243, 255, 0.4);
  border-radius: 12px;
}

.input-container i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #00f3ff;
  font-size: 15px;
}

.input-box {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #ffffff;
  font-size: 14px;
  padding: 12px 12px 12px 42px;
}

.login-btn {
  width: 100%;
  height: 46px;
  background: transparent;
  border: none;
  cursor: pointer;
  border-radius: 12px;
}

.forgot-link {
  text-align: center;
  background: transparent;
  border: none;
  color: #00f3ff;
  font-size: 12px;
  cursor: pointer;
  margin-top: 4px;
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <main id="login-screen" aria-label="Login page design">
    <!-- येथे तुमच्या फोटोची फाईल टाकली आहे -->
    <img id="design"
         alt="Original login page design"
         src="login-bg.jpg">
    
    <div class="overlay-form">
      <form id="loginForm" onsubmit="processLogin(event)">
        <div class="input-container" style="margin-bottom: 12px;">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" class="input-box" placeholder="Username" required>
        </div>

        <div class="input-container" style="margin-bottom: 14px;">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" class="input-box" placeholder="Password" required>
        </div>

        <button type="submit" class="login-btn"></button>
      </form>

      <button type="button" class="forgot-link" onclick="forgotPassword()">Forgot Password?</button>
    </div>
  </main>

  <script>
    function processLogin(event) {
      event.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();

      if (u === 'admin' && p === 'admin123') {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', u);
        localStorage.setItem('userRole', 'admin');
        window.location.href = 'dashboard.html';
      } else if (u === 'user' && p === 'user123') {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', u);
        localStorage.setItem('userRole', 'user');
        window.location.href = 'dashboard.html';
      } else {
        alert('चुकीचा युजरनेम किंवा पासवर्ड!');
      }
    }

    function forgotPassword() {
      alert('कृपया पासवर्ड रिसेट करण्यासाठी ऍडमिनशी संपर्क साधा.');
    }
  </script>
</body>
</html>
