<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Hub - Office Work</title>
    <!-- jsPDF लायब्ररी (PDF जनरेट करण्यासाठी) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b131e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h2 {
            color: #00d2ff;
        }
        .container {
            margin-top: 50px;
        }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Digital Hub & M.B. System</h2>
        <p>ONE PLATFORM | MANY SOLUTIONS</p>
        
        <!-- REPORT / PRINT बटण -->
        <button class="btn" onclick="generatePDF()">📄 REPORT / PRINT (Download PDF)</button>
    </div>

    <script>
        // PDF जनरेट करून डाऊनलोड करण्याचे फंक्शन
        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // PDF मधील मजकूर सेट करणे
            doc.setFont("helvetica", "normal");
            doc.setFontSize(18);
            doc.text("Digital Hub - Office Report", 20, 20);
            
            doc.setFontSize(12);
            doc.text("M.B. & Work Details Report", 20, 30);
            
            doc.text("----------------------------------------------------------------", 20, 40);
            doc.text("हा रिपोर्ट ॲपमधून यशस्वीरित्या जनरेट केला आहे.", 20, 50);
            doc.text("वेळ आणि तारीख: " + new Date().toLocaleString(), 20, 60);

            // PDF फाईल मोबाईलमध्ये सेव्ह करणे
            doc.save("Office_Report.pdf");
        }
    </script>

</body>
</html>
