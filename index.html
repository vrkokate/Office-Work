<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020d1b">
<title>SMART TOOLS STRONGER WORK — Login</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020d1b;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  position: fixed;
  inset: 0;
  overscroll-behavior: none;
}

#login-screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #020d1b;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* डिझाईन किंवा बॅकग्राउंडसाठी डिव्ह */
.bg-design {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1;
}

/* ओव्हरले फॉर्म जो अचूक डिझाईन दिसेल */
.overlay-form {
  position: absolute;
  z-index: 10;
  width: 85%;
  max-width: 320px;
  top: 52%; 
  left: 50%;
  transform: translate(-50%, 0);
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: rgba(2, 6, 23, 0.85);
  padding: 20px;
  border-radius: 20px;
  border: 1px solid rgba(0, 243, 255, 0.4);
  box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
}

.input-container {
  position: relative;
  width: 100%;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(0, 243, 255, 0.4);
  border-radius: 12px;
}

.input-container i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #00f3ff;
  font-size: 15px;
}

.input-box {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #ffffff;
  font-size: 14px;
  padding: 12px 12px 12px 42px;
}

.login-btn {
  width: 100%;
  height: 46px;
  background: #00f3ff;
  color: #020617;
  font-weight: bold;
  border: none;
  cursor: pointer;
  border-radius: 12px;
  font-size: 15px;
  box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
  transition: 0.3s;
}

.login-btn:hover {
  background: #38bdf8;
}

.forgot-link {
  text-align: center;
  background: transparent;
  border: none;
  color: #00f3ff;
  font-size: 12px;
  cursor: pointer;
  margin-top: 4px;
}

.brand-title {
  position: absolute;
  top: 15%;
  text-align: center;
  z-index: 5;
}

.brand-title h1 {
  font-size: 18px;
  color: #ffffff;
  letter-spacing: 1px;
  margin: 0;
}

.brand-title p {
  font-size: 11px;
  color: #38bdf8;
  margin: 4px 0 0 0;
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <main id="login-screen" aria-label="Login page">
    <div class="bg-design">
      <div class="brand-title">
        <h1>SMART TOOLS <span style="color: #00f3ff;">STRONGER WORK</span></h1>
        <p>Created by Vitthal Kokate Patil</p>
      </div>

      <div class="overlay-form">
        <div style="text-align: center; margin-bottom: 5px;">
          <h2 style="color: #00f3ff; font-size: 20px; margin: 0; letter-spacing: 2px;">LOGIN</h2>
          <div style="width: 30px; height: 2px; background: #00f3ff; margin: 5px auto 0 auto;"></div>
        </div>

        <form id="loginForm" onsubmit="processLogin(event)">
          <div class="input-container" style="margin-bottom: 12px;">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" class="input-box" placeholder="Username" required>
          </div>

          <div class="input-container" style="margin-bottom: 14px;">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="input-box" placeholder="Password" required>
          </div>

          <button type="submit" class="login-btn">Sign In</button>
        </form>

        <button type="button" class="forgot-link" onclick="forgotPassword()">Forgot Password?</button>
      </div>
    </div>
  </main>

  <script>
    function processLogin(event) {
      event.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();

      if (u === 'admin' && p === 'admin123') {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', u);
        localStorage.setItem('userRole', 'admin');
        window.location.href = 'dashboard.html';
      } else if (u === 'user' && p === 'user123') {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', u);
        localStorage.setItem('userRole', 'user');
        window.location.href = 'dashboard.html';
      } else {
        alert('चुकीचा युजरनेम किंवा पासवर्ड!');
      }
    }

    function forgotPassword() {
      alert('कृपया पासवर्ड रिसेट करण्यासाठी ऍडमिनशी संपर्क साधा.');
    }
  </script>
</body>
</html>
