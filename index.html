<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Hub - Login & Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- फोटो क्रॉप करण्यासाठी Cropper.js लायब्ररी -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body {
            height: 100%; overflow: hidden; background: #020d1b; color: #ffffff;
        }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px;
        }
        .main-wrapper {
            width: 100%; max-width: 380px; display: flex; flex-direction: column; justify-content: center; height: 100%;
        }
        .profile-container { text-align: center; margin-bottom: 8px; }
        .profile-pic {
            width: 70px; height: 70px; border-radius: 50%;
            border: 2px solid #00f3ff; box-shadow: 0 0 15px #00f3ff;
            object-fit: cover; background: #0a192f; margin-bottom: 4px;
        }
        .app-title { font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        .app-title span { color: #00f3ff; }
        .app-subtitle { font-size: 10px; color: #00f3ff; margin-bottom: 8px; }
        
        .login-card {
            width: 100%; background: rgba(2, 6, 23, 0.95);
            border: 1px solid #00f3ff; border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            padding: 12px 15px; position: relative;
        }
        
        .tab-buttons { display: flex; margin-bottom: 10px; border-bottom: 1px solid #1e3a5f; }
        .tab-btn {
            flex: 1; background: none; border: none; color: #888;
            font-size: 13px; font-weight: bold; padding: 6px; cursor: pointer;
        }
        .tab-btn.active { color: #00f3ff; border-bottom: 2px solid #00f3ff; }

        .input-group { position: relative; margin-bottom: 6px; }
        .input-group i.main-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #00f3ff; font-size: 13px; z-index: 2; transition: 0.3s; }
        
        .input-box {
            width: 100%; background: #0a192f; border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px; padding: 8px 10px 8px 32px; color: #fff; font-size: 13px; outline: none;
            transition: 0.3s; position: relative; z-index: 1;
        }
        .input-box:focus { border-color: #00f3ff; }

        .input-box.valid-field { border-color: #00ff88 !important; background: rgba(0, 255, 136, 0.08) !important; }
        .input-group i.main-icon.icon-valid { color: #00ff88 !important; }
        .input-box.invalid-field { border-color: #ff4d4d !important; background: rgba(255, 77, 77, 0.08) !important; }
        .input-group i.main-icon.icon-invalid { color: #ff4d4d !important; }
        
        /* 🌟 इनलाइन सजेशन (अंधुक अक्षरे) */
        .suggestion-wrapper { position: relative; width: 100%; }
        .autocomplete-suggestion {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            padding: 8px 10px 8px 32px; font-size: 13px; font-family: inherit;
            color: transparent; background: transparent; pointer-events: none;
            white-space: nowrap; overflow: hidden; border: 1px solid transparent; box-sizing: border-box;
            z-index: 0;
        }
        .autocomplete-suggestion .bold-part { color: transparent; }
        .autocomplete-suggestion .faded-part { color: #888; }

        select.input-box { appearance: none; -webkit-appearance: none; }
        .select-arrow { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #00f3ff; font-size: 12px; pointer-events: none; z-index: 2; }

        .validation-text { font-size: 10px; margin-top: 2px; margin-left: 5px; display: block; font-weight: bold; }
        .val-success { color: #00ff88; }
        .val-error { color: #ff4d4d; }
        .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #00f3ff; font-size: 14px; cursor: pointer; z-index: 2; }

        .photo-upload-group { display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
        .photo-label {
            display: flex; align-items: center; gap: 8px;
            background: #0a192f; border: 1px dashed #00f3ff; color: #00f3ff;
            padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; width: 100%; justify-content: center;
            transition: 0.3s;
        }
        .photo-label input { display: none; }
        .photo-label.uploaded {
            border-color: #00ff88 !important; color: #00ff88 !important;
            background: rgba(0, 255, 136, 0.08) !important; border-style: solid !important;
        }

        .btn-submit {
            width: 100%; background: #00f3ff; color: #020d1b; border: none;
            border-radius: 8px; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 4px;
        }
        .forgot-link { display: block; text-align: center; margin-top: 8px; font-size: 11.5px; color: #00f3ff; cursor: pointer; text-decoration: none; }
        
        .hidden { display: none !important; }
        .status-msg { font-size: 12px; text-align: center; margin-bottom: 6px; font-weight: bold; }
        .msg-error { color: #ff4d4d; }
        .msg-success { color: #00ff88; }

        .screen { text-align: center; }
        .icon-big { font-size: 35px; color: #00ff88; margin-bottom: 8px; }
        .info-box { background: #0a192f; border: 1px solid #00f3ff; border-radius: 8px; padding: 8px; text-align: left; font-size: 12px; margin-bottom: 10px; }
        .info-box p { margin: 2px 0; }
        .info-box strong { color: #00f3ff; }
        .contact-btns { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
        .contact-btn { flex: 1; padding: 8px; border-radius: 8px; text-decoration: none; color: #fff; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-call { background: #2196F3; }
        .btn-wa { background: #25D366; }

        /* फोटो क्रॉप मोडल */
        #cropModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column;
        }
        .crop-container { flex: 1; background: #000; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; }
        #cropImage { max-width: 100%; max-height: 100%; display: block; }
        .crop-actions { padding: 15px; background: #020d1b; display: flex; gap: 10px; }
        .crop-actions button { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; border: none; font-size: 14px; }
        .btn-cancel { background: #d32f2f; color: #fff; }
        .btn-save-crop { background: #00ff88; color: #000; }
    </style>
</head>

        const ADMIN_MOBILE = "918446556141";

        if (!localStorage.getItem('ow_users')) {
            const defaultUsers = {
                'admin': { name: 'Vitthal Kokate Patil', password: 'admin123', role: 'admin', status: 'approved' }
            };
            localStorage.setItem('ow_users', JSON.stringify(defaultUsers));
        }

        function switchTab(tab) {
            document.getElementById('statusMessage').classList.add('hidden');
            document.getElementById('forgotScreen').classList.add('hidden');
            document.getElementById('successScreen').classList.add('hidden');
            document.getElementById('formContainer').classList.remove('hidden');

            if(tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.remove('active');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            } else {
                document.querySelectorAll('.tab-btn')[0].classList.remove('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
            }
        }

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye');
            }
        }

        function showMsg(msg, isError) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = 'status-msg ' + (isError ? 'msg-error' : 'msg-success');
            el.classList.remove('hidden');
        }

        function checkField(inputElement) {
            const parent = inputElement.closest('.input-group');
            const icon = parent.querySelector('.main-icon');
            if (inputElement.value.trim() !== '') {
                inputElement.classList.add('valid-field'); inputElement.classList.remove('invalid-field');
                if(icon) { icon.classList.add('icon-valid'); icon.classList.remove('icon-invalid'); }
            } else {
                inputElement.classList.remove('valid-field');
                if(icon) icon.classList.remove('icon-valid');
            }
        }

        function checkMobile(inputElement) {
            const parent = inputElement.closest('.input-group');
            const icon = parent.querySelector('.main-icon');
            const msg = document.getElementById('mobileMsg');
            const val = inputElement.value.trim();

            if (val.length === 10) {
                inputElement.classList.add('valid-field'); inputElement.classList.remove('invalid-field');
                if(icon) { icon.classList.add('icon-valid'); icon.classList.remove('icon-invalid'); }
                msg.classList.add('hidden');
            } else {
                inputElement.classList.remove('valid-field'); inputElement.classList.add('invalid-field');
                if(icon) { icon.classList.add('icon-invalid'); icon.classList.remove('icon-valid'); }
                msg.textContent = "१० अंकी मोबाईल नंबर टाका";
                msg.className = "validation-text val-error"; msg.classList.remove('hidden');
            }
        }

        function checkUsername(inputElement) {
            const icon = document.getElementById('userIcon');
            const msg = document.getElementById('userMsg');
            const val = inputElement.value.trim();

            if (val === '') {
                inputElement.classList.remove('valid-field', 'invalid-field');
                if(icon) icon.classList.remove('icon-valid', 'icon-invalid');
                msg.classList.add('hidden');
                return;
            }

            const users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            if (users[val]) {
                inputElement.classList.remove('valid-field'); inputElement.classList.add('invalid-field');
                if(icon) { icon.classList.add('icon-invalid'); icon.classList.remove('icon-valid'); }
                msg.textContent = "हा युजरनेम आधीच उपलब्ध आहे!";
                msg.className = "validation-text val-error"; msg.classList.remove('hidden');
            } else {
                inputElement.classList.remove('invalid-field'); inputElement.classList.add('valid-field');
                if(icon) { icon.classList.add('icon-valid'); icon.classList.remove('icon-invalid'); }
                msg.textContent = "✓ हा युजरनेम उपलब्ध आहे";
                msg.className = "validation-text val-success"; msg.classList.remove('hidden');
            }
        }

        function checkPassword(inputElement) {
            const icon = document.getElementById('passIcon');
            const msg = document.getElementById('passMsg');
            const val = inputElement.value;

            if (val.length >= 6) {
                inputElement.classList.add('valid-field'); inputElement.classList.remove('invalid-field');
                if(icon) { icon.classList.add('icon-valid'); icon.classList.remove('icon-invalid'); }
                msg.textContent = "✓ पासवर्ड योग्य आहे";
                msg.className = "validation-text val-success"; msg.classList.remove('hidden');
            } else {
                inputElement.classList.remove('valid-field'); inputElement.classList.add('invalid-field');
                if(icon) { icon.classList.add('icon-invalid'); icon.classList.remove('icon-valid'); }
                msg.textContent = "कमीत कमी ६ अक्षरे आवश्यक";
                msg.className = "validation-text val-error"; msg.classList.remove('hidden');
            }
        }

        let currentSuggestion = "";
        function handleDesigInput(inputElement) {
            checkField(inputElement);
            const val = inputElement.value;
            const sugBox = document.getElementById('desigSuggestion');

            if (!val) {
                sugBox.classList.add('hidden');
                currentSuggestion = "";
                return;
            }

            const match = designationList.find(item => item.startsWith(val));

            if (match && match !== val) {
                currentSuggestion = match;
                sugBox.innerHTML = `<span class="bold-part">${val}</span><span class="faded-part">${match.substring(val.length)}</span>`;
                sugBox.classList.remove('hidden');
            } else {
                sugBox.classList.add('hidden');
                currentSuggestion = "";
            }
        }

        function handleDesigKey(e, inputElement) {
            if ((e.key === 'Tab' || e.key === 'Enter') && currentSuggestion) {
                e.preventDefault();
                inputElement.value = currentSuggestion;
                document.getElementById('desigSuggestion').classList.add('hidden');
                checkField(inputElement);
            }
        }

        function openCropModal(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const cropImage = document.getElementById('cropImage');
                    cropImage.src = e.target.result;
                    
                    document.getElementById('cropModal').classList.remove('hidden');
                    
                    if (cropper) { cropper.destroy(); }
                    
                    setTimeout(() => {
                        cropper = new Cropper(cropImage, {
                            aspectRatio: NaN,
                            viewMode: 1,
                            dragMode: 'move',
                            autoCropArea: 1,
                            restore: false,
                            guides: false,
                            center: true,
                            highlight: false,
                            cropBoxMovable: true,
                            cropBoxResizable: true,
                            toggleDragModeOnDblclick: false
                        });
                    }, 100);
                };
                reader.readAsDataURL(file);
            }
        }

        function cancelCrop() {
            document.getElementById('cropModal').classList.add('hidden');
            document.getElementById('regPhoto').value = '';
            if (cropper) { cropper.destroy(); cropper = null; }
        }

        function saveCrop() {
            if (!cropper) return;
            
            const canvas = cropper.getCroppedCanvas();
            const croppedImageUrl = canvas.toDataURL('image/jpeg');

            const label = document.getElementById('photoLabel');
            const text = document.getElementById('photoText');
            const icon = document.getElementById('photoIcon');
            
            label.classList.add('uploaded');
            text.textContent = "फोटो अपलोड झाला (बदलण्यासाठी क्लिक करा)";
            icon.classList.remove('fa-image');
            icon.classList.add('fa-check-circle');

            label.dataset.croppedImage = croppedImageUrl;

            document.getElementById('cropModal').classList.add('hidden');
            if (cropper) { cropper.destroy(); cropper = null; }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            
            const users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            const user = users[u];

            if (!user) return showMsg('चुकीचा युजरनेम!', true);
            if (user.password !== p) return showMsg('चुकीचा पासवर्ड!', true);
            if (user.status !== 'approved') return showMsg('तुमचे खाते ॲडमिनने मंजूर केलेले नाही!', true);

            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', u);
            localStorage.setItem('userRole', user.role);
            localStorage.setItem('displayName', user.name);
            
            window.location.href = 'dashboard.html';
        }

        function handleRegister(e) {
            e.preventDefault();
            
            const photoLabel = document.getElementById('photoLabel');
            const croppedImage = photoLabel.dataset.croppedImage;
            if (!croppedImage) {
                return showMsg('कृपया फोटो अपलोड करून क्रॉप करा!', true);
            }

            const u = document.getElementById('regUsername').value.trim();
            const p = document.getElementById('regPassword').value.trim();
            const name = document.getElementById('regName').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            const desig = document.getElementById('regDesignation').value.trim();
            const office = document.getElementById('regOffice').value.trim();
            const district = document.getElementById('regDistrict').value;
            
            let users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            
            if (users[u]) return showMsg('हा युजरनेम आधीच अस्तित्वात आहे!', true);
            if (mobile.length !== 10) return showMsg('कृपया १० अंकी मोबाईल नंबर टाका!', true);
            if (p.length < 6) return showMsg('पासवर्ड कमीत कमी ६ अक्षरांचा असावा!', true);

            users[u] = {
                name: name, mobile: mobile, designation: desig, office: office, district: district,
                password: p, role: 'user', status: 'pending', photo: croppedImage
            };

            localStorage.setItem('ow_users', JSON.stringify(users));
            
            document.getElementById('formContainer').classList.add('hidden');
            document.getElementById('successScreen').classList.remove('hidden');
            
            document.getElementById('sucName').textContent = name;
            document.getElementById('sucDesig').textContent = desig;
            document.getElementById('sucOffice').textContent = office;
            document.getElementById('sucDistrict').textContent = district;
            document.getElementById('sucUsername').textContent = u;
            document.getElementById('sucPassword').textContent = p;

            const waMessage = `नमस्कार ॲडमिन,%0A%0Aमाझे रजिस्ट्रेशन झाले आहे. कृपया माझे खाते ॲक्टिव्हेट करावे ही विनंती.%0A%0A*माझी माहिती:*%0A*नाव:* ${name}%0A*पदनाम:* ${desig}%0A*कार्यालय:* ${office}%0A*जिल्हा:* ${district}%0A*युजरनेम:* ${u}%0A*पासवर्ड:* ${p}%0A%0Aधन्यवाद!`;
            
            document.getElementById('btnWaAdmin').href = `https://wa.me/${ADMIN_MOBILE}?text=${waMessage}`;
            document.getElementById('btnCallAdmin').href = `tel:+${ADMIN_MOBILE}`;
        }

        function showForgotScreen() {
            document.getElementById('formContainer').classList.add('hidden');
            document.getElementById('forgotScreen').classList.remove('hidden');
        }

        function backToLogin() {
            document.getElementById('forgotScreen').classList.add('hidden');
            document.getElementById('formContainer').classList.remove('hidden');
        }

        function handleForgotSubmit(e) {
            e.preventDefault();
            const u = document.getElementById('fUsername').value.trim();
            const name = document.getElementById('fName').value.trim();
            const mobile = document.getElementById('fMobile').value.trim();
            const office = document.getElementById('fOffice').value.trim();
            const district = document.getElementById('fDistrict').value;
            const desig = document.getElementById('fDesignation').value.trim();
            
            const users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            const user = users[u];

            if (!user) {
                alert("हा युजरनेम सापडला नाही! कृपया बरोबर युजरनेम टाका.");
                return;
            }

            if (user.name.toLowerCase() !== name.toLowerCase() || user.mobile !== mobile) {
                alert("तुमचे नाव किंवा मोबाईल नंबर जुळत नाही! कृपया बरोबर माहिती भरा.");
                return;
            }

            const resetMsg = `नमस्कार ॲडमिन,%0A%0Aमी माझा पासवर्ड विसरलो आहे. कृपया माझा पासवर्ड रिसेट करून मला कळवावे.%0A%0A*माझी माहिती:*%0A*नाव:* ${name}%0A*पदनाम:* ${desig}%0A*कार्यालय:* ${office}%0A*जिल्हा:* ${district}%0A*युजरनेम:* ${u}%0A*मोबाईल:* ${mobile}%0A%0Aधन्यवाद!`;
            
            window.open(`https://wa.me/${ADMIN_MOBILE}?text=${resetMsg}`, '_blank');
            
            alert("तुमची पासवर्ड रिसेट विनंती ॲडमिनकडे प्रलंबित आहे. ॲडमिनने अप्रूव्ह केल्यानंतर तुम्ही नवीन पासवर्डने लॉगिन करू शकाल.");
            backToLogin();
        }
    </script>
</body>
</html>
