<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Hub - Login & Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body {
            height: 100%; overflow: hidden; background: #020d1b; color: #ffffff;
        }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px;
        }
        .main-wrapper {
            width: 100%; max-width: 380px; display: flex; flex-direction: column; justify-content: center; height: 100%;
        }
        .profile-container { text-align: center; margin-bottom: 8px; }
        .profile-pic {
            width: 70px; height: 70px; border-radius: 50%;
            border: 2px solid #00f3ff; box-shadow: 0 0 15px #00f3ff;
            object-fit: cover; background: #0a192f; margin-bottom: 4px;
        }
        .app-title { font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        .app-title span { color: #00f3ff; }
        .app-subtitle { font-size: 10px; color: #00f3ff; margin-bottom: 8px; }
        
        .login-card {
            width: 100%; background: rgba(2, 6, 23, 0.95);
            border: 1px solid #00f3ff; border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            padding: 12px 15px; position: relative;
        }
        
        .tab-buttons { display: flex; margin-bottom: 10px; border-bottom: 1px solid #1e3a5f; }
        .tab-btn {
            flex: 1; background: none; border: none; color: #888;
            font-size: 13px; font-weight: bold; padding: 6px; cursor: pointer;
        }
        .tab-btn.active { color: #00f3ff; border-bottom: 2px solid #00f3ff; }

        .input-group { position: relative; margin-bottom: 6px; }
        .input-group i.main-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #00f3ff; font-size: 13px; z-index: 2; transition: 0.3s; }
        .input-box {
            width: 100%; background: #0a192f; border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px; padding: 8px 10px 8px 32px; color: #fff; font-size: 13px; outline: none;
            transition: 0.3s;
        }
        .input-box:focus { border-color: #00f3ff; }

        /* 🌟 नवीन बदल: जेव्हा फील्ड भरले जाईल तेव्हा हिरवे होणे */
        .input-box.valid-field {
            border-color: #00ff88 !important;
            background: rgba(0, 255, 136, 0.08) !important;
        }
        .input-group i.main-icon.icon-valid {
            color: #00ff88 !important;
        }
        
        /* Eye Icon */
        .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #00f3ff; font-size: 14px; cursor: pointer; z-index: 2; }

        /* फोटो अपलोड */
        .photo-upload-group { display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
        .photo-label {
            display: flex; align-items: center; gap: 8px;
            background: #0a192f; border: 1px dashed #00f3ff; color: #00f3ff;
            padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; width: 100%; justify-content: center;
            transition: 0.3s;
        }
        .photo-label input { display: none; }
        
        /* 🌟 नवीन बदल: फोटो अपलोड झाल्यावर बॉक्स हिरवा होणे */
        .photo-label.uploaded {
            border-color: #00ff88 !important;
            color: #00ff88 !important;
            background: rgba(0, 255, 136, 0.08) !important;
            border-style: solid !important;
        }

        .btn-submit {
            width: 100%; background: #00f3ff; color: #020d1b; border: none;
            border-radius: 8px; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 4px;
        }
        
        .forgot-link { display: block; text-align: center; margin-top: 8px; font-size: 11.5px; color: #00f3ff; cursor: pointer; text-decoration: none; }
        
        .hidden { display: none !important; }
        .status-msg { font-size: 12px; text-align: center; margin-bottom: 6px; font-weight: bold; }
        .msg-error { color: #ff4d4d; }
        .msg-success { color: #00ff88; }

        /* सक्सेस स्क्रीन */
        #successScreen { text-align: center; }
        .success-icon { font-size: 35px; color: #00ff88; margin-bottom: 8px; }
        .success-details { background: #0a192f; border: 1px solid #00f3ff; border-radius: 8px; padding: 8px; text-align: left; font-size: 12px; margin-bottom: 10px; }
        .success-details p { margin: 2px 0; }
        .success-details strong { color: #00f3ff; }
        .contact-btns { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
        .contact-btn {
            flex: 1; padding: 8px; border-radius: 8px; text-decoration: none; color: #fff;
            font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-call { background: #2196F3; }
        .btn-wa { background: #25D366; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="profile-container">
            <img src="home-bg.jpg" alt="Profile" class="profile-pic" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
            <div class="app-title">SMART TOOLS <span>STRONGER WORK</span></div>
            <div class="app-subtitle">Created by Vitthal Kokate Patil</div>
        </div>

        <div class="login-card" id="formContainer">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('login')">लॉगिन</button>
                <button class="tab-btn" onclick="switchTab('register')">रजिस्ट्रेशन</button>
            </div>

            <div id="statusMessage" class="status-msg hidden"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <i class="fa-solid fa-user main-icon"></i>
                    <input type="text" id="loginUsername" class="input-box" placeholder="Username" required oninput="checkField(this)">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock main-icon"></i>
                    <input type="password" id="loginPassword" class="input-box" placeholder="Password" required oninput="checkField(this)">
                    <i class="fa-solid fa-eye eye-icon" onclick="togglePassword('loginPassword', this)"></i>
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
                <a class="forgot-link" onclick="handleForgotPassword()">Forgot Password?</a>
            </form>

            <!-- REGISTRATION FORM -->
            <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
                
                <!-- 🌟 फोटो अपलोड अपडेटेड -->
                <div class="photo-upload-group">
                    <label class="photo-label" id="photoLabel">
                        <i class="fa-solid fa-cloud-arrow-up" id="photoIcon"></i> 
                        <span id="photoText">फोटो अपलोड करा (कॅमेरा/गॅलरी)</span>
                        <input type="file" id="regPhoto" accept="image/*" capture="user" onchange="previewPhoto(event)" required>
                    </label>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-id-card main-icon"></i>
                    <input type="text" id="regName" class="input-box" placeholder="पूर्ण नाव" required oninput="checkField(this)">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-phone main-icon"></i>
                    <input type="tel" id="regMobile" class="input-box" placeholder="मोबाईल नंबर" required oninput="checkField(this)">
                </div>
                
                <div class="input-group">
                    <i class="fa-solid fa-briefcase main-icon"></i>
                    <input type="text" id="regDesignation" class="input-box" placeholder="पदनाम (उदा. कनिष्ठ अभियंता)" required list="desigList" autocomplete="off" oninput="checkField(this)">
                    <datalist id="desigList">
                        <option value="कनिष्ठ अभियंता">
                        <option value="कार्यकारी अभियंता">
                        <option value="अधिक्षक अभियंता">
                        <option value="मुख्य अभियंता">
                        <option value="कनिष्ठ लिपिक">
                        <option value="वरिष्ठ लिपिक">
                        <option value="सहाय्यक">
                        <option value="अधिकारी">
                        <option value="शिपाई">
                    </datalist>
                </div>
                
                <div class="input-group">
                    <i class="fa-solid fa-building main-icon"></i>
                    <input type="text" id="regOffice" class="input-box" placeholder="कार्यालयाचे नाव" required list="officeList" autocomplete="off" oninput="checkField(this)">
                    <datalist id="officeList">
                        <option value="सार्वजनिक बांधकाम विभाग">
                        <option value="सिंचन विभाग">
                        <option value="जलसंपदा विभाग">
                        <option value="आरोग्य विभाग">
                        <option value="शिक्षण विभाग">
                        <option value="कृषी विभाग">
                        <option value="ग्राम विकास विभाग">
                        <option value="वने विभाग">
                        <option value="परिवहन विभाग">
                    </datalist>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-map-location-dot main-icon"></i>
                    <input type="text" id="regDistrict" class="input-box" placeholder="जिल्हा" required oninput="checkField(this)">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-user-tag main-icon"></i>
                    <input type="text" id="regUsername" class="input-box" placeholder="Username" required oninput="checkField(this)">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-key main-icon"></i>
                    <input type="password" id="regPassword" class="input-box" placeholder="पासवर्ड (कमीत कमी ६ अक्षरे)" required minlength="6" oninput="checkField(this)">
                    <i class="fa-solid fa-eye eye-icon" onclick="togglePassword('regPassword', this)"></i>
                </div>
                
                <button type="submit" class="btn-submit" style="background:#00ff88; color:#000;">रजिस्टर करा</button>
            </form>
        </div>

        <!-- सक्सेस स्क्रीन -->
        <div class="login-card hidden" id="successScreen">
            <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
            <h3 style="color: #00ff88; margin-bottom: 4px; font-size: 15px;">रजिस्ट्रेशन यशस्वी!</h3>
            <p style="font-size: 11px; color: #ccc; margin-bottom: 8px;">तुमचे ॲक्टिव्हेशन ॲडमिनकडे प्रलंबित आहे.</p>
            
            <div class="success-details">
                <p><strong>नाव:</strong> <span id="sucName"></span></p>
                <p><strong>पदनाम:</strong> <span id="sucDesig"></span></p>
                <p><strong>कार्यालय:</strong> <span id="sucOffice"></span></p>
                <p><strong>जिल्हा:</strong> <span id="sucDistrict"></span></p>
                <p><strong>युजरनेम:</strong> <span id="sucUsername" style="color: #00f3ff; font-weight: bold;"></span></p>
                <p><strong>पासवर्ड:</strong> <span id="sucPassword" style="color: #00f3ff; font-weight: bold;"></span></p>
            </div>

            <div class="contact-btns">
                <a href="#" id="btnCallAdmin" class="contact-btn btn-call"><i class="fa-solid fa-phone"></i> कॉल</a>
                <a href="#" id="btnWaAdmin" class="contact-btn btn-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> व्हॉट्सॲप</a>
            </div>
            
            <button onclick="location.reload()" style="margin-top: 12px; background: none; border: none; color: #888; text-decoration: underline; cursor: pointer; font-size: 11px;">लॉगिन पेजवर परत जा</button>
        </div>
    </div>

    <script>
        const ADMIN_MOBILE = "918446556141"; 

        if (!localStorage.getItem('ow_users')) {
            const defaultUsers = {
                'admin': { name: 'Vitthal Kokate Patil', password: 'admin123', role: 'admin', status: 'approved' }
            };
            localStorage.setItem('ow_users', JSON.stringify(defaultUsers));
        }

        function switchTab(tab) {
            document.getElementById('statusMessage').classList.add('hidden');
            if(tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.remove('active');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            } else {
                document.querySelectorAll('.tab-btn')[0].classList.remove('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
            }
        }

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showMsg(msg, isError) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = 'status-msg ' + (isError ? 'msg-error' : 'msg-success');
            el.classList.remove('hidden');
        }

        // 🌟 नवीन बदल: फील्ड भरल्यावर हिरवे होण्यासाठी फंक्शन
        function checkField(inputElement) {
            const parent = inputElement.closest('.input-group');
            const icon = parent.querySelector('.main-icon');
            
            if (inputElement.value.trim() !== '') {
                inputElement.classList.add('valid-field');
                if(icon) icon.classList.add('icon-valid');
            } else {
                inputElement.classList.remove('valid-field');
                if(icon) icon.classList.remove('icon-valid');
            }
        }

        // 🌟 नवीन बदल: फोटो अपलोड झाल्यावर फक्त 'अपलोड झाला' दाखवणे
        function previewPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const label = document.getElementById('photoLabel');
                const text = document.getElementById('photoText');
                const icon = document.getElementById('photoIcon');
                
                // बॉक्स हिरवा करणे
                label.classList.add('uploaded');
                
                // मजकूर बदलणे
                text.textContent = "✅ फोटो यशस्वीरित्या अपलोड झाला (बदलण्यासाठी क्लिक करा)";
                icon.classList.remove('fa-cloud-arrow-up');
                icon.classList.add('fa-check-circle');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            
            const users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            const user = users[u];

            if (!user) return showMsg('चुकीचा युजरनेम!', true);
            if (user.password !== p) return showMsg('चुकीचा पासवर्ड!', true);
            if (user.status !== 'approved') return showMsg('तुमचे खाते ॲडमिनने मंजूर केलेले नाही!', true);

            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', u);
            localStorage.setItem('userRole', user.role);
            localStorage.setItem('displayName', user.name);
            
            window.location.href = 'dashboard.html';
        }

        function handleForgotPassword() {
            const u = prompt("तुमचे युजरनेम टाका:");
            if (!u) return;
            
            const users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            const user = users[u];
            
            if (!user) return alert("हा युजरनेम सापडला नाही!");
            
            const msg = `नमस्कार ॲडमिन,%0A%0Aमी माझा पासवर्ड विसरलो आहे. कृपया माझा पासवर्ड रिसेट करावा.%0A%0A*युजरनेम:* ${u}%0A*नाव:* ${user.name}%0A*मोबाईल:* ${user.mobile || 'नाही'}`;
            window.open(`https://wa.me/${ADMIN_MOBILE}?text=${msg}`, '_blank');
        }

        function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('regUsername').value.trim();
            const p = document.getElementById('regPassword').value.trim();
            const name = document.getElementById('regName').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            const desig = document.getElementById('regDesignation').value.trim();
            const office = document.getElementById('regOffice').value.trim();
            const district = document.getElementById('regDistrict').value.trim();
            
            let users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            if (users[u]) return showMsg('हा युजरनेम आधीच अस्तित्वात आहे!', true);

            users[u] = {
                name: name, mobile: mobile, designation: desig, office: office, district: district,
                password: p, role: 'user', status: 'pending'
            };

            localStorage.setItem('ow_users', JSON.stringify(users));
            
            document.getElementById('formContainer').classList.add('hidden');
            document.getElementById('successScreen').classList.remove('hidden');
            
            document.getElementById('sucName').textContent = name;
            document.getElementById('sucDesig').textContent = desig;
            document.getElementById('sucOffice').textContent = office;
            document.getElementById('sucDistrict').textContent = district;
            document.getElementById('sucUsername').textContent = u;
            document.getElementById('sucPassword').textContent = p;

            const waMessage = `नमस्कार ॲडमिन,%0A%0Aमाझे रजिस्ट्रेशन झाले आहे. कृपया माझे खाते ॲक्टिव्हेट करावे ही विनंती.%0A%0A*माझी माहिती:*%0A*नाव:* ${name}%0A*पदनाम:* ${desig}%0A*कार्यालय:* ${office}%0A*जिल्हा:* ${district}%0A*युजरनेम:* ${u}%0A*पासवर्ड:* ${p}%0A%0Aधन्यवाद!`;
            
            document.getElementById('btnWaAdmin').href = `https://wa.me/${ADMIN_MOBILE}?text=${waMessage}`;
            document.getElementById('btnCallAdmin').href = `tel:+${ADMIN_MOBILE}`;
        }
    </script>
</body>
</html>
