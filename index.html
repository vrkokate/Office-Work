<!-- ==================== २. M.B. नोंद मोडल ==================== -->
<div id="mbModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3 style="font-size: 14px; color:#2e7d32;">📖 मोजमाप पुस्तिका (M.B.) नोंद</h3>
      <button class="btn-close" onclick="closeModule('mbModal')">X</button>
    </div>
    <input type="hidden" id="editMBIndex" value="-1">

    <!-- सुरुवातीला नवीन पर्याय: M.B. मिळाली / दिली -->
    <div class="form-group">
      <label>नोंद प्रकार निवडा *</label>
      <select class="form-control" id="mbActionType" onchange="onMBActionTypeChange()">
        <option value="M.B. मिळाली">M.B. मिळाली</option>
        <option value="M.B. दिली">M.B. दिली</option>
      </select>
    </div>

    <div class="form-group">
      <label>M.B. क्रमांक *</label>
      <input type="text" class="form-control" id="newMBNo" placeholder="उदा. MB-1001">
    </div>

    <div class="form-group">
      <label>M.B. आकार *</label>
      <select class="form-control" id="newMBSize">
        <option value="लहान M.B.">लहान M.B.</option>
        <option value="मोठी M.B.">मोठी M.B.</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lblMBParty">M.B. कोणाकडून मिळाली? *</label>
      <select class="form-control" id="mbReceivedFromSource" onchange="onMBReceivedSourceChange()">
        <option value="">-- निवडा --</option>
        <option value="JE">JE</option>
        <option value="विभागीय कार्यालय">विभागीय कार्यालय</option>
        <option value="चार्ज नुसार">चार्ज नुसार</option>
      </select>
    </div>

    <div class="form-group" id="receivedSubGroup" style="display:none;">
      <label id="receivedSubLabel">तपशील निवडा *</label>
      <select class="form-control" id="receivedSubSelect"></select>
    </div>

    <div class="form-group">
      <label id="lblMBDate">प्राप्त दिनांक *</label>
      <input type="date" class="form-control" id="newMBDate">
    </div>

    <div style="display:flex; gap:6px;">
      <button id="btnSaveMB" class="btn-report" style="background:#2e7d32; flex:1;" onclick="saveOrUpdateMB()">Save Entry</button>
      <button id="btnCancelMB" class="btn-report" style="background:#757575; width:80px; display:none;" onclick="cancelMBEdit()">रद्द करा</button>
    </div>

    <table class="data-table">
      <thead>
        <tr>
          <th>अ.क्र.</th>
          <th>M.B. क्र.</th>
          <th>साईज</th>
          <th>व्यवहार / पार्टी</th>
          <th style="width:25%;">Action</th>
        </tr>
      </thead>
      <tbody id="mbListBody"></tbody>
    </table>
  </div>
</div>
