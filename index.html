<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #051d3b 0%, #020b18 55%, #00050d 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* सर्वात वरची छोटी पट्टी */
    .top-mini-bar {
      text-align: center;
      padding: 6px 0 2px 0;
      font-size: 13px;
      font-weight: 700;
      color: #00e5ff;
      letter-spacing: 0.5px;
    }

    /* मुख्य हेडर */
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
    }
    .hub-header .menu-icon, .hub-header .profile-icon {
      font-size: 22px;
      color: #ffffff;
      cursor: pointer;
      width: 30px;
    }
    .hub-header .profile-icon {
      text-align: right;
    }
    .hub-title-box {
      text-align: center;
    }
    .hub-title-box h1 {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(180deg, #ffffff 40%, #00e5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hub-title-box p {
      font-size: 8px;
      color: #7ce8ff;
      letter-spacing: 1.8px;
      margin-top: 1px;
      font-weight: 600;
    }

    /* ग्लोइंग ५ टॅब बटणे */
    .tabs-wrapper {
      display: flex;
      justify-content: center;
      gap: 7px;
      padding: 8px 10px;
    }
    .tab-card {
      flex: 1;
      max-width: 66px;
      height: 40px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    }
    .tab-card:hover {
      transform: translateY(-2px);
    }

    .btn-est {
      background: linear-gradient(180deg, #0051ff, #002b99);
      border: 1.5px solid #00d2ff;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.75), inset 0 0 6px rgba(0, 210, 255, 0.5);
    }
    /* MB बटण - mb.html उघडण्यासाठी */
    .btn-mb {
      background: linear-gradient(180deg, #00a843, #006626);
      border: 1.5px solid #00ff6a;
      box-shadow: 0 0 12px rgba(0, 255, 106, 0.75), inset 0 0 6px rgba(0, 255, 106, 0.5);
    }
    .btn-form {
      background: linear-gradient(180deg, #ff7b00, #b34700);
      border: 1.5px solid #ffaa00;
      box-shadow: 0 0 12px rgba(255, 170, 0, 0.75), inset 0 0 6px rgba(255, 170, 0, 0.5);
    }
    .btn-tab4 {
      background: linear-gradient(180deg, #7c1fa2, #4a0072);
      border: 1.5px solid #e040fb;
      box-shadow: 0 0 12px rgba(224, 64, 251, 0.75), inset 0 0 6px rgba(224, 64, 251, 0.5);
    }
    .btn-tab5 {
      background: linear-gradient(180deg, #e50914, #8b0000);
      border: 1.5px solid #ff3d57;
      box-shadow: 0 0 12px rgba(255, 61, 87, 0.75), inset 0 0 6px rgba(255, 61, 87, 0.5);
    }

    /* मध्यवर्ती प्रोफाइल विभाग */
    .center-stage {
      position: relative;
      text-align: center;
      padding: 10px 0 5px 0;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .tag-left {
      position: absolute;
      left: 14px;
      top: 18px;
      font-family: 'Brush Script MT', cursive, sans-serif;
      font-size: 15px;
      color: #00e5ff;
      line-height: 1.25;
      text-align: left;
      font-style: italic;
      text-shadow: 0 0 8px rgba(0,229,255,0.4);
    }

    .tag-right {
      position: absolute;
      right: 14px;
      top: 18px;
      border: 1px solid rgba(0, 195, 255, 0.35);
      border-radius: 9px;
      padding: 6px 9px;
      font-family: 'Brush Script MT', cursive, sans-serif;
      font-size: 11.5px;
      color: #8be4ff;
      line-height: 1.25;
      font-style: italic;
      background: rgba(0, 20, 50, 0.4);
    }

    /* पोडियम आणि निळा रिंग ग्लो */
    .stage-circle {
      position: relative;
      width: 290px;
      height: 290px;
      margin: 15px auto 5px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .outer-neon-ring {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 3px solid #00e5ff;
      box-shadow: 0 0 25px #00e5ff, inset 0 0 18px #00e5ff;
    }

    .avatar-photo {
      position: relative;
      z-index: 2;
      width: 195px;
      height: 195px;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid #00e5ff;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
    }

    .stage-base {
      position: absolute;
      bottom: 2px;
      width: 240px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, #002244 0%, #000c1a 70%);
      border: 2px solid #00e5ff;
      box-shadow: 0 0 20px #00e5ff, inset 0 0 10px #00e5ff;
      z-index: 1;
    }

    .stage-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #90caf9;
      text-transform: uppercase;
      margin-top: 10px;
    }

    /* तळाशी नेव्हिगेशन मेनू */
    .bottom-navbar {
      background: #010a14;
      border-top: 1px solid rgba(0, 195, 255, 0.2);
      display: flex;
      justify-content: space-around;
      padding: 7px 0;
    }
    .nav-btn {
      color: #718799;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      gap: 3px;
      cursor: pointer;
    }
    .nav-btn.active {
      color: #00e5ff;
      font-weight: 700;
      text-shadow: 0 0 6px rgba(0,229,255,0.6);
    }
    .nav-btn .icon {
      font-size: 17px;
    }
  </style>
</head>
<body>

  <!-- सर्वात वरची छोटी पट्टी -->
  <div class="top-mini-bar">Digital Hub</div>

  <!-- मुख्य हेडर -->
  <div class="hub-header">
    <div class="menu-icon">☰</div>
    <div class="hub-title-box">
      <h1>Digital Hub</h1>
      <p>ONE PLATFORM | MANY SOLUTIONS</p>
    </div>
    <div class="profile-icon">👤</div>
  </div>

  <!-- ५ रंगीत बटणे -->
  <div class="tabs-wrapper">
    <a href="#" class="tab-card btn-est">Est.</a>
    <!-- येथे mb.html लिंक जोडली आहे -->
    <a href="mb.html" class="tab-card btn-mb">MB</a>
    <a href="#" class="tab-card btn-form">Form</a>
    <a href="#" class="tab-card btn-tab4">Tab-4</a>
    <a href="#" class="tab-card btn-tab5">Tab-5</a>
  </div>

  <!-- मध्यवर्ती प्रोफाईल व डिझाइन -->
  <div class="center-stage">
    <div class="tag-left">Work<br>Today<br>Better<br>Tomorrow</div>
    <div class="tag-right">Ideas<br>Execution<br>Results</div>

    <div class="stage-circle">
      <div class="outer-neon-ring"></div>
      <!-- तुमचा फोटो: रिपॉझिटरीमधील तुमच्या फोटोचे नाव येथे द्या (उदा. profile.jpg किंवा photo.png) -->
      <img src="profile.jpg" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300'" class="avatar-photo" alt="Profile">
      <div class="stage-base"></div>
    </div>

    <div class="stage-label">SMART TOOLS</div>
  </div>

  <!-- तळाचा नेव्हिगेशन बार -->
  <div class="bottom-navbar">
    <div class="nav-btn active">
      <span class="icon">🏠</span>
      <span>मुखपृष्ठ</span>
    </div>
    <div class="nav-btn">
      <span class="icon">🔍</span>
      <span>शोध</span>
    </div>
    <div class="nav-btn">
      <span class="icon">🛍️</span>
      <span>ऑर्डर्स</span>
    </div>
    <div class="nav-btn">
      <span class="icon">🔔</span>
      <span>सूचना</span>
    </div>
    <div class="nav-btn">
      <span class="icon">👤</span>
      <span>प्रोफाईल</span>
    </div>
  </div>

</body>
</html>
