<script id="office-work-custom-dialogs">
(function(){
  if (window.__officeWorkDialogsInstalled) return;
  window.__officeWorkDialogsInstalled = true;
  function ensureDialog(){
    var old=document.getElementById('ow-dialog-overlay'); if(old) return old;
    var style=document.createElement('style'); style.id='ow-dialog-style'; style.textContent=`#ow-dialog-overlay{position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:18px;box-sizing:border-box;font-family:inherit}#ow-dialog-card{width:min(100%,520px);max-height:85vh;overflow:auto;background:#fff;color:#24313b;border-radius:18px;box-shadow:0 18px 55px rgba(0,0,0,.35);padding:22px;box-sizing:border-box}#ow-dialog-head{display:flex;align-items:center;gap:10px;border-bottom:3px solid #174ea6;padding-bottom:12px;margin-bottom:16px;color:#174ea6;font-weight:800;font-size:18px}#ow-dialog-message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:16px;margin:12px 0 20px}#ow-dialog-input{width:100%;box-sizing:border-box;border:1px solid #aeb8c2;border-radius:9px;padding:12px;font-size:16px;margin:0 0 18px;color:#202124;background:#fff}#ow-dialog-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}#ow-dialog-actions button{border:0;border-radius:9px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;min-width:100px}#ow-dialog-cancel{background:#e7edf5;color:#24313b}#ow-dialog-ok{background:#174ea6;color:#fff}#ow-dialog-ok.danger{background:#c62828}@media(max-width:420px){#ow-dialog-card{padding:17px}#ow-dialog-actions button{flex:1}}`;
    (document.head||document.documentElement).appendChild(style);
    var overlay=document.createElement('div'); overlay.id='ow-dialog-overlay'; overlay.innerHTML='<div id="ow-dialog-card" role="dialog" aria-modal="true" aria-labelledby="ow-dialog-title"><div id="ow-dialog-head"><span>📘</span><span id="ow-dialog-title">कार्यालयीन डिजिटल हब</span></div><div id="ow-dialog-message"></div><input id="ow-dialog-input" style="display:none" autocomplete="off"><div id="ow-dialog-actions"><button type="button" id="ow-dialog-cancel">Cancel</button><button type="button" id="ow-dialog-ok">OK</button></div></div>';
    (document.body||document.documentElement).appendChild(overlay); return overlay;
  }
  function openDialog(kind,message,options){options=options||{};return new Promise(function(resolve){var overlay=ensureDialog(),msg=overlay.querySelector('#ow-dialog-message'),input=overlay.querySelector('#ow-dialog-input'),cancel=overlay.querySelector('#ow-dialog-cancel'),ok=overlay.querySelector('#ow-dialog-ok'),title=overlay.querySelector('#ow-dialog-title');title.textContent=options.title||'कार्यालयीन डिजिटल हब';msg.textContent=String(message==null?'':message);input.style.display=kind==='prompt'?'block':'none';input.value=kind==='prompt'?(options.defaultValue||''):'';input.placeholder=options.placeholder||'';cancel.style.display=kind==='alert'?'none':'inline-block';cancel.textContent=options.cancelText||'Cancel';ok.textContent=options.okText||'OK';ok.classList.toggle('danger',!!options.danger);overlay.style.display='flex';var done=false;function finish(value){if(done)return;done=true;overlay.style.display='none';cancel.onclick=null;ok.onclick=null;overlay.onclick=null;document.removeEventListener('keydown',keyHandler);resolve(value)}cancel.onclick=function(){finish(kind==='prompt'?null:false)};ok.onclick=function(){finish(kind==='prompt'?input.value:(kind==='alert'?undefined:true))};overlay.onclick=function(e){if(e.target===overlay&&kind!=='alert')finish(kind==='prompt'?null:false)};function keyHandler(e){if(e.key==='Escape'&&kind!=='alert'){e.preventDefault();finish(kind==='prompt'?null:false)}else if(e.key==='Enter'&&kind==='prompt'){e.preventDefault();finish(input.value)}else if(e.key==='Enter'&&kind==='alert'){e.preventDefault();finish(undefined)}}document.addEventListener('keydown',keyHandler);setTimeout(function(){(kind==='prompt'?input:ok).focus()},0)})}
  window.appAlert=function(message,options){return openDialog('alert',message,options)};window.appConfirm=function(message,options){return openDialog('confirm',message,options)};window.appPrompt=function(message,options){return openDialog('prompt',message,options)};
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.B. वाटप (Assign)</title>
<link rel="stylesheet" href="common.css">
<style>
html,body{height:100%;overflow:hidden}
body{margin:0;display:flex;flex-direction:column;min-height:0}
.top-header,.breadcrumb-bar{flex-shrink:0}
.container{padding:12px;max-width:550px;width:100%;box-sizing:border-box;margin:10px auto 0;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden}
.container .form-group,.container input[type="hidden"],.assign-form-actions{flex-shrink:0}
.assign-form-actions{display:flex;gap:6px;align-items:center;margin:2px 0 6px}
.assign-table-scroll{flex:1 1 0;height:0;min-height:0;max-height:none;overflow:auto;overscroll-behavior:contain;margin-top:6px;border:1px solid #ddd;border-radius:6px;-webkit-overflow-scrolling:touch}
.assign-data-table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}
.assign-data-table thead th{position:sticky;top:0;z-index:2;background:#f5f5f5}
.assign-data-table th,.assign-data-table td{padding:3px 5px!important;line-height:1.15;vertical-align:middle}
.assign-action-buttons{display:flex;gap:3px;align-items:center;justify-content:center;white-space:nowrap}
.assign-action-buttons button{border:0;border-radius:4px;color:#fff;font-size:10px;padding:3px 5px;line-height:1.1;min-height:23px;margin:0;cursor:pointer}
@media(max-width:480px){.container{padding:10px}.assign-data-table{font-size:11px}.assign-data-table th,.assign-data-table td{padding:3px 4px!important}.assign-action-buttons button{font-size:10px;padding:3px 4px;min-height:22px}}
</style>
</head>
<body>
<div class="top-header" style="background:#7b1fa2; color:#fff; padding:12px; position:relative; text-align:center;">
<button class="btn-back-hub" onclick="appGoBack()" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); background:#ff9800; border:none; padding:6px 10px; border-radius:6px; font-weight:bold; cursor:pointer;">◀ मागे</button>
<h1 style="font-size:15px; margin:0;">📁 M.B. वाटप (Assign)</h1>
</div>

<div class="breadcrumb-bar" style="background:rgba(0, 229, 255, 0.1); padding:4px 12px; font-size:11px;">
    <span class="breadcrumb-link" onclick="location.href='index.html'" style="cursor:pointer; text-decoration:underline; color:#0d47a1;">🏠 मुख्य पृष्ठ</span> &gt; <span onclick="location.href='MB.html'" style="cursor:pointer; text-decoration:underline; color:#0d47a1;">M.B. नियंत्रण प्रणाली</span> &gt; <span>Assign</span>
</div>

<div class="container">
<div class="form-group"><label>उपलब्ध M.B. निवडा *</label><select class="form-control" id="assignMBSelect"></select></div>
<div class="form-group"><label>कनिष्ठ अभियंता (JE) निवडा *</label><select class="form-control" id="assignJESelect"></select></div>
<div class="form-group"><label>वाटप दिनांक *</label><input type="date" class="form-control" id="assignDate"></div>
<input type="hidden" id="assignEditIndex" value="-1">
<div class="assign-form-actions"><button id="btnSaveAssign" class="btn-report" style="background:#7b1fa2;margin:0;flex:1;" onclick="saveAssign()">Assign M.B.</button><button id="btnCancelAssignEdit" class="btn-report" style="background:#757575;margin:0;width:92px;display:none;" onclick="cancelAssignEdit()">रद्द करा</button></div>
<div class="assign-table-scroll"><table class="data-table assign-data-table"><thead><tr><th>M.B.</th><th>JE</th><th>वाटप दिनांक</th><th>Action</th></tr></thead><tbody id="assignListBody"></tbody></table></div>
</div>

<script src="common.js"></script>
<script>
window.onload = function() { refreshAssignList(); };
function refreshAssignList(){var list=getData('assign_records'),tbody=document.getElementById('assignListBody');if(!tbody)return;tbody.innerHTML='';list.forEach(function(a,idx){tbody.innerHTML+='<tr><td>'+a.mbNo+'</td><td>'+a.jeName+'</td><td>'+formatDateToDMY(a.assignDate)+'</td><td><div class="assign-action-buttons"><button style="background:#2e7d32" onclick="editAssign('+idx+')">Edit</button><button style="background:#d32f2f" onclick="deleteAssign('+idx+')">Delete</button></div></td></tr>';});var mbSel=document.getElementById('assignMBSelect');if(mbSel){var old=mbSel.value;mbSel.innerHTML='<option value="">-- उपलब्ध M.B. निवडा --</option>';getAvailableStock().forEach(function(m){mbSel.add(new Option(m.mbNumber,m.mbNumber));});if(old)mbSel.value=old;}var jeSel=document.getElementById('assignJESelect');if(jeSel){var jv=jeSel.value;jeSel.innerHTML='<option value="">-- JE निवडा --</option>';getData('je_records').forEach(function(j){jeSel.add(new Option(j.name,j.name));});if(jv)jeSel.value=jv;}}
function saveAssign(){var mb=document.getElementById('assignMBSelect').value,je=document.getElementById('assignJESelect').value,dt=document.getElementById('assignDate').value,e=document.getElementById('assignEditIndex'),editIdx=e?parseInt(e.value,10):-1;if(!mb||!je||!dt)return showAlert('कृपया M.B., JE आणि वाटप दिनांक निवडा.','WARNING');var list=getData('assign_records'),mbList=getData('mb_records');if(editIdx>=0&&list[editIdx]){var old=list[editIdx],same=String(old.mbNo)===String(mb),oldSize='लहान M.B.';if(!same&&!getAvailableStock().some(function(x){return String(x.mbNumber)===String(mb);}))return showAlert('निवडलेली M.B. सध्या उपलब्ध नाही.','WARNING');for(var k=mbList.length-1;k>=0;k--){if(mbList[k].actionType==='दिलेली M.B.'&&String(mbList[k].mbNumber)===String(old.mbNo)&&mbList[k].receivedDetail===old.jeName){oldSize=mbList[k].size||oldSize;mbList.splice(k,1);break;}}var stock=getAvailableStock().find(function(x){return String(x.mbNumber)===String(mb);});mbList.push({actionType:'दिलेली M.B.',mbNumber:mb,size:same?oldSize:(stock?stock.size:'लहान M.B.'),receivedSource:'JE',receivedDetail:je,receivedFrom:'M.B. '+je+' यांना दिली',date:dt});list[editIdx]={mbNo:mb,jeName:je,assignDate:dt};setData('mb_records',mbList);setData('assign_records',list);cancelAssignEdit();refreshAssignList();showAlert('M.B. वाटप नोंद अपडेट झाली.','SUCCESS');return;}var stockList=getAvailableStock(),stockMB=stockList.find(function(x){return String(x.mbNumber)===String(mb);});if(!stockMB)return showAlert('निवडलेली M.B. सध्या उपलब्ध नाही.','WARNING');mbList.push({actionType:'दिलेली M.B.',mbNumber:mb,size:stockMB.size||'लहान M.B.',receivedSource:'JE',receivedDetail:je,receivedFrom:'M.B. '+je+' यांना दिली',date:dt});list.push({mbNo:mb,jeName:je,assignDate:dt});setData('mb_records',mbList);setData('assign_records',list);refreshAssignList();showAlert('M.B. वाटप यशस्वी!','SUCCESS');}
function editAssign(idx){var list=getData('assign_records'),a=list[idx];if(!a)return;var m=document.getElementById('assignMBSelect');if(!Array.from(m.options).some(function(o){return String(o.value)===String(a.mbNo);}))m.add(new Option(a.mbNo+' (सध्या वाटप केलेली)',a.mbNo));m.value=a.mbNo;document.getElementById('assignJESelect').value=a.jeName;document.getElementById('assignDate').value=a.assignDate||'';document.getElementById('assignEditIndex').value=String(idx);document.getElementById('btnSaveAssign').textContent='Update M.B.';document.getElementById('btnCancelAssignEdit').style.display='block';}
function cancelAssignEdit(){document.getElementById('assignEditIndex').value='-1';var m=document.getElementById('assignMBSelect');m.value='';Array.from(m.options).forEach(function(o){if(o.textContent.indexOf('(सध्या वाटप केलेली)')>=0)o.remove();});document.getElementById('assignJESelect').value='';document.getElementById('assignDate').value='';document.getElementById('btnSaveAssign').textContent='Assign M.B.';document.getElementById('btnCancelAssignEdit').style.display='none';}
async function deleteAssign(idx){if(!await window.appConfirm('ही M.B. वाटप नोंद Delete करायची का?'))return;var list=getData('assign_records'),removed=list.splice(idx,1)[0];setData('assign_records',list);var mbList=getData('mb_records');for(var i=mbList.length-1;i>=0;i--){if(mbList[i].actionType==='दिलेली M.B.'&&String(mbList[i].mbNumber)===String(removed.mbNo)&&mbList[i].receivedDetail===removed.jeName){mbList.splice(i,1);break;}}setData('mb_records',mbList);if(parseInt(document.getElementById('assignEditIndex').value,10)===idx)cancelAssignEdit();refreshAssignList();showAlert('वाटप नोंद Delete केली!','SUCCESS');}
</script>
</body>
</html>
