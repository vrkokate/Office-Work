<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#031326">
<title>SMART TOOLS STRONGER WORK | Login</title>
<style>
:root{--cyan:#00eaff;--cyan2:#05c8ef;--navy:#031326;--panel:rgba(2,24,45,.78);--text:#f5fbff;--muted:#a8d6e9}
*{box-sizing:border-box}
html{min-height:100%;background:var(--navy)}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at 50% 38%,#073b59 0,#03182d 42%,#010b18 100%);display:flex;justify-content:center;align-items:center;overflow-x:hidden;position:relative;padding:24px 16px}
body:before,body:after{content:"";position:fixed;left:-15%;width:130%;height:150px;pointer-events:none;opacity:.9;background:repeating-linear-gradient(147deg,transparent 0 26px,rgba(0,220,255,.08) 27px 29px,transparent 30px 46px);filter:drop-shadow(0 0 9px #00dfff)}
body:before{top:-45px;transform:rotate(-8deg)}
body:after{bottom:-72px;transform:rotate(-8deg)}
.glow-line{position:fixed;top:0;left:-15%;width:80%;height:3px;transform:rotate(-42deg);transform-origin:left;background:linear-gradient(90deg,transparent,var(--cyan),#168bff,transparent);box-shadow:0 0 18px 4px #00cfff;opacity:.8}
.page{width:min(100%,700px);position:relative;z-index:1;text-align:center}
.profile-wrap{width:clamp(190px,44vw,320px);height:clamp(190px,44vw,320px);margin:0 auto 34px;border:6px solid var(--cyan);border-radius:50%;padding:8px;background:#000;box-shadow:0 0 16px var(--cyan),0 0 45px rgba(0,234,255,.55),inset 0 0 18px #00dfff;position:relative}
.profile{width:100%;height:100%;object-fit:cover;object-position:center 28%;border-radius:50%;display:block}
.orbit{width:82%;height:48px;border:5px solid var(--cyan);border-radius:50%;margin:-52px auto 30px;position:relative;z-index:-1;box-shadow:0 0 16px #00dfff,0 0 35px rgba(0,234,255,.6)}
.brand{font-size:clamp(19px,4.6vw,38px);font-weight:850;letter-spacing:1.5px;line-height:1.25;margin:0 0 12px;text-shadow:0 0 14px rgba(0,234,255,.18)}
.brand span,.creator{color:var(--cyan)}
.creator{font-size:clamp(17px,3.4vw,26px);font-weight:700;margin:0 0 38px}
.login-card{width:min(100%,700px);margin:auto;padding:36px clamp(22px,7vw,54px) 32px;border:2px solid #4cecff;border-radius:30px;background:linear-gradient(145deg,rgba(4,43,69,.83),rgba(1,14,30,.9));box-shadow:0 0 14px rgba(0,226,255,.9),inset 0 0 25px rgba(0,196,255,.14),0 0 55px rgba(0,174,255,.18)}
h1{font-size:clamp(34px,6vw,52px);letter-spacing:2px;color:var(--cyan);margin:0 0 22px;font-weight:850}
.underline{width:92px;height:4px;background:var(--cyan);margin:0 auto 30px;border-radius:10px;box-shadow:0 0 10px #00dfff}
.field{height:78px;border:1.5px solid #159fc4;border-radius:23px;display:flex;align-items:center;gap:20px;padding:0 22px;margin-bottom:20px;background:rgba(1,19,36,.55);box-shadow:inset 0 0 9px rgba(0,207,255,.05);transition:.2s}
.field:focus-within{border-color:var(--cyan);box-shadow:0 0 13px rgba(0,234,255,.28)}
.field svg{width:32px;height:32px;flex:0 0 32px;stroke:#8ff5ff;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.field input{width:100%;min-width:0;color:white;font-size:clamp(17px,3.6vw,24px);border:0;outline:0;background:transparent}
.field input::placeholder{color:#b6dced;opacity:1}
.password-field{padding-right:14px}
.show-pass{border:0;background:transparent;color:#8ff5ff;cursor:pointer;padding:8px;display:flex;align-items:center}
.show-pass svg{width:25px;height:25px}
.signin{width:100%;height:80px;border:0;border-radius:25px;margin-top:6px;background:linear-gradient(110deg,#06f0e8,#00bce8);color:#00223a;font-size:clamp(22px,4vw,31px);font-weight:800;cursor:pointer;box-shadow:0 0 22px rgba(0,232,255,.42);transition:transform .15s,filter .15s}
.signin:hover{filter:brightness(1.08);transform:translateY(-1px)}
.signin:active{transform:scale(.99)}
.forgot{display:inline-block;color:var(--cyan);font-size:clamp(17px,3.3vw,24px);font-weight:700;text-decoration:none;margin:28px 0 0}
.forgot:hover{text-decoration:underline}
.status{min-height:22px;margin:15px 0 0;color:#ffda8a;font-size:14px; font-weight: bold;}
.contact{display:flex;justify-content:center;align-items:center;gap:16px;margin:26px 0 0;flex-wrap:wrap}
.contact a{width:48px;height:48px;display:grid;place-items:center;border:1.5px solid rgba(0,234,255,.75);border-radius:50%;color:var(--cyan);background:rgba(0,25,44,.85);box-shadow:0 0 13px rgba(0,225,255,.22);transition:.2s}
.contact a:hover{background:var(--cyan);color:#002036;transform:translateY(-3px)}
.contact svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.contact-note{color:#8fb9ce;font-size:12px;margin:12px 0 0}
@media(max-width:480px){body{padding:22px 14px}.profile-wrap{margin-bottom:31px;border-width:5px;padding:6px}.orbit{height:35px;border-width:4px;margin-top:-40px;margin-bottom:24px}.creator{margin-bottom:28px}.login-card{border-radius:24px;padding-top:27px;padding-bottom:24px}.field{height:64px;border-radius:18px;padding:0 15px;gap:13px;margin-bottom:15px}.field svg{width:27px;height:27px;flex-basis:27px}.signin{height:67px;border-radius:20px}.forgot{margin-top:23px}.contact{margin-top:22px}}
</style>
</head>
<body>
<div class="glow-line"></div>
<main class="page">
  <div class="profile-wrap">
      <!-- 🌟 इथे तुमच्या जुन्या फाईलमधून फोटोचा लांब कोड (data:image/...) कॉपी करून पेस्ट करा -->
      <img class="profile" alt="Creator profile" src="YOUR_IMAGE_BASE64_HERE">
  </div>
  
  <div class="orbit"></div>
  <div class="brand">SMART TOOLS <span>STRONGER WORK</span></div>
  <div class="creator">Created by Vitthal Kokate Patil</div>
  
  <div class="login-card">
    <h1>LOGIN</h1>
    <div class="underline"></div>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
      <!-- Username Field -->
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="username" placeholder="Username" required>
      </div>
      
      <!-- Password Field -->
      <div class="field password-field">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="Password" required>
        <button type="button" class="show-pass" onclick="togglePassword()" id="toggleBtn">
          <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      
      <button type="submit" class="signin">Sign In</button>
      <div id="statusMsg" class="status"></div>
    </form>
    
    <a href="#" class="forgot">Forgot Password?</a>
    
    <div class="contact">
      <a href="tel:+918446556141" title="Call"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></a>
      <a href="https://wa.me/918446556141" target="_blank" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></a>
    </div>
    <div class="contact-note">Contact Admin</div>
  </div>
</main>

<script>
  // पासवर्ड दाखवणे / लपवणे (Eye Icon Toggle)
  function togglePassword() {
    const passInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (passInput.type === 'password') {
      passInput.type = 'text';
      eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      passInput.type = 'password';
      eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  // लॉगिन लॉजिक
  function handleLogin(e) {
    e.preventDefault(); // पेज रिफ्रेश होऊ नये म्हणून
    
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const status = document.getElementById('statusMsg');
    
    // 🌟 डेमो युजरनेम आणि पासवर्ड (तुम्ही हे बदलू शकता)
    const validUser = "admin";
    const validPass = "admin123";
    
    if (user === validUser && pass === validPass) {
      status.style.color = "#00ff88";
      status.innerText = "✓ लॉगिन यशस्वी! प्रवेश करत आहे...";
      
      // सिस्टीम मध्ये लॉगिन सेव्ह करणे
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('pf_user', user);
      
      // पुढील पेजवर रिडायरेक्ट करणे (तुमच्या पुढील फाईलचे नाव इथे टाका)
      setTimeout(() => {
        window.location.href = 'pay-fixation-dashboard.html'; 
      }, 1000);
      
    } else {
      status.style.color = "#ff4d4d";
      status.innerText = "✗ चुकीचे युजरनेम किंवा पासवर्ड!";
    }
  }

  // पेज लोड झाल्यावर आपोआप युजरनेम वर कर्सर नेण्यासाठी
  window.onload = function() {
    document.getElementById('username').focus();
  };
</script>
</body>
</html>
