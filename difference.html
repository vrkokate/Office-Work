<!-- ========================================================
     थेट उघडणारा पॉपअप: वेतन व फरक प्रणाली (२ विभाग)
======================================================== -->

<style>
/* मोडल बॅकड्रॉप */
#differenceModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 8, 20, 0.78);
    backdrop-filter: blur(4px);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

/* मुख्य मोडल कार्ड (मोबाईलवर स्क्रीनशॉट १ सारखा योग्य आकार) */
.diff-card-box {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    animation: popupScale 0.22s ease-out;
}

@keyframes popupScale {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* ================= शीर्षलेख (HEADER) ================= */
.diff-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #f1f5f9;
    border-bottom: 2px solid #e2e8f0;
}

/* 🟢 डावीकडे हिरवे Back बटण */
.btn-back-green {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #ffffff;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(16, 185, 129, 0.35);
}
.btn-back-green:active { transform: scale(0.93); }

/* मध्यभागी शीर्षक */
.diff-center-title {
    font-size: 16px;
    font-weight: 900;
    color: #0f172a;
    text-align: center;
    letter-spacing: 0.2px;
}

/* 🔴 उजवीकडे लाल Close बटण */
.btn-close-red {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(239, 68, 68, 0.35);
}
.btn-close-red:active { transform: scale(0.93); }

/* मोडल आतील बॉडी */
.diff-body-content {
    padding: 12px 14px 16px 14px;
}

/* लांब पट्टी हेडिंग (Strip) */
.strip-heading {
    width: 100%;
    padding: 7px 10px;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #38bdf8;
    font-size: 12.5px;
    font-weight: 800;
    border-radius: 7px;
    margin-bottom: 8px;
    border-left: 4px solid #ff9800;
    display: flex;
    align-items: center;
    gap: 6px;
}

/* ================= भाग-१ ग्रिड (४ टॅब: २ x २) ================= */
.part1-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
}

.part1-box-btn {
    padding: 12px 6px;
    border: none;
    border-radius: 9px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    text-decoration: none;
    display: block;
}
.part1-box-btn:active { transform: scale(0.95); }

/* रंग */
.btn-col-4 { background: linear-gradient(135deg, #2e7d32, #1b5e20); } /* ४ था - हिरवा */
.btn-col-5 { background: linear-gradient(135deg, #f57c00, #e65100); } /* ५ वा - नारंगी */
.btn-col-6 { background: linear-gradient(135deg, #7b1fa2, #4a148c); } /* ६ वा - जांभळा */
.btn-col-7 { background: linear-gradient(135deg, #c2185b, #880e4f); } /* ७ वा - गुलाबी/लाल */

/* ================= भाग २ ग्रिड (८ टॅब: वर ४ आणि खाली ४) ================= */
.part2-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* मोबाईलवर तंतोतंत ४ कॉलम्स */
    gap: 5px;
}

.part2-box-btn {
    padding: 9px 2px;
    background: linear-gradient(135deg, #0284c7, #0369a1);
    color: #ffffff;
    border: none;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.2;
    box-shadow: 0 2px 5px rgba(0,0,0,0.12);
}
.part2-box-btn:active { transform: scale(0.94); }

.btn-part2-diff { background: linear-gradient(135deg, #0d9488, #0f766e); }
.btn-part2-set  { background: linear-gradient(135deg, #475569, #334155); }
.btn-part2-etc  { background: linear-gradient(135deg, #64748b, #475569); }
</style>

<!-- प्रत्यक्ष मोडल स्ट्रक्चर -->
<div id="differenceModal">
    <div class="diff-card-box">
        
        <!-- १. शीर्षलेख: 🟢 Back | मध्यभागी शीर्षक | 🔴 Close -->
        <div class="diff-header-bar">
            <button class="btn-back-green" onclick="backToFormSubTabs()">
                <span>⬅</span>
                <span>Back</span>
            </button>

            <div class="diff-center-title">
                वेतन व फरक प्रणाली
            </div>

            <button class="btn-close-red" onclick="closeAllPopups()">
                ✖
            </button>
        </div>

        <!-- २. मोडल मधील घटक -->
        <div class="diff-body-content">
            
            <!-- भाग-१ हेडिंग -->
            <div class="strip-heading">
                <span>📁</span>
                <span>भाग-१ आयोग संबंधित गणना</span>
            </div>

            <!-- भाग-१ (४ टॅब) -->
            <div class="part1-container">
                <button class="part1-box-btn btn-col-4" onclick="location.href='diff_4th_commission.html'">
                    ४ था आयोग फरक
                </button>
                <button class="part1-box-btn btn-col-5" onclick="location.href='diff_5th_commission.html'">
                    ५ वा आयोग फरक
                </button>
                <button class="part1-box-btn btn-col-6" onclick="location.href='diff_6th_commission.html'">
                    ६ वा आयोग फरक
                </button>
                <button class="part1-box-btn btn-col-7" onclick="location.href='diff_7th_commission.html'">
                    ७ वा आयोग फरक
                </button>
            </div>

            <!-- भाग २ हेडिंग -->
            <div class="strip-heading" style="border-left-color: #00e5ff;">
                <span>⚙️</span>
                <span>भाग २ — भत्ते, दर व इतर</span>
            </div>

            <!-- भाग २ (वर ४ आणि खाली ४ = ८ टॅब) -->
            <div class="part2-container">
                <!-- वरचे ४ टॅब -->
                <button class="part2-box-btn" onclick="alert('१. DA दर')">1. DA दर</button>
                <button class="part2-box-btn" onclick="alert('२. HRA दर')">2. HRA दर</button>
                <button class="part2-box-btn" onclick="alert('३. TA / DA')">3. TA / DA</button>
                <button class="part2-box-btn" onclick="alert('४. इतर दर')">4. इतर दर</button>

                <!-- खालचे ४ टॅब -->
                <button class="part2-box-btn btn-part2-diff" onclick="location.href='difference.html'">5. वेतन फरक</button>
                <button class="part2-box-btn" onclick="alert('६. इतर भत्ते')">6. इतर भत्ते</button>
                <button class="part2-box-btn btn-part2-set" onclick="alert('७. सेटिंग्ज')">7. सेटिंग</button>
                <button class="part2-box-btn btn-part2-etc" onclick="alert('८. etc')">8. etc</button>
            </div>

        </div>

    </div>
</div>

<script>
// १. 'Form - उप-टॅब व्यवस्थापन' मधील 'Difference' बटणावर क्लिक केल्यावर हे फंक्शन कॉल करा:
function openDifferenceDirectly() {
    // पहिला Form पॉपअप लपवणे
    const formModal = document.getElementById('formModal') || document.querySelector('.modal');
    if (formModal) formModal.style.display = 'none';

    // थेट हा २ भागांचा पॉपअप उघडणे
    const diffModal = document.getElementById('differenceModal');
    if (diffModal) diffModal.style.display = 'flex';
}

// 🟢 Back बटण: पुन्हा 'Form - उप-टॅब व्यवस्थापन' वर जाणे
function backToFormSubTabs() {
    document.getElementById('differenceModal').style.display = 'none';
    const formModal = document.getElementById('formModal') || document.querySelector('.modal');
    if (formModal) formModal.style.display = 'flex';
}

// 🔴 Close बटण: सर्व काही बंद करणे
function closeAllPopups() {
    document.getElementById('differenceModal').style.display = 'none';
    const formModal = document.getElementById('formModal') || document.querySelector('.modal');
    if (formModal) formModal.style.display = 'none';
}
</script>
