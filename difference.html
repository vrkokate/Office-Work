<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Difference</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 25%, #173b69 0%, #071a32 45%, #020914 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
        }
        .welcome-card {
            background: #0f1c30;
            border: 2px solid #ff9800;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 380px;
        }
        h1 {
            font-size: 32px;
            color: #00e5ff;
            margin: 0 0 20px 0;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .back-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>🙏 वेलकम 🙏</h1>
        <a href="index.html" class="back-btn">⬅ मागे जा</a>
    </div>

</body>
</html>
