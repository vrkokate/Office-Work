<!-- =========================================================
     CSS स्टाईल (हे तुमच्या <style> टॅगमध्ये टाका)
========================================================= -->
<style>
/* पार्श्वभूमी ओव्हरले */
.diff-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(2, 9, 20, 0.75);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 12px;
}

/* मुख्य पॉपअप कार्ड */
.diff-modal-card {
    width: min(520px, 98%);
    background: #ffffff;
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.2);
    animation: zoomModal 0.25s ease-out;
}

@keyframes zoomModal {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
}

.diff-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #e2e8f0;
}

.diff-header-title {
    font-size: clamp(16px, 4.2vw, 20px);
    font-weight: 900;
    color: #0f172a;
    text-align: center;
    flex-grow: 1;
}

/* 🟢 डावीकडचे हिरवे Back बटण */
.btn-back {
    background: #16a34a;
    color: #ffffff;
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(22, 163, 74, 0.35);
    transition: 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
}
.btn-back:active { transform: scale(0.94); }

/* 🔴 उजवीकडचे लाल Close बटण */
.btn-close {
    width: 34px;
    height: 34px;
    background: #dc2626;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(220, 38, 38, 0.35);
    transition: 0.15s;
}
.btn-close:active { transform: scale(0.94); }

/* लांब पट्टी हेडिंग्स (Section Banners) */
.section-banner {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    color: #ffffff;

.sec-1 { background: linear-gradient(135deg, #0284c7, #0369a1); }
.sec-2 { background: linear-gradient(135deg, #d97706, #b45309); margin-top: 14px; }

/* भाग १ - २ बाय २ ची ग्रिड (४ टॅब्स) */

    display: grid;

/* भाग २ - ४ बाय २ ची ग्रिड (वर ४, खाली ४) */

<!-- =========================================================
     JavaScript फंक्शन्स
========================================================= -->
<script>
// बॅक बटण दाबल्यावर मागील मेनू उघडणे
function handleDiffBack() {
    closeDiffModal();
    // जर तुम्हाला पुन्हा आधीचा Form मेनू उघडायचा असेल, तर त्याचे फंक्शन येथे कॉल करा:
    if (typeof openFormModal === "function") {
        openFormModal();
    }
}

// पॉपअप बंद करणे
function closeDiffModal() {
    const modal = document.getElementById('differenceModal');
    if (modal) {
        modal.style.display = 'none';
    }
}

// पॉपअप उघडणे (Difference वर क्लिक झाल्यावर हे कॉल करा)
function openDiffModal() {
    const modal = document.getElementById('differenceModal');
    if (modal) {
        modal.style.display = 'flex';
    }
}

// भाग २ मधील इतर टॅब्ससाठी सूचना/ॲक्शन
function openModule(moduleName) {
    alert(moduleName.toUpperCase() + ' चे पेज लवकरच जोडले जाईल!');
}
</script>
