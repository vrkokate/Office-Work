<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>५ वा वेतन आयोग फरक</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0; padding: 12px;
    font-family: "Noto Sans Devanagari", Arial, sans-serif;
    background: radial-gradient(circle at 50% 25%, #173b69 0%, #071a32 45%, #020914 100%);
    color: white; min-height: 100vh;
}
.box {
    max-width: 900px; margin: 0 auto; background: #0f1c30;
    border-radius: 16px; border: 1px solid #059669; padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}
.top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #059669; padding-bottom: 12px; margin-bottom: 20px; }
.back-btn { background: #059669; color: white; padding: 8px 16px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px; }
.title { font-size: 20px; font-weight: bold; color: #6ee7b7; margin: 0; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 15px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 13px; color: #cbd5e1; }
input, select { background: #091322; border: 1px solid #047857; color: white; padding: 9px; border-radius: 6px; outline: none; }
.calc-btn { background: linear-gradient(135deg, #059669, #0d9488); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
</style>
</head>
<body>
<div class="box">
    <div class="top-bar">
        <a href="difference.html" class="back-btn">⬅ मागे जा</a>
        <h2 class="title">५ वा वेतन आयोग (5th Pay Commission)</h2>
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label>५ व्या आयोगाची वेतनश्रेणी:</label>
            <select>
                <option>२५५० - ५५ - ३२००</option>
                <option>३०५० - ७५ - ३९५०</option>
                <option>४००० - १०० - ६०००</option>
                <option>५००० - १५० - ८०००</option>
                <option>५५०० - १७५ - ९०००</option>
                <option>६५०० - २०० - १०५००</option>
                <option>८००० - २७५ - १३५००</option>
            </select>
        </div>
        <div class="form-group">
            <label>मूळ वेतन (Basic Pay ₹):</label>
            <input type="number" placeholder="उदा. 4500">
        </div>
        <div class="form-group">
            <label>महागाई भत्ता (D.A. %):</label>
            <input type="number" placeholder="उदा. 41">
        </div>
        <div class="form-group">
            <label>HRA दर (% / शहर):</label>
            <select>
                <option>५%</option>
                <option>१०%</option>
                <option>१५%</option>
                <option>३०%</option>
            </select>
        </div>
    </div>
    <button class="calc-btn" onclick="alert('५ व्या आयोगाची गणना लवकरच जोडली जाईल!')">वेतन निश्चित करा</button>
</div>
</body>
</html>
