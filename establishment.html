<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Hub - Establishment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #020d1b; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(2, 6, 23, 0.95); border-bottom: 1px solid #1e3a5f; position: sticky; top: 0; z-index: 100; }
        .back-btn, .home-icon { color: #00ff88; font-size: 18px; cursor: pointer; text-decoration: none; display: flex; align-items: center; transition: 0.3s; }
        .back-btn:hover, .home-icon:hover { color: #fff; }
        
        .main-content { padding: 20px 15px; flex: 1; display: flex; flex-direction: column; align-items: center; }
        
        /* 🌟 मोठ्या आकाराची बटणे (एकाखाली एक) */
        .tabs-container { 
            width: 100%; 
            max-width: 400px; 
            margin-top: 30px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        
        .tab-card { 
            background: #0a192f; 
            border: 2px solid #00f3ff; 
            border-radius: 15px; 
            padding: 30px 20px; 
            text-align: center; 
            text-decoration: none; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: 0.3s; 
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); 
            cursor: pointer; 
        }
        
        .tab-card:hover, .tab-card:active { 
            transform: scale(0.98); 
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5); 
            background: #0d213d; 
        }
        
        .tab-card span { 
            font-size: 22px; 
            font-weight: bold; 
            color: #00f3ff; 
            letter-spacing: 1px; 
        }
        
        /* Pay Fixation साठी केशरी रंग */
        .tab-pay-fix { 
            border-color: #ff9800; 
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.2); 
        }
        
        .tab-pay-fix:hover, .tab-pay-fix:active { 
            box-shadow: 0 0 25px rgba(255, 152, 0, 0.5); 
        }
        
        .tab-pay-fix span { 
            color: #ff9800; 
        }
    </style>
</head>
<body>
    <header class="top-header">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <a href="dashboard.html" class="home-icon"><i class="fa-solid fa-house"></i></a>
    </header>
    
    <div class="main-content">
        <div class="tabs-container">
            
            <!-- MB Register टॅब -->
            <a href="mb-dashboard.html" class="tab-card">
                <span>MB Register</span>
            </a>
            
            <!-- Pay Fixation टॅब (लिंक १००% दुरुस्त) -->
            <a href="pay-fixation.html" class="tab-card tab-pay-fix">
                <span>Pay Fixation</span>
            </a>
            
        </div>
    </div>
    
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>
</body>
</html>
