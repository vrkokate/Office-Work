<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Hub - Establishment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #020d1b; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(2, 6, 23, 0.95); border-bottom: 1px solid #1e3a5f; position: sticky; top: 0; z-index: 100; }
        .back-btn, .home-icon { color: #00ff88; font-size: 18px; cursor: pointer; text-decoration: none; display: flex; align-items: center; transition: 0.3s; }
        .back-btn:hover, .home-icon:hover { color: #fff; }
        
        .main-content { padding: 20px 15px; flex: 1; display: flex; flex-direction: column; align-items: center; }
        
        /* 🌟 ५ बटणांसाठी नवीन स्मार्ट ग्रिड लेआउट */
        .tabs-container { 
            width: 100%; 
            max-width: 100%; 
            margin-top: 30px; 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; /* जास्त बटणे असल्यास स्क्रोल होण्यासाठी */
            padding-bottom: 5px;
        }
        
        .tab-card { 
            background: #0a192f; 
            border: 2px solid #00f3ff; 
            border-radius: 12px; 
            padding: 15px 5px; /* आयकॉन नसल्यामुळे पॅडिंग कमी केले */
            text-align: center; 
            text-decoration: none; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: 0.3s; 
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); 
            cursor: pointer; 
            flex: 1; /* सर्व बटणांना समान जागा मिळावी म्हणून */
            min-width: 80px; /* बटण खूप लहान होऊ नये म्हणून */
        }
        
        .tab-card:hover, .tab-card:active { 
            transform: scale(0.97); 
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); 
            background: #0d213d; 
        }
        
        .tab-card span { 
            font-size: 14px; /* ५ बटणे बसावीत म्हणून फॉन्ट साईज ॲडजस्ट केला */
            font-weight: bold; 
            color: #00f3ff; 
            letter-spacing: 0.5px; 
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <header class="top-header">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <a href="dashboard.html" class="home-icon"><i class="fa-solid fa-house"></i></a>
    </header>
    
    <div class="main-content">
        <div class="tabs-container">
            <!-- 🌟 MB Register टॅब -->
            <a href="mb-dashboard.html" class="tab-card">
                <span>MB<br>Register</span>
            </a>
            
            <!-- 🌟 नवीन Pay Fixation टॅब -->
            <a href="pay-fixation-login-final-1.html" class="tab-card">
                <span>Pay<br>Fixation</span>
            </a>
        </div>
    </div>
    
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>
</body>
</html>
