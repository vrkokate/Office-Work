<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वेतन निश्चिती (Pay Fixation System)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 5px;
        }
        .container {
            max-width: 650px;
            background: #ffffff;
            margin: 10px auto;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .header h2 {
            font-size: 16px;
            color: #2e7d32;
            margin: 0;
        }
        .close-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 4px 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 8px;
        }
        label {
            flex: 1.1;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        select, input {
            flex: 1.4;
            padding: 8px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .submit-btn {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #1b5e20;
        }
        .hidden {
            display: none !important;
        }
        .output-box {
            margin-top: 20px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 6px;
            border: 1px solid #a5d6a7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            background: #fff;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
            font-size: 12px;
        }
        th {
            background-color: #2e7d32;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>💰 वेतन निश्चिती (Pay Fixation)</h2>
        <button class="close-btn" onclick="window.location.href='index.html'">X</button>
    </div>

    <form id="payFixationForm" onsubmit="processFixation(event)">
        <!-- १. कर्मचाऱ्याचे नाव -->
        <div class="form-group">
            <label for="empName">१. कर्मचाऱ्याचे नाव:</label>
            <input type="text" id="empName" placeholder="पूर्ण नाव लिहा" required>
        </div>

        <!-- २. पदनाम -->
        <div class="form-group">
            <label for="empDesignation">२. कर्मचाऱ्याचे पदनाम:</label>
            <input type="text" id="empDesignation" placeholder="उदा. कनिष्ठ लिपिक" required>
        </div>

        <!-- ३. नियुक्ती दिनांक -->
        <div class="form-group">
            <label for="empJoinDate">३. नियुक्ती दिनांक:</label>
            <input type="date" id="empJoinDate" required>
        </div>

        <!-- ४. वेतन आयोग निवडा (नवीन जागेवर) -->
        <div class="form-group">
            <label for="payCommission">४. वेतन आयोग:</label>
            <select id="payCommission" onchange="updateCommissionRules()">
                <option value="4th">४था वेतन आयोग (1986)</option>
                <option value="5th">५वा वेतन आयोग (1996)</option>
                <option value="6th">६वा वेतन आयोग (2006)</option>
                <option value="7th">७वा वेतन आयोग (2016)</option>
            </select>
        </div>

        <!-- ५. सध्याची वेतनश्रेणी -->
        <div class="form-group">
            <label for="currentPayScale">५. सध्याची वेतनश्रेणी:</label>
            <input type="text" id="currentPayScale" placeholder="वेतनश्रेणी लिहा" required>
        </div>

        <!-- आर्थिक लाभ प्रकार -->
        <div class="form-group">
            <label for="benefitType">आर्थिक लाभ प्रकार:</label>
            <select id="benefitType" onchange="toggleBenefitOptions()">
                <option value="None">कोणताही लाभ नाही</option>
                <option value="Promotion">पदोन्नती (Promotion)</option>
                <option value="MACP">आश्वासित प्रगती योजना</option>
            </select>
        </div>

        <!-- MACP टप्पा -->
        <div class="form-group hidden" id="macpBenefitDiv">
            <label for="macpPhase">MACP लाभ टप्पा:</label>
            <select id="macpPhase">
                <option value="1st">पहिला लाभ</option>
                <option value="2nd">दुसरा लाभ</option>
                <option value="3rd">तिसरा लाभ</option>
            </select>
        </div>

        <!-- लाभ दिनांक -->
        <div class="form-group hidden" id="benefitDateDiv">
            <label for="benefitDate">पदो/लाभाचा दिनांक:</label>
            <input type="date" id="benefitDate">
        </div>

        <!-- ६. वेतनश्रेणी सूची -->
        <div class="form-group">
            <label for="scaleDropdown">६. वेतनश्रेणी सूची:</label>
            <select id="scaleDropdown" onchange="fillScaleInput()">
                <option value="">-- सूचीतून निवडा --</option>
            </select>
        </div>
        <div class="form-group">
            <label for="editableScale">वेतनश्रेणी (हस्ते एडिट):</label>
            <input type="text" id="editableScale" required>
        </div>

        <!-- ७. सध्या घेत असलेले मूळ वेतन -->
        <div class="form-group">
            <label for="basicPay">७. मूळ वेतन (Basic):</label>
            <input type="number" id="basicPay" placeholder="उदा. 950" required>
        </div>

        <!-- ८. ग्रेड पे (फक्त ६ व्या आयोगासाठी) -->
        <div class="form-group hidden" id="gradePayGroup">
            <label for="gradePay">८. ग्रेड पे (Grade Pay):</label>
            <input type="number" id="gradePay" placeholder="उदा. 4200">
        </div>

        <!-- ९. वेतन निश्चितीचा कालावधी -->
        <div class="form-group">
            <label for="fixationFrom">९अ. सुरू दिनांक:</label>
            <input type="date" id="fixationFrom" required>
        </div>
        <div class="form-group">
            <label for="fixationTo">९ब. समाप्त दिनांक:</label>
            <input type="date" id="fixationTo" required>
        </div>

        <!-- १०. वेतनवाढ महिना / नियम -->
        <div class="form-group">
            <label for="incrementMonthRule">१०. वेतनवाढ दिनांक:</label>
            <select id="incrementMonthRule">
                <option value="appointment_month">नियुक्ती महिन्याची १ तारीख</option>
                <option value="july">प्रत्येक वर्षाची १ जुलै</option>
                <option value="jan_or_july">जानेवारी किंवा जुलै</option>
            </select>
        </div>

        <!-- ११. वेतनवाढ रोखण्याची स्थिती -->
        <div class="form-group">
            <label for="incrementWithheld">११अ. वेतनवाढ थांबवली?</label>
            <select id="incrementWithheld" onchange="toggleWithheldOptions()">
                <option value="No">नाही</option>
                <option value="Yes">होय</option>
            </select>
        </div>
        <div class="form-group hidden" id="withheldEffectDiv">
            <label for="withheldEffect">११ब. पुढील वाढीवर परिणाम?</label>
            <select id="withheldEffect">
                <option value="cumulative">होय (परिणाम करणारी)</option>
                <option value="non_cumulative">नाही (न करणारी)</option>
            </select>
        </div>

        <!-- १४. विकल्प दिनांक -->
        <div class="form-group hidden" id="optionDateGroup">
            <label for="optionDate">१४. विकल्पाचा दिनांक:</label>
            <input type="date" id="optionDate">
        </div>

        <!-- सबमिट बटन -->
        <button type="submit" class="submit-btn">वेतन निश्चिती करा व तक्ता बनवा</button>
    </form>

    <!-- आऊटपुट तक्ता बॉक्स -->
    <div class="output-box hidden" id="outputBox">
        <h3>📊 वेतन निश्चिती अहवाल व तक्ता</h3>
        <p id="summaryText" style="font-size: 12px; line-height: 1.4;"></p>
        <div style="overflow-x: auto;">
            <table id="fixationTable">
                <thead>
                    <tr id="tableHeaderRow">
                        <th>अ.क्र.</th>
                        <th>वेतनवाढ दिनांक</th>
                        <th>मूळ वेतन</th>
                        <th>एकूण वेतन</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- डायनॅमिक डेटा -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const payScalesData = {
        "4th": ["रु. 950 - 20 - 1150 - EB - 25 - 1400", "रु. 1200 - 30 - 1560 - EB - 40 - 2040"],
        "5th": ["रु. 3050 - 75 - 3950 - 80 - 4590", "रु. 4500 - 125 - 7000", "रु. 6500 - 200 - 10500"],
        "6th": ["PB-1 : 5200 - 20200 (GP 1900)", "PB-1 : 5200 - 20200 (GP 2400)", "PB-2 : 9300 - 34800 (GP 4200)"],
        "7th": ["S-6 (21700 - 69100)", "S-8 (29200 - 92300)", "S-10 (38600 - 122800)"]
    };

    function updateCommissionRules() {
        const commission = document.getElementById('payCommission').value;
        const gradePayGroup = document.getElementById('gradePayGroup');
        const scaleDropdown = document.getElementById('scaleDropdown');
        
        if (commission === '6th') {
            gradePayGroup.classList.remove('hidden');
        } else {
            gradePayGroup.classList.add('hidden');
        }

        scaleDropdown.innerHTML = '<option value="">-- सूचीतून निवडा --</option>';
        if (payScalesData[commission]) {
            payScalesData[commission].forEach(scale => {
                let opt = document.createElement('option');
                opt.value = scale;
                opt.textContent = scale;
                scaleDropdown.appendChild(opt);
            });
        }
    }

    function fillScaleInput() {
        const selectedScale = document.getElementById('scaleDropdown').value;
        if(selectedScale) {
            document.getElementById('editableScale').value = selectedScale;
        }
    }

    function toggleBenefitOptions() {
        const benefit = document.getElementById('benefitType').value;
        const macpDiv = document.getElementById('macpBenefitDiv');
        const benefitDateDiv = document.getElementById('benefitDateDiv');
        const optionDateGroup = document.getElementById('optionDateGroup');

        if (benefit === 'Promotion' || benefit === 'MACP') {
            benefitDateDiv.classList.remove('hidden');
            optionDateGroup.classList.remove('hidden');
            if (benefit === 'MACP') {
                macpDiv.classList.remove('hidden');
            } else {
                macpDiv.classList.add('hidden');
            }
        } else {
            macpDiv.classList.add('hidden');
            benefitDateDiv.classList.add('hidden');
            optionDateGroup.classList.add('hidden');
        }
    }

    function toggleWithheldOptions() {
        const withheld = document.getElementById('incrementWithheld').value;
        const withheldEffectDiv = document.getElementById('withheldEffectDiv');
        if (withheld === 'Yes') {
            withheldEffectDiv.classList.remove('hidden');
        } else {
            withheldEffectDiv.classList.add('hidden');
        }
    }

    window.onload = function() {
        updateCommissionRules();
    };

    function processFixation(event) {
        event.preventDefault();
        
        const name = document.getElementById('empName').value;
        const designation = document.getElementById('empDesignation').value;
        const joinDate = document.getElementById('empJoinDate').value;
        const scale = document.getElementById('editableScale').value;
        const basic = parseFloat(document.getElementById('basicPay').value);
        const commission = document.getElementById('payCommission').value;
        const gradePay = parseFloat(document.getElementById('gradePay').value) || 0;
        const benefit = document.getElementById('benefitType').value;
        const fromDate = document.getElementById('fixationFrom').value;
        const toDate = document.getElementById('fixationTo').value;

        let reasonText = "नियमित वेतनवाढ साखळी";
        if(benefit === 'Promotion') reasonText = "पदोन्नती वेतन निश्चिती";
        else if(benefit === 'MACP') reasonText = "आश्वासित प्रगती योजना लाभ वेतन निश्चिती";

        document.getElementById('summaryText').innerHTML = `
            <b>नाव:</b> ${name} | <b>पद:</b> ${designation}<br>
            <b>नियुक्ती:</b> ${joinDate} | <b>वेतनश्रेणी:</b> ${scale}<br>
            <b>कालावधी:</b> ${fromDate} ते ${toDate} (${reasonText})
        `;

        const headerRow = document.getElementById('tableHeaderRow');
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        let includeGP = (commission === '6th');
        if (includeGP) {
            headerRow.innerHTML = `<th>अ.क्र.</th><th>दिनांक</th><th>मूळ वेतन</th><th>ग्रेड पे</th><th>एकूण</th>`;
        } else {
            headerRow.innerHTML = `<th>अ.क्र.</th><th>दिनांक</th><th>मूळ वेतन</th><th>एकूण वेतन</th>`;
        }

        let simulatedBasic = basic;
        let startYear = new Date(fromDate).getFullYear();
        let endYear = new Date(toDate).getFullYear();
        let srNo = 1;

        for (let year = startYear; year <= endYear; year++) {
            let row = document.createElement('tr');
            let incrementDate = year + "-07-01";
            
            if(year > startYear) {
                simulatedBasic = simulatedBasic + Math.round(simulatedBasic * 0.03);
            }

            let totalPay = simulatedBasic + gradePay;

            if (includeGP) {
                row.innerHTML = `<td>${srNo++}</td><td>${incrementDate}</td><td>${simulatedBasic}</td><td>${gradePay}</td><td><b>${totalPay}</b></td>`;
            } else {
                row.innerHTML = `<td>${srNo++}</td><td>${incrementDate}</td><td>${simulatedBasic}</td><td><b>${totalPay}</b></td>`;
            }
            tableBody.appendChild(row);
        }

        document.getElementById('outputBox').classList.remove('hidden');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
