<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वेतन निश्चिती प्रणाली (Pay Fixation System)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 5px;
        }
        .container {
            max-width: 680px;
            background: #ffffff;
            margin: 10px auto;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .header h2 {
            font-size: 16px;
            color: #2e7d32;
            margin: 0;
        }
        .close-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 4px 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 9px;
            gap: 8px;
        }
        label {
            flex: 1.1;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        select, input {
            flex: 1.4;
            padding: 7px 8px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .date-range-container {
            flex: 1.4;
            display: flex;
            gap: 5px;
        }
        .date-range-container input {
            flex: 1;
            width: 100%;
        }
        .submit-btn {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 11px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #1b5e20;
        }
        .hidden {
            display: none !important;
        }
        .output-box {
            margin-top: 20px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 6px;
            border: 1px solid #a5d6a7;
        }
        .scrollable-report-area {
            max-height: 420px;
            overflow: auto;
            border: 1px solid #c8e6c9;
            background: #ffffff;
            padding: 10px;
            border-radius: 4px;
        }
        .report-details {
            text-align: left;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 12px;
            color: #222;
        }
        .report-details div {
            margin-bottom: 3px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            background: #fff;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: center;
            font-size: 12px;
        }
        th {
            background-color: #2e7d32;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .event-cell {
            text-align: left;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>💰 वेतन निश्चिती (Pay Fixation)</h2>
        <button class="close-btn" onclick="window.location.href='index.html'">X</button>
    </div>

    <form id="payFixationForm" onsubmit="processFixation(event)">
        <!-- १. कर्मचाऱ्याचे नाव -->
        <div class="form-group">
            <label for="empName">१. कर्मचाऱ्याचे नाव:</label>
            <input type="text" id="empName" placeholder="कर्मचाऱ्याचे नाव लिहा" required>
        </div>

        <!-- २. पदनाम -->
        <div class="form-group">
            <label for="empDesignation">२. कर्मचाऱ्याचे पदनाम:</label>
            <input type="text" id="empDesignation" placeholder="उदा. कनिष्ठ लिपिक" required>
        </div>

        <!-- ३. नियुक्ती दिनांक -->
        <div class="form-group">
            <label for="empJoinDate">३. नियुक्ती दिनांक:</label>
            <input type="text" id="empJoinDate" placeholder="दिनांक निवडा" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" required>
        </div>

        <!-- ४. आरंभीचा वेतन आयोग -->
        <div class="form-group">
            <label for="payCommission">४. आरंभीचा वेतन आयोग:</label>
            <select id="payCommission" onchange="updateCommissionRules()">
                <option value="4th">४था वेतन आयोग (1986)</option>
                <option value="5th">५वा वेतन आयोग (1996)</option>
                <option value="6th">६वा वेतन आयोग (2006)</option>
                <option value="7th">७वा वेतन आयोग (2016)</option>
            </select>
        </div>

        <!-- ५. सध्याची वेतनश्रेणी -->
        <div class="form-group">
            <label for="currentPayScale">५. आरंभीची वेतनश्रेणी:</label>
            <input type="text" id="currentPayScale" list="payScaleList" placeholder="सर्च करा किंवा निवडा / लिहा" required>
            <datalist id="payScaleList"></datalist>
        </div>

        <!-- ६. मूळ वेतन -->
        <div class="form-group">
            <label for="basicPay">६. मूळ वेतन (Basic):</label>
            <input type="number" id="basicPay" placeholder="उदा. 950 किंवा 5830" required>
        </div>

        <!-- ७. ग्रेड पे (फक्त ६ व्या आयोगासाठी सुरुवातीस) -->
        <div class="form-group hidden" id="gradePayGroup">
            <label for="gradePay">७. ग्रेड पे (Grade Pay):</label>
            <input type="number" id="gradePay" placeholder="उदा. 1900">
        </div>

        <!-- ८. आर्थिक लाभ प्रकार (पदोन्नती / आश्वासित प्रगती योजना) -->
        <div class="form-group">
            <label for="benefitType">८. आर्थिक लाभ प्रकार:</label>
            <select id="benefitType" onchange="toggleBenefitOptions()">
                <option value="None">कोणताही लाभ नाही (नियमित)</option>
                <option value="Promotion">पदोन्नती (Promotion)</option>
                <option value="MACP">आश्वासित प्रगती योजना (MACP)</option>
            </select>
        </div>

        <!-- MACP टप्पा निवडा -->
        <div class="form-group hidden" id="macpBenefitDiv">
            <label for="macpPhase">MACP लाभ टप्पा:</label>
            <select id="macpPhase">
                <option value="पहिला लाभ (1st MACP)">पहिला लाभ (1st MACP)</option>
                <option value="दुसरा लाभ (2nd MACP)">दुसरा लाभ (2nd MACP)</option>
                <option value="तिसरा लाभ (3rd MACP)">तिसरा लाभ (3rd MACP)</option>
            </select>
        </div>

        <!-- पदोन्नती / लाभाचा दिनांक -->
        <div class="form-group hidden" id="benefitDateDiv">
            <label for="benefitDate">पदोन्नती / लाभाचा दिनांक:</label>
            <input type="text" id="benefitDate" placeholder="लाभाचा दिनांक निवडा" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
        </div>

        <!-- ९. कालावधी दिनांक (पासून आणि पर्यंत) -->
        <div class="form-group">
            <label>९. कालावधी दिनांक:</label>
            <div class="date-range-container">
                <input type="text" id="fixationFrom" placeholder="पासून" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" required>
                <input type="text" id="fixationTo" placeholder="पर्यंत" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" required>
            </div>
        </div>

        <!-- १०. पुढील वेतन आयोग बदल लागू करणे -->
        <div class="form-group">
            <label for="autoCommissionChange">१०. कालावधीत पुढील वेतन आयोग बदलायचे का?</label>
            <select id="autoCommissionChange">
                <option value="Yes">होय (कालावधीनुसार पुढील आयोग लागू करा)</option>
                <option value="No">नाही (फक्त याच आयोगात गणना करा)</option>
            </select>
        </div>

        <!-- ११. वेतनवाढ महिना / नियम -->
        <div class="form-group">
            <label for="incrementMonthRule">११. वेतनवाढ दिनांक नियम:</label>
            <select id="incrementMonthRule">
                <option value="appointment_month">नियुक्ती महिन्याची १ तारीख (४था व ५वा आयोग)</option>
                <option value="july">प्रत्येक वर्षाची १ जुलै (६वा व ७वा आयोग)</option>
                <option value="january">प्रत्येक वर्षाची १ जानेवारी (७वा आयोग)</option>
            </select>
        </div>

        <!-- १२. वेतनवाढ रोखली आहे का? -->
        <div class="form-group">
            <label for="incrementWithheld">१२अ. वेतनवाढ थांबवली का?</label>
            <select id="incrementWithheld" onchange="toggleWithheldOptions()">
                <option value="No">नाही</option>
                <option value="Yes">होय</option>
            </select>
        </div>
        <div class="form-group hidden" id="withheldEffectDiv">
            <label for="withheldEffect">१२ब. पुढील वाढीवर परिणाम?</label>
            <select id="withheldEffect">
                <option value="cumulative">होय (परिणाम करणारी - रोखून)</option>
                <option value="non_cumulative">नाही (परिणाम न करणारी)</option>
            </select>
        </div>

        <!-- १३. विकल्पाचा दिनांक -->
        <div class="form-group hidden" id="optionDateGroup">
            <label for="optionDate">१३. विकल्पाचा दिनांक:</label>
            <input type="text" id="optionDate" placeholder="विकल्प दिनांक निवडा" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
        </div>

        <button type="submit" class="submit-btn">वेतन निश्चिती करा व तक्ता बनवा</button>
    </form>

    <!-- अहवाल व तक्ता बॉक्स -->
    <div class="output-box hidden" id="outputBox">
        <h3 style="margin-top: 0; color: #2e7d32;">📊 वेतन निश्चिती अहवाल व तक्ता</h3>
        <div class="scrollable-report-area">
            <div class="report-details" id="summaryText"></div>
            <div>
                <table id="fixationTable">
                    <thead>
                        <tr>
                            <th>अ.क्र.</th>
                            <th>दिनांक</th>
                            <th>वेतन आयोग</th>
                            <th>तपशील / सेवा घटना</th>
                            <th>मूळ वेतन</th>
                            <th>ग्रेड पे</th>
                            <th>एकूण वेतन</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const payScalesData = {
        "4th": [
            "कनिष्ठ लिपिक - रु. ९५० - २० - ११५० - इ.रो. - २५ - १४००",
            "वरिष्ठ लिपिक - रु. १२०० - ३० - १५६० - इ.रो. - ४० - २०४०",
            "शाखा अभियंता (JE) - रु. १६४० - ६० - २६०० - ७५ - २९००",
            "सहाय्यक अभियंता (AE) - रु. २००० - ६० - २३०० - ७५ - ३२००"
        ],
        "5th": [
            "कनिष्ठ लिपिक - रु. ३०५० - ७५ - ३९५० - ८० - ४५९०",
            "वरिष्ठ लिपिक - रु. ४००० - १०० - ६०००",
            "शाखा अभियंता (JE) - रु. ५००० - १५० - ८०००",
            "सहाय्यक अभियंता (AE) - रु. ६५०० - २०० - १०५००"
        ],
        "6th": [
            "कनिष्ठ लिपिक - PB-1 : 5200 - 20200 (GP 1900)",
            "वरिष्ठ लिपिक - PB-1 : 5200 - 20200 (GP 2400)",
            "शाखा अभियंता (JE) - PB-2 : 9300 - 34800 (GP 4200)",
            "सहाय्यक अभियंता (AE) - PB-2 : 9300 - 34800 (GP 5400)"
        ],
        "7th": [
            "कनिष्ठ लिपिक - S-6 (21700 - 69100)",
            "वरिष्ठ लिपिक - S-8 (29200 - 92300)",
            "शाखा अभियंता (JE) - S-13 (35400 - 112400)",
            "सहाय्यक अभियंता (AE) - S-15 (41800 - 132300)"
        ]
    };

    function formatDateToDDMMYYYY(dateString) {
        if (!dateString) return '';
        let parts = dateString.split('-');
        if (parts.length === 3) {
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        return dateString;
    }

    function updateCommissionRules() {
        const commission = document.getElementById('payCommission').value;
        const gradePayGroup = document.getElementById('gradePayGroup');
        const payScaleList = document.getElementById('payScaleList');
        
        if (commission === '6th') {
            gradePayGroup.classList.remove('hidden');
        } else {
            gradePayGroup.classList.add('hidden');
        }

        payScaleList.innerHTML = '';
        if (payScalesData[commission]) {
            payScalesData[commission].forEach(scale => {
                let opt = document.createElement('option');
                opt.value = scale;
                payScaleList.appendChild(opt);
            });
        }
    }

    function toggleBenefitOptions() {
        const benefit = document.getElementById('benefitType').value;
        const macpDiv = document.getElementById('macpBenefitDiv');
        const benefitDateDiv = document.getElementById('benefitDateDiv');
        const optionDateGroup = document.getElementById('optionDateGroup');

        if (benefit === 'Promotion' || benefit === 'MACP') {
            benefitDateDiv.classList.remove('hidden');
            optionDateGroup.classList.remove('hidden');
            if (benefit === 'MACP') {
                macpDiv.classList.remove('hidden');
            } else {
                macpDiv.classList.add('hidden');
            }
        } else {
            macpDiv.classList.add('hidden');
            benefitDateDiv.classList.add('hidden');
            optionDateGroup.classList.add('hidden');
        }
    }

    function toggleWithheldOptions() {
        const withheld = document.getElementById('incrementWithheld').value;
        const withheldEffectDiv = document.getElementById('withheldEffectDiv');
        if (withheld === 'Yes') {
            withheldEffectDiv.classList.remove('hidden');
        } else {
            withheldEffectDiv.classList.add('hidden');
        }
    }

    window.onload = function() {
        updateCommissionRules();
    };

    function processFixation(event) {
        event.preventDefault();
        
        const name = document.getElementById('empName').value;
        const designation = document.getElementById('empDesignation').value;
        const joinDateInput = document.getElementById('empJoinDate').value;
        const scale = document.getElementById('currentPayScale').value;
        let basic = parseFloat(document.getElementById('basicPay').value);
        let startCommission = document.getElementById('payCommission').value;
        let gradePay = parseFloat(document.getElementById('gradePay').value) || 0;
        const benefit = document.getElementById('benefitType').value;
        const macpPhase = document.getElementById('macpPhase').value;
        const benefitDateInput = document.getElementById('benefitDate').value;
        const fromDateInput = document.getElementById('fixationFrom').value;
        const toDateInput = document.getElementById('fixationTo').value;
        const autoUpgrade = document.getElementById('autoCommissionChange').value === 'Yes';

        const joinDateFormatted = formatDateToDDMMYYYY(joinDateInput);
        const fromDateFormatted = formatDateToDDMMYYYY(fromDateInput);
        const toDateFormatted = formatDateToDDMMYYYY(toDateInput);

        let benefitLabel = "कोणताही नाही (नियमित)";
        if(benefit === 'Promotion') benefitLabel = "पदोन्नती (दिनांक: " + formatDateToDDMMYYYY(benefitDateInput) + ")";
        else if(benefit === 'MACP') benefitLabel = macpPhase + " (दिनांक: " + formatDateToDDMMYYYY(benefitDateInput) + ")";

        // अहवाल सारांश
        document.getElementById('summaryText').innerHTML = `
            <div><b>कर्मचाऱ्याचे नाव:</b> ${name}</div>
            <div><b>पदनाम:</b> ${designation}</div>
            <div><b>नियुक्ती दिनांक:</b> ${joinDateFormatted}</div>
            <div><b>आरंभीचा वेतन आयोग / वेतनश्रेणी:</b> ${startCommission} आयोग | ${scale}</div>
            <div><b>आर्थिक लाभ तपशील:</b> ${benefitLabel}</div>
            <div><b>वेतन निश्चिती कालावधी:</b> ${fromDateFormatted} ते ${toDateFormatted}</div>
        `;

        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        let srNo = 1;
        let currentCommission = startCommission;
        let currentBasic = basic;
        let currentGP = (currentCommission === '6th') ? gradePay : 0;

        // १. प्रथम नोंद (सुरुवातीची स्थिती)
        addTableRow(srNo++, fromDateFormatted, getCommissionLabel(currentCommission), "मूळ वेतन निश्चिती / रुजू", currentBasic, currentGP);

        // कालावधीतील वर्षांची गणना
        let startDate = new Date(fromDateInput);
        let endDate = new Date(toDateInput);
        let startYear = startDate.getFullYear();
        let endYear = endDate.getFullYear();

        let benefitHandled = false;

        for (let yr = startYear; yr <= endYear; yr++) {
            // अ) ५वा वेतन आयोग सुधारणा (01-01-1996)
            if (autoUpgrade && currentCommission === '4th' && yr === 1996 && new Date("1996-01-01") >= startDate && new Date("1996-01-01") <= endDate) {
                currentCommission = '5th';
                currentBasic = Math.round(currentBasic * 2.3); // ५वा आयोग फिटमेंट अंदाजे
                currentGP = 0;
                addTableRow(srNo++, "01-01-1996", getCommissionLabel(currentCommission), "५वा वेतन आयोग सुधारणा", currentBasic, currentGP);
            }

            // ब) ६वा वेतन आयोग सुधारणा (01-01-2006)
            if (autoUpgrade && (currentCommission === '4th' || currentCommission === '5th') && yr === 2006 && new Date("2006-01-01") >= startDate && new Date("2006-01-01") <= endDate) {
                currentCommission = '6th';
                currentBasic = Math.round((currentBasic * 1.86) / 10) * 10;
                currentGP = gradePay > 0 ? gradePay : 1900;
                addTableRow(srNo++, "01-01-2006", getCommissionLabel(currentCommission), "६वा वेतन आयोग सुधारणा (GP लागू)", currentBasic, currentGP);
            }

            // क) ७वा वेतन आयोग सुधारणा (01-01-2016)
            if (autoUpgrade && (currentCommission === '5th' || currentCommission === '6th') && yr === 2016 && new Date("2016-01-01") >= startDate && new Date("2016-01-01") <= endDate) {
                currentCommission = '7th';
                let totalBefore7th = currentBasic + currentGP;
                currentBasic = Math.round(totalBefore7th * 2.57); // ७वा आयोग फिटमेंट फॅक्टर २.५७
                currentGP = 0; // ७व्या आयोगात ग्रेड पे बंद
                addTableRow(srNo++, "01-01-2016", getCommissionLabel(currentCommission), "७वा वेतन आयोग सुधारणा (2.57 Fitment)", currentBasic, currentGP);
            }

            // ड) पदोन्नती / MACP लाभ घटना तपासणे
            if (!benefitHandled && benefitDateInput) {
                let bDate = new Date(benefitDateInput);
                if (bDate.getFullYear() === yr && bDate >= startDate && bDate <= endDate) {
                    currentBasic = currentBasic + Math.round(currentBasic * 0.03); // पदोन्नती वाढ
                    let desc = (benefit === 'Promotion') ? "पदोन्नती वेतन निश्चिती" : macpPhase + " वेतन निश्चिती";
                    addTableRow(srNo++, formatDateToDDMMYYYY(benefitDateInput), getCommissionLabel(currentCommission), desc, currentBasic, currentGP);
                    benefitHandled = true;
                }
            }

            // इ) वार्षिक नियमित वेतनवाढ (प्रत्येक वर्षी जुलै/नियुक्ती महिना)
            let incMonth = (currentCommission === '6th' || currentCommission === '7th') ? "07" : "07";
            let incDateStr = `${yr}-${incMonth}-01`;
            let incDate = new Date(incDateStr);

            if (incDate > startDate && incDate <= endDate) {
                currentBasic = currentBasic + Math.round(currentBasic * 0.03); // ३% वार्षिक वेतनवाढ
                addTableRow(srNo++, formatDateToDDMMYYYY(incDateStr), getCommissionLabel(currentCommission), "नियमित वार्षिक वेतनवाढ", currentBasic, currentGP);
            }
        }

        document.getElementById('outputBox').classList.remove('hidden');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function addTableRow(sr, dateStr, comm, eventDesc, basic, gp) {
        const tableBody = document.getElementById('tableBody');
        let tr = document.createElement('tr');
        let total = basic + gp;
        let gpDisplay = gp > 0 ? gp : "-";

        tr.innerHTML = `
            <td>${sr}</td>
            <td>${dateStr}</td>
            <td>${comm}</td>
            <td class="event-cell">${eventDesc}</td>
            <td>${basic}</td>
            <td>${gpDisplay}</td>
            <td><b>${total}</b></td>
        `;
        tableBody.appendChild(tr);
    }

    function getCommissionLabel(comm) {
        if(comm === '4th') return "४था आयोग";
        if(comm === '5th') return "५वा आयोग";
        if(comm === '6th') return "६वा आयोग";
        if(comm === '7th') return "७वा आयोग";
        return comm;
    }
</script>

</body>
</html>
