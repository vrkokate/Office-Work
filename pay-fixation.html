<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वेतन निश्चिती प्रणाली (Pay Fixation System)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 5px;
        }
        .container {
            max-width: 680px;
            background: #ffffff;
            margin: 10px auto;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .header h2 {
            font-size: 16px;
            color: #2e7d32;
            margin: 0;
        }
        .close-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 4px 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 9px;
            gap: 8px;
        }
        label {
            flex: 1.1;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        select, input {
            flex: 1.4;
            padding: 7px 8px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .date-range-container {
            flex: 1.4;
            display: flex;
            gap: 5px;
        }
        .date-range-container input {
            flex: 1;
            width: 100%;
        }
        .submit-btn {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 11px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #1b5e20;
        }
        .hidden {
            display: none !important;
        }
        .output-box {
            margin-top: 20px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 6px;
            border: 1px solid #a5d6a7;
        }
        .scrollable-report-area {
            max-height: 440px;
            overflow: auto;
            border: 1px solid #c8e6c9;
            background: #ffffff;
            padding: 10px;
            border-radius: 4px;
        }
        .report-details {
            text-align: left;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 12px;
            color: #222;
        }
        .report-details div {
            margin-bottom: 3px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            background: #fff;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: center;
            font-size: 12px;
        }
        th {
            background-color: #2e7d32;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .event-cell {
            text-align: left;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>💰 वेतन निश्चिती (Pay Fixation)</h2>
        <button class="close-btn" onclick="window.location.href='index.html'">X</button>
    </div>

    <form id="payFixationForm" onsubmit="processFixation(event)">
        <!-- १. नाव -->
        <div class="form-group">
            <label for="empName">१. कर्मचाऱ्याचे नाव:</label>
            <input type="text" id="empName" placeholder="कर्मचाऱ्याचे नाव लिहा" required>
        </div>

        <!-- २. पदनाम -->
        <div class="form-group">
            <label for="empDesignation">२. कर्मचाऱ्याचे पदनाम:</label>
            <input type="text" id="empDesignation" placeholder="उदा. कनिष्ठ लिपिक" required>
        </div>

        <!-- ३. नियुक्ती दिनांक -->
        <div class="form-group">
            <label for="empJoinDate">३. नियुक्ती दिनांक:</label>
            <input type="text" id="empJoinDate" placeholder="दिनांक निवडा" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" required>
        </div>

        <!-- ४. आरंभीचा वेतन आयोग -->
        <div class="form-group">
            <label for="payCommission">४. आरंभीचा वेतन आयोग:</label>
            <select id="payCommission" onchange="updateCommissionRules()">
                <option value="6th" selected>६वा वेतन आयोग (2006)</option>
                <option value="5th">५वा वेतन आयोग (1996)</option>
                <option value="4th">४था वेतन आयोग (1986)</option>
                <option value="7th">७वा वेतन आयोग (2016)</option>
            </select>
        </div>

        <!-- ५. सध्याची वेतनश्रेणी -->
        <div class="form-group">
            <label for="currentPayScale">५. आरंभीची वेतनश्रेणी:</label>
            <input type="text" id="currentPayScale" list="payScaleList" placeholder="सर्च करा किंवा निवडा / लिहा" required>
            <datalist id="payScaleList"></datalist>
        </div>

        <!-- ६. मूळ वेतन -->
        <div class="form-group">
            <label for="basicPay">६. मूळ वेतन (Basic):</label>
            <input type="number" id="basicPay" placeholder="उदा. 5830" required>
        </div>

        <!-- ७. ग्रेड पे -->
        <div class="form-group" id="gradePayGroup">
            <label for="gradePay">७. ग्रेड पे (Grade Pay):</label>
            <input type="number" id="gradePay" placeholder="उदा. 1900">
        </div>

        <!-- ८. ७व्या आयोगातील सुरुवातीचा वेतन स्तर -->
        <div class="form-group" id="initialLevelDiv">
            <label for="initial7thLevel">८. ७व्या आयोगातील मूळ वेतन स्तर:</label>
            <select id="initial7thLevel">
                <option value="S-6" selected>S-6 (19900 - 63200) - कनिष्ठ लिपिक</option>
                <option value="S-8">S-8 (25500 - 81100) - वरिष्ठ लिपिक</option>
                <option value="S-13">S-13 (35400 - 112400) - शाखा अभियंता</option>
            </select>
        </div>

        <!-- ९. आर्थिक लाभ प्रकार -->
        <div class="form-group">
            <label for="benefitType">९. आर्थिक लाभ प्रकार:</label>
            <select id="benefitType" onchange="toggleBenefitOptions()">
                <option value="None">कोणताही लाभ नाही (नियमित)</option>
                <option value="MACP" selected>आश्वासित प्रगती योजना (MACP)</option>
                <option value="Promotion">पदोन्नती (Promotion)</option>
            </select>
        </div>

        <!-- MACP टप्पा -->
        <div class="form-group" id="macpBenefitDiv">
            <label for="macpPhase">MACP लाभ टप्पा:</label>
            <select id="macpPhase">
                <option value="पहिला लाभ (1st MACP)" selected>पहिला लाभ (1st MACP)</option>
                <option value="दुसरा लाभ (2nd MACP)">दुसरा लाभ (2nd MACP)</option>
                <option value="तिसरा लाभ (3rd MACP)">तिसरा लाभ (3rd MACP)</option>
            </select>
        </div>

        <!-- लाभाचा दिनांक -->
        <div class="form-group" id="benefitDateDiv">
            <label for="benefitDate">लाभाचा दिनांक (MACP Date):</label>
            <input type="text" id="benefitDate" placeholder="उदा. 10/07/2025" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
        </div>

        <!-- विकल्पाचा दिनांक -->
        <div class="form-group" id="optionDateGroup">
            <label for="optionDate">विकल्पाचा दिनांक (Option Date):</label>
            <input type="text" id="optionDate" placeholder="उदा. 01/07/2026" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
        </div>

        <!-- वरिष्ठ / पुढील वेतन स्तर (MACP मंजूर पद स्तर) -->
        <div class="form-group" id="promotionalLevelDiv">
            <label for="promotionalLevel">मंजूर वरिष्ठ वेतन स्तर (Promotional Level):</label>
            <select id="promotionalLevel">
                <option value="S-8" selected>S-8 (25500 - 81100) - वरिष्ठ लिपिक</option>
                <option value="S-10">S-10 (29200 - 92300)</option>
                <option value="S-13">S-13 (35400 - 112400)</option>
                <option value="S-15">S-15 (41800 - 132300)</option>
            </select>
        </div>

        <!-- १०. कालावधी दिनांक (पासून आणि पर्यंत) -->
        <div class="form-group">
            <label>१०. कालावधी दिनांक:</label>
            <div class="date-range-container">
                <input type="text" id="fixationFrom" placeholder="पासून" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" required>
                <input type="text" id="fixationTo" placeholder="पर्यंत" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" required>
            </div>
        </div>

        <!-- ११. पुढील वेतन आयोग बदल लागू करणे -->
        <div class="form-group">
            <label for="autoCommissionChange">११. कालावधीत पुढील आयोग बदलायचे का?</label>
            <select id="autoCommissionChange">
                <option value="Yes" selected>होय (कालावधीनुसार ७वा आयोग लागू करा)</option>
                <option value="No">नाही</option>
            </select>
        </div>

        <!-- १२. वेतनवाढ दिनांक नियम -->
        <div class="form-group">
            <label for="incrementMonthRule">१२. वार्षिक वेतनवाढ दिनांक नियम:</label>
            <select id="incrementMonthRule">
                <option value="july" selected>प्रत्येक वर्षाची १ जुलै</option>
                <option value="january">प्रत्येक वर्षाची १ जानेवारी</option>
            </select>
        </div>

        <!-- १३. वेतनवाढ थांबवली का? -->
        <div class="form-group">
            <label for="incrementWithheld">१३. वेतनवाढ थांबवली का?</label>
            <select id="incrementWithheld" onchange="toggleWithheldOptions()">
                <option value="No">नाही</option>
                <option value="Yes">होय</option>
            </select>
        </div>
        <div class="form-group hidden" id="withheldEffectDiv">
            <label for="withheldEffect">पुढील वाढीवर परिणाम?</label>
            <select id="withheldEffect">
                <option value="cumulative">होय (परिणाम करणारी)</option>
                <option value="non_cumulative">नाही (न करणारी)</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">वेतन निश्चिती करा व तक्ता बनवा</button>
    </form>

    <!-- अहवाल व तक्ता बॉक्स -->
    <div class="output-box hidden" id="outputBox">
        <h3 style="margin-top: 0; color: #2e7d32;">📊 वेतन निश्चिती अहवाल व तक्ता</h3>
        <div class="scrollable-report-area">
            <div class="report-details" id="summaryText"></div>
            <div>
                <table id="fixationTable">
                    <thead>
                        <tr>
                            <th>अ.क्र.</th>
                            <th>दिनांक</th>
                            <th>वेतन आयोग</th>
                            <th>वेतन स्तर / श्रेणी</th>
                            <th>तपशील / सेवा घटना</th>
                            <th>मूळ वेतन</th>
                            <th>ग्रेड पे</th>
                            <th>एकूण वेतन</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // महाराष्ट्र शासकीय पे मॅट्रिक्स (7th Pay Commission Cells)
    const payMatrix7th = {
        "S-6": [19900, 20500, 21100, 21700, 22300, 23000, 23700, 24400, 25100, 25900, 26700, 27500, 28300, 29100, 30000, 30900, 31800, 32800, 33800, 34800, 35800, 36900, 38000, 39100, 40300, 41500, 42700, 44000, 45300, 46700, 48100, 49500, 51000, 52500, 54100, 55700, 57400, 59100, 60900, 63200],
        "S-8": [25500, 26300, 27100, 27900, 28700, 29600, 30500, 31400, 32300, 33300, 34300, 35300, 36400, 37500, 38600, 39800, 41000, 42200, 43500, 44800, 46100, 47500, 48900, 50400, 51900, 53500, 55100, 56800, 58500, 60300, 62100, 64000, 65900, 67900, 69900, 72000, 74200, 76400, 78700, 81100],
        "S-10": [29200, 30100, 31000, 31900, 32900, 33900, 34900, 35900, 37000, 38100, 39200, 40400, 41600, 42800, 44100, 45400, 46800, 48200, 49600, 51100, 52600, 54200, 55800, 57500, 59200, 61000, 62800, 64700, 66600, 68600, 70700, 72800, 75000, 77300, 79600, 82000, 84500, 87000, 89600, 92300],
        "S-13": [35400, 36500, 37600, 38700, 39900, 41100, 42300, 43600, 44900, 46200, 47600, 49000, 50500, 52000, 53600, 55200, 56900, 58600, 60400, 62200, 64100, 66000, 68000, 70000, 72100, 74300, 76500, 78800, 81200, 83600, 86100, 88700, 91400, 94100, 96900, 99800, 102800, 105900, 109100, 112400],
        "S-15": [41800, 43100, 44400, 45700, 47100, 48500, 50000, 51500, 53000, 54600, 56200, 57900, 59600, 61400, 63200, 65100, 67100, 69100, 71200, 73300, 75500, 77800, 80100, 82500, 85000, 87600, 90200, 92900, 95700, 98600, 101600, 104600, 107700, 110900, 114200, 117600, 121100, 124700, 128400, 132300]
    };

    const payScalesData = {
        "6th": [
            "कनिष्ठ लिपिक - PB-1 : 5200 - 20200 (GP 1900)",
            "वरिष्ठ लिपिक - PB-1 : 5200 - 20200 (GP 2400)",
            "शाखा अभियंता (JE) - PB-2 : 9300 - 34800 (GP 4200)"
        ],
        "7th": [
            "कनिष्ठ लिपिक - S-6 (19900 - 63200)",
            "वरिष्ठ लिपिक - S-8 (25500 - 81100)",
            "शाखा अभियंता (JE) - S-13 (35400 - 112400)"
        ],
        "5th": ["कनिष्ठ लिपिक - रु. 3050 - 75 - 3950 - 80 - 4590"],
        "4th": ["कनिष्ठ लिपिक - रु. 950 - 20 - 1150 - EB - 25 - 1400"]
    };

    function formatDateToDDMMYYYY(dateString) {
        if (!dateString) return '';
        let parts = dateString.split('-');
        if (parts.length === 3) {
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        return dateString;
    }

    function updateCommissionRules() {
        const commission = document.getElementById('payCommission').value;
        const gradePayGroup = document.getElementById('gradePayGroup');
        const payScaleList = document.getElementById('payScaleList');
        
        if (commission === '6th') {
            gradePayGroup.classList.remove('hidden');
        } else {
            gradePayGroup.classList.add('hidden');
        }

        payScaleList.innerHTML = '';
        if (payScalesData[commission]) {
            payScalesData[commission].forEach(scale => {
                let opt = document.createElement('option');
                opt.value = scale;
                payScaleList.appendChild(opt);
            });
        }
    }

    function toggleBenefitOptions() {
        const benefit = document.getElementById('benefitType').value;
        const macpDiv = document.getElementById('macpBenefitDiv');
        const benefitDateDiv = document.getElementById('benefitDateDiv');
        const optionDateGroup = document.getElementById('optionDateGroup');
        const promotionalLevelDiv = document.getElementById('promotionalLevelDiv');

        if (benefit === 'Promotion' || benefit === 'MACP') {
            benefitDateDiv.classList.remove('hidden');
            optionDateGroup.classList.remove('hidden');
            promotionalLevelDiv.classList.remove('hidden');
            if (benefit === 'MACP') macpDiv.classList.remove('hidden');
            else macpDiv.classList.add('hidden');
        } else {
            macpDiv.classList.add('hidden');
            benefitDateDiv.classList.add('hidden');
            optionDateGroup.classList.add('hidden');
            promotionalLevelDiv.classList.add('hidden');
        }
    }

    function toggleWithheldOptions() {
        const withheld = document.getElementById('incrementWithheld').value;
        const withheldEffectDiv = document.getElementById('withheldEffectDiv');
        if (withheld === 'Yes') withheldEffectDiv.classList.remove('hidden');
        else withheldEffectDiv.classList.add('hidden');
    }

    window.onload = function() {
        updateCommissionRules();
        document.getElementById('currentPayScale').value = "कनिष्ठ लिपिक - PB-1 : 5200 - 20200 (GP 1900)";
        document.getElementById('basicPay').value = 5830;
        document.getElementById('gradePay').value = 1900;
        document.getElementById('fixationFrom').value = "2015-07-10";
        document.getElementById('fixationTo').value = "2026-08-31";
        document.getElementById('benefitDate').value = "2025-07-10";
        document.getElementById('optionDate').value = "2026-07-01";
        toggleBenefitOptions();
    };

    function fitInMatrix(levelKey, rawAmount) {
        const cells = payMatrix7th[levelKey] || payMatrix7th["S-6"];
        for (let i = 0; i < cells.length; i++) {
            if (cells[i] >= rawAmount) {
                return { basic: cells[i], index: i };
            }
        }
        return { basic: cells[cells.length - 1], index: cells.length - 1 };
    }

    function processFixation(event) {
        event.preventDefault();
        
        const name = document.getElementById('empName').value;
        const designation = document.getElementById('empDesignation').value;
        const joinDateInput = document.getElementById('empJoinDate').value;
        const scale = document.getElementById('currentPayScale').value;
        let basic = parseFloat(document.getElementById('basicPay').value);
        let startCommission = document.getElementById('payCommission').value;
        let gradePay = parseFloat(document.getElementById('gradePay').value) || 0;
        const benefit = document.getElementById('benefitType').value;
        const macpPhase = document.getElementById('macpPhase').value;
        const benefitDateInput = document.getElementById('benefitDate').value;
        const optionDateInput = document.getElementById('optionDate').value;
        const fromDateInput = document.getElementById('fixationFrom').value;
        const toDateInput = document.getElementById('fixationTo').value;
        const autoUpgrade = document.getElementById('autoCommissionChange').value === 'Yes';
        
        let initialLevel = document.getElementById('initial7thLevel').value;
        let promoLevel = document.getElementById('promotionalLevel').value;

        const joinDateFormatted = formatDateToDDMMYYYY(joinDateInput);
        const fromDateFormatted = formatDateToDDMMYYYY(fromDateInput);
        const toDateFormatted = formatDateToDDMMYYYY(toDateInput);

        let benefitLabel = "कोणताही नाही";
        if(benefit === 'Promotion') benefitLabel = `पदोन्नती (मंजूर स्तर: ${promoLevel})`;
        else if(benefit === 'MACP') benefitLabel = `${macpPhase} (मंजूर वरिष्ठ वेतन स्तर: ${promoLevel} - वरिष्ठ लिपिक)`;

        document.getElementById('summaryText').innerHTML = `
            <div><b>कर्मचाऱ्याचे नाव:</b> ${name}</div>
            <div><b>पदनाम:</b> ${designation}</div>
            <div><b>नियुक्ती दिनांक:</b> ${joinDateFormatted}</div>
            <div><b>आरंभीचा वेतन आयोग / वेतनश्रेणी:</b> ${startCommission} आयोग | ${scale}</div>
            <div><b>आर्थिक लाभ तपशील:</b> ${benefitLabel}</div>
            <div><b>लाभाचा दिनांक:</b> ${formatDateToDDMMYYYY(benefitDateInput)} | <b>विकल्पाचा दिनांक:</b> ${formatDateToDDMMYYYY(optionDateInput)}</div>
            <div><b>वेतन निश्चिती कालावधी:</b> ${fromDateFormatted} ते ${toDateFormatted}</div>
        `;

        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        let srNo = 1;
        let currentCommission = startCommission;
        let currentBasic = basic;
        let currentGP = (currentCommission === '6th') ? gradePay : 0;
        let currentLevel = initialLevel;
        let currentMatrixIndex = -1;
        let currentScaleLabel = scale.split(' - ')[1] || scale;

        // १. प्रथम नोंद (सुरुवातीची स्थिती)
        addTableRow(srNo++, fromDateFormatted, getCommissionLabel(currentCommission), currentScaleLabel, "मूळ वेतन निश्चिती / रुजू", currentBasic, currentGP);

        let startDate = new Date(fromDateInput);
        let endDate = new Date(toDateInput);
        let startYear = startDate.getFullYear();
        let endYear = endDate.getFullYear();

        let benefitDate = benefitDateInput ? new Date(benefitDateInput) : null;
        let optionDate = optionDateInput ? new Date(optionDateInput) : null;
        let macpFixed = false;
        let benefitGrantedRowAdded = false;

        for (let yr = startYear; yr <= endYear; yr++) {
            
            // १ जानेवारी २०१६ रोजी ७वा वेतन आयोग सुधारणा
            if (autoUpgrade && (currentCommission === '6th' || currentCommission === '5th') && yr === 2016 && new Date("2016-01-01") >= startDate && new Date("2016-01-01") <= endDate) {
                currentCommission = '7th';
                let totalBefore7th = currentBasic + currentGP;
                let rawPay7th = totalBefore7th * 2.57;
                
                let fitmentResult = fitInMatrix(currentLevel, rawPay7th);
                currentBasic = fitmentResult.basic;
                currentMatrixIndex = fitmentResult.index;
                currentGP = 0;
                currentScaleLabel = `${currentLevel} (${payMatrix7th[currentLevel][0]} - ${payMatrix7th[currentLevel][payMatrix7th[currentLevel].length - 1]})`;

                addTableRow(srNo++, "01-01-2016", getCommissionLabel(currentCommission), currentScaleLabel, `७वा वेतन आयोग सुधारणा (${currentLevel} Matrix Fitment)`, currentBasic, currentGP);
            }

            // लाभाच्या दिनांकाची नोंद (Benefit Date) जर विकल्प दिनांक वेगळा असेल
            if (benefitDate && yr === benefitDate.getFullYear() && !benefitGrantedRowAdded && benefitDate >= startDate && benefitDate <= endDate) {
                if (optionDate && optionDate > benefitDate) {
                    addTableRow(srNo++, formatDateToDDMMYYYY(benefitDateInput), getCommissionLabel(currentCommission), currentScaleLabel, `${macpPhase} मंजूर (विकल्प दिनांकापर्यंत ${currentLevel} मध्ये वेतन चालू)`, currentBasic, currentGP);
                    benefitGrantedRowAdded = true;
                }
            }

            // वार्षिक वेतनवाढ / विकल्प फिक्सेशन (१ जुलै)
            let incDateStr = `${yr}-07-01`;
            let incDate = new Date(incDateStr);

            if (incDate >= startDate && incDate <= endDate) {
                // तपासा जर हा दिवस विकल्प दिनांक (Option Date) आहे का?
                let isOptionDay = (optionDate && optionDate.getTime() === incDate.getTime()) || (!optionDate && benefitDate && benefitDate.getFullYear() === yr);

                if (isOptionDay && !macpFixed && (benefit === 'Promotion' || benefit === 'MACP')) {
                    // नियम ११(१) नुसार वेतन निश्चिती:
                    // पायरी १: जुन्या स्तरामध्ये (S-6) नियमित वार्षिक वेतनवाढ
                    currentMatrixIndex++;
                    let afterRegularInc = payMatrix7th[currentLevel][currentMatrixIndex];

                    // पायरी २: जुन्या स्तरामध्ये नियम ११(१) नुसार आणखी १ काल्पनिक वेतनवाढ (Notional Increment)
                    currentMatrixIndex++;
                    let afterNotionalInc = payMatrix7th[currentLevel][currentMatrixIndex];

                    // पायरी ३: वरिष्ठ लिपिक (S-8) पे मॅट्रिक्समध्ये फिक्सेशन (समान किंवा पुढील वरचा सेल)
                    let fitmentInHigher = fitInMatrix(promoLevel, afterNotionalInc);
                    currentLevel = promoLevel; // आता स्तर S-8 झाला
                    currentBasic = fitmentInHigher.basic;
                    currentMatrixIndex = fitmentResult = fitmentInHigher.index;
                    currentScaleLabel = `${currentLevel} (${payMatrix7th[currentLevel][0]} - ${payMatrix7th[currentLevel][payMatrix7th[currentLevel].length - 1]})`;

                    addTableRow(srNo++, formatDateToDDMMYYYY(incDateStr), getCommissionLabel(currentCommission), currentScaleLabel, `नियम ११(१) नुसार वेतन निश्चिती (नियमित वाढ + काल्पनिक वाढ = ${promoLevel} वरिष्ठ लिपिक फिक्सेशन)`, currentBasic, currentGP);
                    macpFixed = true;
                } else {
                    // सामान्य वार्षिक वेतनवाढ
                    if (currentCommission === '7th') {
                        const matrixCells = payMatrix7th[currentLevel] || payMatrix7th["S-6"];
                        if (currentMatrixIndex >= 0 && currentMatrixIndex < matrixCells.length - 1) {
                            currentMatrixIndex++;
                            currentBasic = matrixCells[currentMatrixIndex];
                        } else {
                            currentBasic = Math.round(currentBasic * 1.03);
                        }
                    } else {
                        let inc = Math.round(((currentBasic + currentGP) * 0.03) / 10) * 10;
                        currentBasic += inc;
                    }

                    addTableRow(srNo++, formatDateToDDMMYYYY(incDateStr), getCommissionLabel(currentCommission), currentScaleLabel, "नियमित वार्षिक वेतनवाढ", currentBasic, currentGP);
                }
            }
        }

        document.getElementById('outputBox').classList.remove('hidden');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function addTableRow(sr, dateStr, comm, scaleStr, eventDesc, basic, gp) {
        const tableBody = document.getElementById('tableBody');
        let tr = document.createElement('tr');
        let total = basic + gp;
        let gpDisplay = gp > 0 ? gp : "-";

        tr.innerHTML = `
            <td>${sr}</td>
            <td>${dateStr}</td>
            <td>${comm}</td>
            <td><small><b>${scaleStr}</b></small></td>
            <td class="event-cell">${eventDesc}</td>
            <td>${basic}</td>
            <td>${gpDisplay}</td>
            <td><b>${total}</b></td>
        `;
        tableBody.appendChild(tr);
    }

    function getCommissionLabel(comm) {
        if(comm === '4th') return "४था आयोग";
        if(comm === '5th') return "५वा आयोग";
        if(comm === '6th') return "६वा आयोग";
        if(comm === '7th') return "७वा आयोग";
        return comm;
    }
</script>
