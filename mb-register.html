<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Hub - MB Entry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="common.css">
    <style>
        .top-nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .top-nav-item { background: #0d47a1; color: #fff; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 5px; border-radius: 8px; font-size: 11px; font-weight: bold; gap: 5px; transition: 0.3s; }
        .top-nav-item i { font-size: 18px; }
        .top-nav-item.active { background: #1976d2; box-shadow: 0 2px 8px rgba(25, 118, 210, 0.4); }
        
        .btn-save { margin-top: 15px; }

        input[type="date"].form-control {
            -webkit-appearance: none;
            appearance: none;
            min-height: 42px;
            display: flex;
            align-items: center;
        }
        body { padding-bottom: 0 !important; }
    </style>
</head>
<body>

    <header class="top-header">
        <!-- 🌟 बॅक बटन: mb-dashboard.html -->
        <a href="mb-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="header-title">📖 मोजमाप पुस्तिका (M.B.) नोंद</div>
        <a href="dashboard.html" class="home-icon"><i class="fa-solid fa-house"></i></a>
    </header>

    <div class="main-content">
        <div class="top-nav-grid">
            <a href="mb-je.html" class="top-nav-item">
                <i class="fa-solid fa-user-tie"></i><span>JE</span>
            </a>
            <a href="mb-register.html" class="top-nav-item active">
                <i class="fa-solid fa-book"></i><span>M.B.</span>
            </a>
            <a href="mb-work-list.html" class="top-nav-item">
                <i class="fa-solid fa-hammer"></i><span>Work list</span>
            </a>
            <a href="mb-bill-reg.html" class="top-nav-item">
                <i class="fa-solid fa-file-invoice-dollar"></i><span>Bill reg.</span>
            </a>
        </div>

        <div class="card-box">
            <input type="hidden" id="editIndex" value="-1">

            <div class="form-group">
                <select id="entryType" class="form-control" onchange="handleEntryTypeChange()">
                    <option value="">-- नोंद प्रकार निवडा --</option>
                    <option value="दिली">M.B. दिली</option>
                    <option value="मिळाली">M.B. मिळाली</option>
                </select>
            </div>

            <div class="form-group hidden" id="groupMBSize">
                <select id="mbSize" class="form-control" onchange="handleSizeChange()">
                    <option value="">-- M.B. आकार निवडा --</option>
                    <option value="लहान">लहान M.B.</option>
                    <option value="मोठी">मोठी M.B.</option>
                </select>
            </div>

            <div class="form-group hidden" id="groupMBNo">
                <input type="text" id="mbNumberInput" class="form-control" placeholder="M.B. क्रमांक टाका" oninput="checkDuplicateMB()" autocomplete="off">
                <select id="mbNumberSelect" class="form-control" style="display: none;"></select>
                <div id="mbSmartMsg" class="smart-msg"></div>
            </div>

            <div class="form-group hidden" id="groupGivenTo">
                <select id="givenToType" class="form-control" onchange="handleGivenToChange()">
                    <option value="">-- कुणाला दिली? --</option>
                    <option value="JE">JE (कनिष्ठ अभियंता)</option>
                    <option value="Office">विभागीय कार्यालय</option>
                </select>
            </div>

            <div class="form-group hidden" id="groupGivenJE">
                <select id="givenJE" class="form-control"><option value="">-- JE निवडा --</option></select>
            </div>

            <div class="form-group hidden" id="groupGivenOffice">
                <input type="text" id="givenOffice" class="form-control" placeholder="विभागीय कार्यालयाचे नाव" autocomplete="off">
            </div>

            <div class="form-group hidden" id="groupReceivedType">
                <select id="receivedType" class="form-control" onchange="handleReceivedTypeChange()">
                    <option value="">-- नवीन / चालू निवडा --</option>
                    <option value="नवीन">नवीन</option>
                    <option value="चालू">चालू</option>
                </select>
            </div>

            <div class="form-group hidden" id="groupBhandarpal">
                <input type="text" id="bhandarpalName" class="form-control" placeholder="भांडारपाल यांचे नाव" autocomplete="off">
            </div>

            <div class="form-group hidden" id="groupReceivedFromType">
                <select id="receivedFromType" class="form-control" onchange="handleReceivedFromTypeChange()">
                    <option value="">-- कोणाकडून मिळाली? --</option>
                    <option value="JE">JE (कनिष्ठ अभियंता)</option>
                    <option value="Office">विभागीय कार्यालय</option>
                </select>
            </div>

            <div class="form-group hidden" id="groupReceivedJE">
                <select id="receivedJE" class="form-control"><option value="">-- JE निवडा --</option></select>
            </div>

            <div class="form-group hidden" id="groupReceivedOffice">
                <input type="text" id="receivedOfficeInput" class="form-control" list="previousNamesList" placeholder="कार्यालयाचे नाव" autocomplete="off">
                <datalist id="previousNamesList"></datalist>
            </div>

            <div class="form-group hidden" id="groupDate">
                <input type="date" id="entryDate" class="form-control">
            </div>

            <button class="btn-save hidden" id="saveBtn" onclick="saveEntry()">Save Entry</button>
            <button class="btn-save btn-cancel hidden" id="cancelBtn" onclick="cancelEdit()">रद्द करा</button>

            <div class="table-container" style="margin-top:20px;">
                <table id="mbTable">
                    <thead>
                        <tr>
                            <th style="text-align: center;">अ.क्र.</th>
                            <th>दिनांक</th>
                            <th>M.B. क्र.</th>
                            <th>तपशील</th>
                            <th style="text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="mbTableBody"></tbody>
                </table>
            </div>

            <button class="btn-report" onclick="printReport()">
                <i class="fa-solid fa-print"></i> REPORT / PRINT
            </button>
        </div>
    </div>

    <div id="deleteAlert" class="custom-alert-overlay">
        <div class="custom-alert-box">
            <p>तुम्हाला ही नोंद नक्की डिलीट करायची आहे का?</p>
            <div class="alert-actions">
                <button class="btn-cancel-alert" onclick="closeDeleteAlert()">नाही</button>
                <button class="btn-confirm-alert" id="confirmDeleteBtn">होय</button>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        checkAuth();
        let mbRecords = [];
        let jeRecords = [];
        let deleteTargetIndex = -1;

        function loadData() {
            let jeData = localStorage.getItem('mb_je_records');
            jeRecords = jeData ? JSON.parse(jeData) : [];
            let mbData = localStorage.getItem('mb_records');
            mbRecords = mbData ? JSON.parse(mbData) : [];
            renderTable();
            populateGivenJEList();
            populateReceivedJEList();
            populatePreviousOfficeNames();
        }

        function handleEntryTypeChange() {
            const type = document.getElementById('entryType').value;
            hideAllGroups();
            if (type) document.getElementById('groupMBSize').classList.remove('hidden');
        }

        function handleSizeChange() {
            const size = document.getElementById('mbSize').value;
            const type = document.getElementById('entryType').value;
            if (size) {
                document.getElementById('groupMBNo').classList.remove('hidden');
                if (type === 'दिली') {
                    document.getElementById('groupGivenTo').classList.remove('hidden');
                    document.getElementById('mbNumberInput').style.display = 'none';
                    document.getElementById('mbNumberSelect').style.display = 'block';
                    populateAvailableMBSelect(size);
                } else if (type === 'मिळाली') {
                    document.getElementById('groupReceivedType').classList.remove('hidden');
                    document.getElementById('mbNumberInput').style.display = 'block';
                    document.getElementById('mbNumberSelect').style.display = 'none';
                    document.getElementById('mbNumberInput').value = '';
                    document.getElementById('mbSmartMsg').style.display = 'none';
                }
                document.getElementById('groupDate').classList.remove('hidden');
                document.getElementById('saveBtn').classList.remove('hidden');
            } else {
                hideAllGroups();
            }
        }

        function populateAvailableMBSelect(selectedSize) {
            let uniqueMBs = {};
            mbRecords.forEach(rec => { uniqueMBs[rec.mbNo] = rec; });
            let availableMBs = [];
            for (let mbNo in uniqueMBs) {
                if (uniqueMBs[mbNo].type === 'मिळाली' && uniqueMBs[mbNo].size === selectedSize) {
                    availableMBs.push(mbNo);
                }
            }
            let select = document.getElementById('mbNumberSelect');
            select.innerHTML = availableMBs.length === 0 ? '<option value="">M.B. उपलब्ध नाही</option>' : '<option value="">-- M.B. निवडा --</option>';
            availableMBs.forEach(mb => { select.innerHTML += `<option value="${mb}">${mb}</option>`; });
            
            let editIndex = parseInt(document.getElementById('editIndex').value);
            if (editIndex !== -1) {
                let currentMB = mbRecords[editIndex].mbNo;
                if (!availableMBs.includes(currentMB)) select.innerHTML += `<option value="${currentMB}">${currentMB} (सध्याची)</option>`;
                select.value = currentMB;
            }
        }

        function handleGivenToChange() {
            const givenTo = document.getElementById('givenToType').value;
            document.getElementById('groupGivenJE').classList.add('hidden');
            document.getElementById('groupGivenOffice').classList.add('hidden');
            if (givenTo === 'JE') document.getElementById('groupGivenJE').classList.remove('hidden');
            else if (givenTo === 'Office') document.getElementById('groupGivenOffice').classList.remove('hidden');
        }

        function handleReceivedTypeChange() {
            const recType = document.getElementById('receivedType').value;
            document.getElementById('groupBhandarpal').classList.add('hidden');
            document.getElementById('groupReceivedFromType').classList.add('hidden');
            document.getElementById('groupReceivedJE').classList.add('hidden');
            document.getElementById('groupReceivedOffice').classList.add('hidden');
            if (recType === 'नवीन') document.getElementById('groupBhandarpal').classList.remove('hidden');
            else if (recType === 'चालू') document.getElementById('groupReceivedFromType').classList.remove('hidden');
        }

        function handleReceivedFromTypeChange() {
            const fromType = document.getElementById('receivedFromType').value;
            document.getElementById('groupReceivedJE').classList.add('hidden');
            document.getElementById('groupReceivedOffice').classList.add('hidden');
            if (fromType === 'JE') document.getElementById('groupReceivedJE').classList.remove('hidden');
            else if (fromType === 'Office') document.getElementById('groupReceivedOffice').classList.remove('hidden');
        }

        function hideAllGroups() {
            ['groupMBSize', 'groupMBNo', 'groupGivenTo', 'groupGivenJE', 'groupGivenOffice', 'groupReceivedType', 'groupBhandarpal', 'groupReceivedFromType', 'groupReceivedJE', 'groupReceivedOffice', 'groupDate'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('mbSmartMsg').style.display = 'none';
            document.getElementById('saveBtn').classList.add('hidden');
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        function checkDuplicateMB() {
            const mbNo = document.getElementById('mbNumberInput').value.trim();
            const msgBox = document.getElementById('mbSmartMsg');
            if (!mbNo) { msgBox.style.display = 'none'; return; }
            const isDuplicate = mbRecords.some(record => record.mbNo === mbNo);
            msgBox.style.display = 'block';
            if (isDuplicate) {
                msgBox.className = 'smart-msg msg-error'; msgBox.innerHTML = '🔴 हा M.B. क्र. आधीच नोंदवला आहे!';
            } else {
                msgBox.className = 'smart-msg msg-success'; msgBox.innerHTML = '🟢 M.B. क्र. नोंद करू शकता.';
            }
        }

        function populateGivenJEList() {
            const jeSelect = document.getElementById('givenJE');
            jeSelect.innerHTML = '<option value="">-- JE निवडा --</option>';
            jeRecords.forEach(je => { jeSelect.innerHTML += `<option value="${je.name}">${je.name}</option>`; });
        }

        function populateReceivedJEList() {
            const jeSelect = document.getElementById('receivedJE');
            jeSelect.innerHTML = '<option value="">-- JE निवडा --</option>';
            jeRecords.forEach(je => { jeSelect.innerHTML += `<option value="${je.name}">${je.name}</option>`; });
        }

        function populatePreviousOfficeNames() {
            const dataList = document.getElementById('previousNamesList');
            dataList.innerHTML = '';
            let uniqueOffices = new Set();
            mbRecords.forEach(rec => {
                if (rec.detail && !jeRecords.some(je => je.name === rec.detail) && rec.detail !== 'उपलब्ध') uniqueOffices.add(rec.detail);
            });
            uniqueOffices.forEach(name => { dataList.innerHTML += `<option value="${name}">`; });
        }

        function saveEntry() {
            const type = document.getElementById('entryType').value;
            const size = document.getElementById('mbSize').value;
            const date = document.getElementById('entryDate').value;
            const editIndex = parseInt(document.getElementById('editIndex').value);
            let mbNo = '';
            if (type === 'दिली') {
                mbNo = document.getElementById('mbNumberSelect').value;
                if (!mbNo) { alert('कृपया उपलब्ध M.B. मधून निवडा!'); return; }
            } else {
                mbNo = document.getElementById('mbNumberInput').value.trim();
                if (!mbNo) { alert('कृपया M.B. क्रमांक टाका!'); return; }
                if (editIndex === -1 && mbRecords.some(r => r.mbNo === mbNo)) { alert('हा M.B. क्रमांक आधीच नोंदवला आहे!'); return; }
            }
            if (!date) { alert('कृपया दिनांक निवडा!'); return; }
            let detail = '';
            if (type === 'दिली') {
                const givenTo = document.getElementById('givenToType').value;
                if (givenTo === 'JE') detail = document.getElementById('givenJE').value;
                else detail = document.getElementById('givenOffice').value.trim();
                if (!detail) { alert('कुणाला दिली हे निवडा किंवा टाईप करा!'); return; }
            } else {
                const recType = document.getElementById('receivedType').value;
                if (recType === 'नवीन') {
                    detail = document.getElementById('bhandarpalName').value.trim();
                    if (!detail) { alert('भांडारपाल यांचे नाव टाका!'); return; }
                } else {
                    const fromType = document.getElementById('receivedFromType').value;
                    if (fromType === 'JE') detail = document.getElementById('receivedJE').value;
                    else detail = document.getElementById('receivedOfficeInput').value.trim();
                    if (!detail) { alert('कोणाकडून मिळाली हे निवडा किंवा टाईप करा!'); return; }
                }
            }
            const newRecord = { type: type, size: size, mbNo: mbNo, detail: detail, date: date };
            if (editIndex === -1) mbRecords.push(newRecord);
            else mbRecords[editIndex] = newRecord;
            localStorage.setItem('mb_records', JSON.stringify(mbRecords));
            cancelEdit();
            loadData();
        }

        function renderTable() {
            const tbody = document.getElementById('mbTableBody');
            tbody.innerHTML = '';
            if (mbRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #888;">कोणतीही नोंद उपलब्ध नाही.</td></tr>';
                return;
            }
            let reversedRecords = [...mbRecords].reverse();
            reversedRecords.forEach((rec, index) => {
                let originalIndex = mbRecords.indexOf(rec);
                tbody.innerHTML += `
                    <tr>
                        <td style="text-align: center;">${index + 1}</td>
                        <td>${formatDate(rec.date)}</td>
                        <td><b>${rec.mbNo}</b></td>
                        <td>${rec.type} (${rec.detail})</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" onclick="editEntry(${originalIndex})">Edit</button>
                                <button class="btn-delete" onclick="showDeleteAlert(${originalIndex})">Delete</button>
                            </div>
                        </td>
                    </tr>`;
            });
        }

        function editEntry(index) {
            const rec = mbRecords[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('entryType').value = rec.type;
            handleEntryTypeChange();
            document.getElementById('mbSize').value = rec.size;
            handleSizeChange();

            if (rec.type === 'दिली') {
                document.getElementById('mbNumberSelect').value = rec.mbNo;
                const isJE = jeRecords.some(j => j.name === rec.detail);
                if (isJE) {
                    document.getElementById('givenToType').value = 'JE';
                    handleGivenToChange();
                    document.getElementById('givenJE').value = rec.detail;
                } else {
                    document.getElementById('givenToType').value = 'Office';
                    handleGivenToChange();
                    document.getElementById('givenOffice').value = rec.detail;
                }
            } else {
                document.getElementById('mbNumberInput').value = rec.mbNo;
                checkDuplicateMB();
                document.getElementById('receivedType').value = 'चालू';
                handleReceivedTypeChange();
                const isJE = jeRecords.some(j => j.name === rec.detail);
                if (isJE) {
                    document.getElementById('receivedFromType').value = 'JE';
                    handleReceivedFromTypeChange();
                    document.getElementById('receivedJE').value = rec.detail;
                } else {
                    document.getElementById('receivedFromType').value = 'Office';
                    handleReceivedFromTypeChange();
                    document.getElementById('receivedOfficeInput').value = rec.detail;
                }
            }
            document.getElementById('entryDate').value = rec.date;
            document.getElementById('saveBtn').innerText = 'Update Entry';
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('editIndex').value = '-1';
            document.getElementById('entryType').value = '';
            document.getElementById('mbSize').value = '';
            document.getElementById('mbNumberInput').value = '';
            document.getElementById('mbNumberSelect').innerHTML = '';
            document.getElementById('entryDate').value = '';
            document.getElementById('saveBtn').innerText = 'Save Entry';
            document.getElementById('cancelBtn').classList.add('hidden');
            hideAllGroups();
        }

        function showDeleteAlert(index) {
            deleteTargetIndex = index;
            document.getElementById('deleteAlert').style.display = 'flex';
        }
        function closeDeleteAlert() {
            document.getElementById('deleteAlert').style.display = 'none';
            deleteTargetIndex = -1;
        }
        document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
            if (deleteTargetIndex !== -1) {
                mbRecords.splice(deleteTargetIndex, 1);
                localStorage.setItem('mb_records', JSON.stringify(mbRecords));
                closeDeleteAlert();
                loadData();
            }
        });

        function printReport() {
            if (mbRecords.length === 0) { alert('प्रिंट करण्यासाठी नोंद नाही!'); return; }
            let printWindow = window.open('', '_blank');
            let html = `<html><head><title>MB Report</title><style>body{font-family:Arial;padding:20px;} h2{text-align:center;color:#0d47a1;} table{width:100%;border-collapse:collapse;} th,td{border:1px solid #333;padding:8px;text-align:left;} th{background:#f2f2f2;}</style></head><body><h2>M.B. नोंदवही</h2><table><thead><tr><th>अ.क्र.</th><th>दिनांक</th><th>M.B. क्र.</th><th>तपशील</th></tr></thead><tbody>`;
            mbRecords.forEach((rec, i) => { html += `<tr><td>${i + 1}</td><td>${formatDate(rec.date)}</td><td>${rec.mbNo}</td><td>${rec.type} (${rec.detail})</td></tr>`; });
            html += `</tbody></table></body></html>`;
            printWindow.document.write(html); printWindow.document.close(); printWindow.focus();
            setTimeout(() => { printWindow.print(); printWindow.close(); }, 500);
        }
        window.onload = loadData;
    </script>
</body>
</html>
