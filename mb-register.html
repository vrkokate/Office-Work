<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Hub - MB Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #020d1b; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* फक्त वरचा हेडर (मागील पेजचे नाव नाही) */
        .top-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; background: rgba(2, 6, 23, 0.95); 
            border-bottom: 1px solid #1e3a5f; position: sticky; top: 0; z-index: 100;
        }
        
        .header-left { display: flex; align-items: center; }
        
        /* 🌟 बॅक बटन (फक्त आयकॉन, सर्कल नाही) */
        .back-btn { 
            color: #00f3ff; font-size: 22px; cursor: pointer; 
            text-decoration: none; display: flex; align-items: center;
            transition: 0.3s; 
        }
        .back-btn:hover { color: #fff; }

        /* 🌟 होम आयकॉन (फक्त आयकॉन, सर्कल नाही) */
        .home-icon { 
            color: #00f3ff; font-size: 22px; cursor: pointer; 
            text-decoration: none; display: flex; align-items: center;
            transition: 0.3s;
        }
        .home-icon:hover { color: #fff; }

        /* पूर्णपणे ब्लँक मुख्य भाग */
        .main-content { flex: 1; padding: 15px; background: #020d1b; }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="header-left">
            <!-- फक्त बॅक बटन, मागील पेजचे नाव नाही -->
            <a href="establishment.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        </div>
        
        <a href="dashboard.html" class="home-icon"><i class="fa-solid fa-house"></i></a>
    </header>

    <!-- पूर्णपणे ब्लँक पेज -->
    <div class="main-content">
    </div>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
    </script>
</body>
</html>
