<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Hub - MB Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #020d1b; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        .top-header { display: flex; align-items: center; padding: 15px; background: rgba(2, 6, 23, 0.95); border-bottom: 1px solid #1e3a5f; }
        .back-btn { background: #0a192f; border: 1px solid #00f3ff; color: #00f3ff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; margin-right: 15px; transition: 0.3s; text-decoration: none; }
        .back-btn:hover { background: #00f3ff; color: #000; }
        .header-title { font-size: 16px; font-weight: bold; color: #00f3ff; }
        .main-content { padding: 20px; flex: 1; display: flex; justify-content: center; align-items: center; text-align: center; }
        .placeholder-box { background: #0a192f; border: 2px dashed #00f3ff; border-radius: 15px; padding: 40px 20px; width: 100%; max-width: 400px; }
        .placeholder-box h2 { color: #00f3ff; margin-bottom: 10px; }
        .placeholder-box p { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <header class="top-header">
        <a href="establishment.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="header-title">MB Register</div>
    </header>
    <div class="main-content">
        <div class="placeholder-box">
            <h2>MB Register</h2>
            <p>हे पेज पुढील टप्प्यात तयार केले जाईल.</p>
        </div>
    </div>
</body>
</html>
