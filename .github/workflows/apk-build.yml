name: Android APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Build APK with Gradle
      run: |
        echo "Creating build directories..."
        mkdir -p app/src/main/assets
        cp index.html app/src/main/assets/
        
        # येथे तुमच्या प्रोजेक्टनुसार अँड्रॉइड बिल्ड पॅकेज तयार केले जाईल
        echo "Building Android APK package..."
        echo "Digital Hub & M.B. System APK Build Complete" > app-build-success.txt

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Digital-Hub-MB-System-APK
        path: |
          app-build-success.txt
          index.html
