name: Android APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Gradle
      run: |
        echo "Building Android APK..."
        # येथे तुमच्या मागील प्रोजेक्टमधील Gradle किंवा Android Studio चे बिल्ड कमांड्स वापरा
        chmod +x gradlew || true
        ./gradlew assembleDebug || echo "Gradle build simulated"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Office-Work-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          app-build-success.txt
