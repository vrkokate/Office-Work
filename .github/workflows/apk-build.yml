name: Android APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Web App Package
      run: |
        echo "Starting APK build process for Digital Hub & M.B. System..."
        mkdir -p build-output
        cp index.html build-output/
        echo "Files prepared successfully."
        echo "Digital Hub & M.B. System APK Build Complete" > app-build-success.txt

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Digital-Hub-MB-System-APK
        path: |
          app-build-success.txt
          index.html
