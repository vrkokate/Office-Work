<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Hub - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: #020d1b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 🌟 हेडर डिझाईन */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(2, 6, 23, 0.95);
            border-bottom: 1px solid #1e3a5f;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 🌟 १. वरचा फोटो ३डी फ्लिप (नाण्यासारखा) */
        .user-photo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #00f3ff;
            object-fit: cover;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            animation: flip3D 4s linear infinite; /* ३डी फ्लिप ॲनिमेशन */
            transform-style: preserve-3d;
        }

        @keyframes flip3D {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .user-designation {
            font-size: 11px;
            color: #00f3ff;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ॲडमिन बेल */
        .bell-btn {
            position: relative;
            background: #0a192f;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: 0.3s;
        }
        .bell-btn:hover { background: #00f3ff; color: #000; }
        
        .bell-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            background: #ff4d4d;
            border-radius: 50%;
            border: 1px solid #020d1b;
            display: none;
        }

        .logout-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
        }

        /* 🌟 मुख्य भाग */
        .main-content {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* फक्त एकच टॅब (Establishment) */
        .tabs-grid {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .tab-card {
            background: #0a192f;
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            cursor: pointer;
            width: 100%;
        }

        .tab-card:hover, .tab-card:active {
            transform: scale(0.98);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
        }

        .tab-card i {
            font-size: 40px;
            color: #00ff88;
        }
        
        .tab-card span {
            font-size: 16px;
            font-weight: bold;
            color: #00ff88;
        }

        /* मधला भाग (श्लोक व फोटो) */
        .center-stage {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .shloka {
            font-size: clamp(11px, 3.5vw, 14px);
            font-weight: bold;
            color: #00f3ff;
            line-height: 1.8;
            margin-bottom: 25px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
            padding: 0 10px;
        }
        .shloka-line { display: block; }

        /* 🌟 २. मधला फोटो ॲनिमेशन कंटेनर */
        .main-photo-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            perspective: 1000px; /* ३डी इफेक्टसाठी */
            animation: float 3s ease-in-out infinite; /* हवेत तरंगण्यासाठी */
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* मुख्य फोटो (३डी फ्लिप) */
        .profile-main-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #00f3ff;
            object-fit: cover;
            position: relative;
            z-index: 2;
            /* 3D फिरणे */
            animation: spin3D 6s linear infinite;
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); /* फक्त एक हलका सावली इफेक्ट */
        }

        @keyframes spin3D {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* 🌟 टच केल्यावर वेगाने फिरण्यासाठी */
        .fast-spin {
            animation: spin3D 0.5s linear infinite !important;
        }

        .app-title { font-size: 14px; font-weight: bold; letter-spacing: 1px; margin-bottom: 2px; }
        .app-title span { color: #00f3ff; }
        .app-subtitle { font-size: 10px; color: #888; }

        /* 🌟 ॲडमिन मोडल (प्रलंबित युजर्स) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; display: none;
            justify-content: center; align-items: center; padding: 15px;
        }

        .modal-box {
            background: #0a192f; border: 1px solid #00f3ff; border-radius: 15px;
            width: 100%; max-width: 400px; max-height: 85vh;
            display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; border-bottom: 1px solid #1e3a5f;
        }

        .modal-header h3 { font-size: 15px; color: #00f3ff; margin: 0; }
        
        .close-btn {
            background: #ff4d4d; color: #fff; border: none;
            width: 26px; height: 26px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        .modal-body { padding: 15px; overflow-y: auto; flex: 1; }

        /* युजर कार्ड (एका खाली एक) */
        .pending-user-card {
            background: #020d1b; border: 1px solid #1e3a5f; border-radius: 10px;
            padding: 12px; margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 10px;
            transition: 0.4s;
        }

        .pending-user-card.processed {
            opacity: 0.5;
            background: #111;
            border-color: #333;
        }

        .p-user-top { display: flex; align-items: flex-start; gap: 12px; }

        .p-user-top img {
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00f3ff; object-fit: cover;
            cursor: pointer;
        }

        .p-user-info { 
            font-size: 12.5px; 
            line-height: 1.6; 
            flex: 1; 
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .p-user-info strong { color: #fff; font-size: 15px; margin-bottom: 2px; }
        .p-user-info span { color: #ccc; display: block; }
        .p-user-info span b { color: #888; font-weight: normal; }

        .action-btns { display: flex; gap: 8px; width: 100%; margin-top: 5px; }
        
        .btn-approve {
            flex: 1; background: #00ff88; color: #000; border: none;
            padding: 8px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer;
        }
        
        .btn-reject {
            flex: 1; background: #ff4d4d; color: #fff; border: none;
            padding: 8px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer;
        }

        .status-text {
            width: 100%; text-align: center; font-weight: bold; font-size: 13px; padding: 5px;
        }

        .no-pending { text-align: center; color: #888; font-size: 13px; padding: 20px 0; }
        
        /* फुल स्क्रीन फोटो व्यूअर */
        .fullscreen-viewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000; display: none;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .fullscreen-viewer img {
            max-width: 100%; max-height: 80vh; border-radius: 10px; border: 2px solid #00f3ff;
        }
        .viewer-actions { margin-top: 20px; display: flex; gap: 15px; }
        .btn-save-img { background: #00ff88; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn-close-viewer { background: #ff4d4d; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }

        /* कस्टम लॉगआउट मोडल */
        .logout-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 3000; display: none;
            justify-content: center; align-items: center; padding: 20px;
        }
        .logout-box {
            background: #0a192f; border: 1px solid #ff4d4d; border-radius: 12px;
            width: 100%; max-width: 320px; padding: 20px; text-align: center;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.3);
        }
        .logout-box h3 { color: #ff4d4d; font-size: 18px; margin-bottom: 10px; }
        .logout-box p { color: #ccc; font-size: 14px; margin-bottom: 20px; }
        .logout-actions { display: flex; gap: 10px; }
        .btn-cancel-logout { flex: 1; background: #555; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-confirm-logout { flex: 1; background: #ff4d4d; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 🌟 हेडर -->
    <header class="top-header">
        <div class="user-info">
            <img id="headerPhoto" src="" alt="User Photo" class="user-photo">
            <div class="user-details">
                <span id="headerName" class="user-name">Name</span>
                <span id="headerDesig" class="user-designation">Designation</span>
            </div>
        </div>
        
        <div class="header-actions">
            <button id="adminBell" class="bell-btn hidden" onclick="openAdminPanel()" title="प्रलंबित युजर्स">
                <i class="fa-solid fa-bell"></i>
                <span id="bellBadge" class="bell-badge"></span>
            </button>
            
            <button class="logout-btn" onclick="showLogoutModal()">Logout</button>
        </div>
    </header>

    <!-- 🌟 मुख्य भाग -->
    <div class="main-content">
        
        <!-- फक्त Establishment टॅब -->
        <div class="tabs-grid">
            <a href="establishment.html" class="tab-card tab-est">
                <i class="fa-solid fa-building-user"></i>
                <span>Establishment</span>
            </a>
        </div>

        <!-- मधला भाग (श्लोक व फोटो) -->
        <div class="center-stage">
            <div class="shloka">
                <span class="shloka-line">विद्या वितर्को विज्ञानं स्मृतिस्तत्परता क्रिया ।</span>
                <span class="shloka-line">यस्यैते षड्गुणास्तस्य नासाध्यमतिवर्तते ॥</span>
            </div>
            
            <!-- मधला फोटो ॲनिमेशन रॅपर (आता मागे काहीही नाही) -->
            <div class="main-photo-wrapper">
                <img id="mainProfilePhoto" src="home-bg.jpg" alt="Profile" class="profile-main-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
            </div>
            
            <div class="app-title">SMART TOOLS <span>STRONGER WORK</span></div>
            <div class="app-subtitle">Created by Vitthal Kokate Patil</div>
        </div>

    </div>

    <!-- 🌟 ॲडमिन पॅनेल मोडल -->
    <div id="adminModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fa-solid fa-bell"></i> User Notifications</h3>
                <button class="close-btn" onclick="closeAdminPanel()">✕</button>
            </div>
            <div class="modal-body" id="pendingUsersList">
                <!-- युजर्सची यादी येथे लोड होईल -->
            </div>
        </div>
    </div>

    <!-- 🌟 फुल स्क्रीन फोटो व्यूअर -->
    <div id="photoViewer" class="fullscreen-viewer">
        <img id="fullSizeImage" src="" alt="Full Size">
        <div class="viewer-actions">
            <button class="btn-close-viewer" onclick="closePhotoViewer()">Close</button>
            <button class="btn-save-img" onclick="downloadPhoto()"><i class="fa-solid fa-download"></i> Save Photo</button>
        </div>
    </div>

    <!-- 🌟 कस्टम लॉगआउट मोडल -->
    <div id="logoutModal" class="logout-modal">
        <div class="logout-box">
            <h3><i class="fa-solid fa-right-from-bracket"></i> Confirm Logout</h3>
            <p>Are you sure you want to log out of your account?</p>
            <div class="logout-actions">
                <button class="btn-cancel-logout" onclick="closeLogoutModal()">Cancel</button>
                <button class="btn-confirm-logout" onclick="executeLogout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        const currentUser = localStorage.getItem('currentUser');
        const userRole = localStorage.getItem('userRole');
        
        let usersData = JSON.parse(localStorage.getItem('ow_users') || '{}');
        let myData = usersData[currentUser];

        const mainPhotoElement = document.getElementById('mainProfilePhoto');

        if (myData) {
            document.getElementById('headerName').textContent = myData.name;
            document.getElementById('headerDesig').textContent = myData.designation;
            
            const photoSrc = myData.photo || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
            
            document.getElementById('headerPhoto').src = photoSrc;
            mainPhotoElement.src = photoSrc;
        }

        // 🌟 टच केल्यावर मधला फोटो वेगाने फिरण्यासाठी इव्हेंट्स
        mainPhotoElement.addEventListener('touchstart', () => {
            mainPhotoElement.classList.add('fast-spin');
        });
        mainPhotoElement.addEventListener('touchend', () => {
            mainPhotoElement.classList.remove('fast-spin');
        });
        mainPhotoElement.addEventListener('mousedown', () => {
            mainPhotoElement.classList.add('fast-spin');
        });
        mainPhotoElement.addEventListener('mouseup', () => {
            mainPhotoElement.classList.remove('fast-spin');
        });
        mainPhotoElement.addEventListener('mouseleave', () => {
            mainPhotoElement.classList.remove('fast-spin');
        });


        if (userRole === 'admin') {
            document.getElementById('adminBell').classList.remove('hidden');
            checkPendingUsers();
        }

        function checkPendingUsers() {
            let users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            let pendingCount = 0;
            for (let key in users) {
                if (users[key].status === 'pending') {
                    pendingCount++;
                }
            }
            const badge = document.getElementById('bellBadge');
            badge.style.display = pendingCount > 0 ? 'block' : 'none';
        }

        function openAdminPanel() {
            document.getElementById('adminModal').style.display = 'flex';
            loadPendingUsers();
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function loadPendingUsers() {
            const listContainer = document.getElementById('pendingUsersList');
            let users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            let usersHTML = '';
            let hasUsers = false;

            for (let u in users) {
                if (u === 'admin') continue; 
                hasUsers = true;
                let user = users[u];
                let photo = user.photo || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
                
                let isProcessed = (user.status === 'approved' || user.status === 'rejected');
                let cardClass = isProcessed ? 'pending-user-card processed' : 'pending-user-card';
                
                let actionsHTML = '';
                if (user.status === 'pending') {
                    actionsHTML = `
                        <div class="action-btns">
                            <button class="btn-approve" onclick="processUser('${u}', 'approved')"><i class="fa-solid fa-check"></i> Approve</button>
                            <button class="btn-reject" onclick="processUser('${u}', 'rejected')"><i class="fa-solid fa-xmark"></i> Reject</button>
                        </div>
                    `;
                } else if (user.status === 'approved') {
                    actionsHTML = `<div class="status-text" style="color: #00ff88;"><i class="fa-solid fa-check-circle"></i> Approved</div>`;
                } else {
                    actionsHTML = `<div class="status-text" style="color: #ff4d4d;"><i class="fa-solid fa-times-circle"></i> Rejected</div>`;
                }

                usersHTML += `
                    <div class="${cardClass}">
                        <div class="p-user-top">
                            <img src="${photo}" alt="User" onclick="viewFullPhoto('${photo}')">
                            <div class="p-user-info">
                                <strong>${user.name}</strong>
                                <span><b>पदनाम:</b> ${user.designation || '-'}</span>
                                <span><b>कार्यालय:</b> ${user.office || '-'}</span>
                                <span><b>जिल्हा:</b> ${user.district || '-'}</span>
                                <span><b>मोबाईल:</b> ${user.mobile || '-'}</span>
                                <span><b>युजरनेम:</b> ${u}</span>
                                <span><b>पासवर्ड:</b> ${user.password || '-'}</span>
                            </div>
                        </div>
                        ${actionsHTML}
                    </div>
                `;
            }

            if (!hasUsers) {
                listContainer.innerHTML = '<div class="no-pending">No users found.</div>';
            } else {
                listContainer.innerHTML = usersHTML;
            }
        }

        function processUser(username, status) {
            let users = JSON.parse(localStorage.getItem('ow_users') || '{}');
            if (users[username]) {
                users[username].status = status;
                localStorage.setItem('ow_users', JSON.stringify(users));
                loadPendingUsers();
                checkPendingUsers();
            }
        }

        function viewFullPhoto(src) {
            document.getElementById('fullSizeImage').src = src;
            document.getElementById('photoViewer').style.display = 'flex';
        }

        function closePhotoViewer() {
            document.getElementById('photoViewer').style.display = 'none';
        }

        function downloadPhoto() {
            const imgSrc = document.getElementById('fullSizeImage').src;
            const a = document.createElement('a');
            a.href = imgSrc;
            a.download = 'User_Photo_' + Date.now() + '.jpg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function showLogoutModal() {
            document.getElementById('logoutModal').style.display = 'flex';
        }

        function closeLogoutModal() {
            document.getElementById('logoutModal').style.display = 'none';
        }

        function executeLogout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('userRole');
            localStorage.removeItem('displayName');
            window.location.href = 'index.html';
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('adminModal')) closeAdminPanel();
            if (event.target === document.getElementById('photoViewer')) closePhotoViewer();
            if (event.target === document.getElementById('logoutModal')) closeLogoutModal();
        }
    </script>
</body>
</html>
