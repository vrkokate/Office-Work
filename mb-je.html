<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Hub - JE Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="common.css">
    <style>
        .btn-cancel { display: none; }
    </style>
</head>
<body>

    <header class="top-header">
        <!-- 🌟 बॅक बटन दुरुस्त: mb-register.html -->
        <a href="mb-register.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="header-title">👷 कनिष्ठ अभियंता (JE) व्यवस्थापन</div>
        <a href="dashboard.html" class="home-icon"><i class="fa-solid fa-house"></i></a>
    </header>

    <div class="main-content">
        <div class="card-box">
            <input type="hidden" id="editIndex" value="-1">

            <div class="form-group">
                <input type="text" id="jeName" class="form-control" placeholder="कनिष्ठ अभियंत्याचे पूर्ण नाव *" required>
            </div>

            <button class="btn-save" id="saveBtn" onclick="saveJE()">Save JE</button>
            <button class="btn-save btn-cancel" id="cancelBtn" onclick="cancelEdit()">रद्द करा (Cancel)</button>

            <div class="table-container">
                <table id="jeTable">
                    <thead>
                        <tr>
                            <th style="width: 15%; text-align: center;">अ.क्र.</th>
                            <th style="width: 60%;">नाव</th>
                            <th style="width: 25%; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="jeTableBody"></tbody>
                </table>
            </div>

            <button class="btn-report" onclick="printReport()">
                <i class="fa-solid fa-print"></i> REPORT / PRINT
            </button>
        </div>
    </div>

    <div id="deleteAlert" class="custom-alert-overlay">
        <div class="custom-alert-box">
            <p>तुम्हाला ही नोंद नक्की डिलीट करायची आहे का?</p>
            <div class="alert-actions">
                <button class="btn-cancel-alert" onclick="closeDeleteAlert()">नाही (Cancel)</button>
                <button class="btn-confirm-alert" id="confirmDeleteBtn">होय (Delete)</button>
            </div>
        </div>
    </div>

    <!-- 🌟 खालचे ४ टॅब्स -->
    <div class="bottom-nav">
        <a href="mb-je.html" class="nav-item active">
            <i class="fa-solid fa-user-tie"></i><span>JE</span>
        </a>
        <a href="mb-register.html" class="nav-item">
            <i class="fa-solid fa-book"></i><span>MB</span>
        </a>
        <a href="mb-work-list.html" class="nav-item">
            <i class="fa-solid fa-hammer"></i><span>Work</span>
        </a>
        <a href="mb-bill-reg.html" class="nav-item">
            <i class="fa-solid fa-file-invoice-dollar"></i><span>Bill Reg</span>
        </a>
    </div>

    <script src="common.js"></script>
    <script>
        checkAuth();
        let jeRecords = [];
        let deleteTargetIndex = -1;

        function loadData() {
            let data = localStorage.getItem('mb_je_records');
            jeRecords = data ? JSON.parse(data) : [];
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('jeTableBody');
            tbody.innerHTML = '';
            if (jeRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">कोणतीही नोंद उपलब्ध नाही.</td></tr>';
                return;
            }
            jeRecords.forEach((je, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td style="text-align: center;">${index + 1}</td>
                        <td>${je.name}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" onclick="editJE(${index})">Edit</button>
                                <button class="btn-delete" onclick="showDeleteAlert(${index})">Delete</button>
                            </div>
                        </td>
                    </tr>`;
            });
        }

        function saveJE() {
            const nameInput = document.getElementById('jeName').value.trim();
            const editIndex = parseInt(document.getElementById('editIndex').value);
            if (!nameInput) { alert('कृपया कनिष्ठ अभियंत्याचे नाव टाका!'); return; }

            if (editIndex === -1) {
                jeRecords.push({ name: nameInput });
            } else {
                jeRecords[editIndex].name = nameInput;
            }
            localStorage.setItem('mb_je_records', JSON.stringify(jeRecords));
            cancelEdit();
            renderTable();
        }

        function editJE(index) {
            document.getElementById('jeName').value = jeRecords[index].name;
            document.getElementById('editIndex').value = index;
            document.getElementById('saveBtn').innerText = 'Update JE';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('jeName').value = '';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('saveBtn').innerText = 'Save JE';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function showDeleteAlert(index) {
            deleteTargetIndex = index;
            document.getElementById('deleteAlert').style.display = 'flex';
        }
        function closeDeleteAlert() {
            document.getElementById('deleteAlert').style.display = 'none';
            deleteTargetIndex = -1;
        }
        document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
            if (deleteTargetIndex !== -1) {
                jeRecords.splice(deleteTargetIndex, 1);
                localStorage.setItem('mb_je_records', JSON.stringify(jeRecords));
                closeDeleteAlert();
                renderTable();
            }
        });

        function printReport() {
            if (jeRecords.length === 0) { alert('प्रिंट करण्यासाठी नोंद नाही!'); return; }
            let printWindow = window.open('', '_blank');
            let html = `<html><head><title>JE Report</title><style>body{font-family:Arial;padding:20px;} h2{text-align:center;color:#0d47a1;} table{width:100%;border-collapse:collapse;} th,td{border:1px solid #333;padding:8px;text-align:left;} th{background:#f2f2f2;}</style></head><body><h2>JE यादी</h2><table><thead><tr><th>अ.क्र.</th><th>नाव</th></tr></thead><tbody>`;
            jeRecords.forEach((je, i) => { html += `<tr><td>${i + 1}</td><td>${je.name}</td></tr>`; });
            html += `</tbody></table></body></html>`;
            printWindow.document.write(html); printWindow.document.close(); printWindow.focus();
            setTimeout(() => { printWindow.print(); printWindow.close(); }, 500);
        }
        window.onload = loadData;
    </script>
</body>
</html>
